name: quality

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate-and-build:
    name: validate, reproduce and build site
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Tam geçmiş: sitemap lastmod tarihleri git geçmişinden hesaplanır.
          # Varsayılan sığ klonda (depth 1) her dosya HEAD commit'inin tarihini
          # alırdı - yani düzeltilen hatanın aynısı geri gelirdi.
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate data and reproduce generated files
        run: npm run check

      - name: Build production website
        run: npm run build:site

      - name: Verify lastmod snapshot is current
        # build:site tam geçmiş varken data/lastmod.json'u yeniden üretir.
        # Fark çıkıyorsa anlık görüntü bayat demektir: yerelde `npm run
        # build:site` çalıştırıp sonucu commit etmek gerekir. Aksi halde
        # sitemap eski tarihleri yayımlar ve kimse fark etmez.
        run: git diff --exit-code -- data/lastmod.json

      - name: Verify production output
        run: |
          test -f site/index.html
          test -f site/sitemap.xml
          test -f site/feed.xml
          test -f site/articles/iskenderiye.html
          test -f site/dist/zaman-cizelgesi.html
