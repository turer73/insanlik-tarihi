name: quality

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate-and-build:
    name: validate, reproduce and build site
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate data and reproduce generated files
        run: npm run check

      - name: Build production website
        run: npm run build:site

      - name: Verify production output
        run: |
          test -f site/index.html
          test -f site/sitemap.xml
          test -f site/feed.xml
          test -f site/articles/iskenderiye.html
          test -f site/dist/zaman-cizelgesi.html
