name: refresh generated files (temporary)

on:
  push:
    branches:
      - feat/canonical-v2-and-ui

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/canonical-v2-and-ui

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build generated artifacts
        run: npm run build

      - name: Commit generated artifacts
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/findings.bundle.json dist
          if git diff --cached --quiet; then
            echo "Üretilmiş dosyalarda değişiklik yok."
            exit 0
          fi
          git commit -m "chore: üretilmiş araçları yenile [skip ci]"
          git push
