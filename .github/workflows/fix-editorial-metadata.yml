name: Fix editorial image metadata

on:
  push:
    branches:
      - feat/kanit-atlasi-editorial-live-20260908
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kanit-atlasi-editorial-metadata
  cancel-in-progress: false

jobs:
  fix:
    if: ${{ github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[meta-fixed]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Align social and manifest metadata with generated files
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from 'node:fs/promises';

          const buildPath = 'scripts/build-site.mjs';
          let build = await readFile(buildPath, 'utf8');
          const widthMatches = build.match(/<meta property="og:image:width" content="480">/g) || [];
          const heightMatches = build.match(/<meta property="og:image:height" content="270">/g) || [];
          if (widthMatches.length !== 2 || heightMatches.length !== 2) {
            throw new Error(`Beklenen sosyal ölçü etiketleri bulunamadı: width=${widthMatches.length}, height=${heightMatches.length}`);
          }
          build = build
            .replaceAll('<meta property="og:image:width" content="480">', '<meta property="og:image:width" content="1200">')
            .replaceAll('<meta property="og:image:height" content="270">', '<meta property="og:image:height" content="675">');
          await writeFile(buildPath, build, 'utf8');

          const manifestPath = 'assets/editorial-manifest.json';
          const manifest = JSON.parse(await readFile(manifestPath, 'utf8'));
          for (const [slug, item] of Object.entries(manifest)) {
            const source = await readFile(`assets/covers-data/${slug}.js`, 'utf8');
            const match = source.match(/;base64,([^']+)'/);
            if (!match) throw new Error(`Kapak verisi çözülemedi: ${slug}`);
            item.file = `assets/covers/${slug}.webp`;
            item.bytes = Buffer.from(match[1], 'base64').byteLength;
            item.width = 1200;
            item.height = 675;
          }
          if (Object.keys(manifest).length !== 27) throw new Error('Manifest 27 kayıt içermiyor.');
          await writeFile(manifestPath, JSON.stringify(manifest, null, 2) + '\n', 'utf8');
          NODE

      - name: Run pre-commit checks
        shell: bash
        run: |
          set -euo pipefail
          npm run check
          npm run build:site
          git diff --check
          test -f site/assets/og-image.webp
          test "$(find site/assets/covers -maxdepth 1 -type f -name '*.webp' | wc -l)" = "27"

      - name: Commit, verify and push
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/fix-editorial-metadata.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: editoryal görsel meta verilerini gerçek çıktıyla eşleştir [meta-fixed]"
          npm run check
          npm run build:site
          git diff --exit-code -- data/lastmod.json
          git push origin HEAD:feat/kanit-atlasi-editorial-live-20260908
