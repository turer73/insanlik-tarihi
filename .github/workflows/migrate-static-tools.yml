name: migrate static tools (temporary)

on:
  push:
    branches:
      - feat/canonical-v2-and-ui

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/canonical-v2-and-ui

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Upgrade source templates
        run: node scripts/migrate-static-tools.mjs

      - name: Test upgraded templates
        run: npm test

      - name: Rebuild generated artifacts
        run: npm run build

      - name: Commit upgraded templates and outputs
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/browser.template.html tools/timeline.template.html data/findings.bundle.json dist
          if git diff --cached --quiet; then
            echo "Şablon ve çıktılarda değişiklik yok."
            exit 0
          fi
          git commit -m "fix: zaman çizelgesi ölçeği ve araç erişilebilirliği [skip ci]"
          git push
