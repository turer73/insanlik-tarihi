<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="İnsanlık Tarihi bulgularında kanıt, kaynak ve konum bağlantılarını denetleme aracı.">
  <title>Kanıt Denetimi · İnsanlık Tarihi</title>
  <style>
    :root{
      color-scheme:light dark;
      --bg:#eceae4;--surface:#f7f5f0;--raised:#fff;--ink:#171a1c;--muted:#565d62;
      --quiet:#7a8186;--rule:#cbc7bd;--soft:#dfdcd4;--accent:#264e6a;--accent-soft:#d9e5ec;
      --ok:#286343;--ok-soft:#d9eadf;--warn:#865f09;--warn-soft:#f1e5c4;
      --bad:#92382c;--bad-soft:#f1dbd6;--special:#60417f;--special-soft:#e6dcef;
      --mono:ui-monospace,SFMono-Regular,Consolas,"Liberation Mono",monospace;
      --sans:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      --serif:Georgia,"Times New Roman",serif;
    }
    @media(prefers-color-scheme:dark){
      :root{--bg:#111518;--surface:#181d21;--raised:#1e2429;--ink:#e7eaec;--muted:#a8afb4;
        --quiet:#7d858b;--rule:#343b41;--soft:#292f34;--accent:#8bb9d6;--accent-soft:#182b38;
        --ok:#78c99a;--ok-soft:#142a1e;--warn:#dfb75f;--warn-soft:#2c2514;
        --bad:#e08a7d;--bad-soft:#311b17;--special:#c0a2df;--special-soft:#291f34}
    }
    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 var(--sans);-webkit-font-smoothing:antialiased}
    a{color:var(--accent);text-underline-offset:3px}
    button,input,select{font:inherit;color:inherit}
    :focus-visible{outline:3px solid var(--accent);outline-offset:2px}
    .skip{position:absolute;left:-999px;top:0;background:var(--raised);padding:.7rem 1rem;z-index:20}
    .skip:focus{left:.75rem;top:.75rem}
    header{border-bottom:1px solid var(--rule);background:var(--surface)}
    .wrap{max-width:1280px;margin:auto;padding-inline:clamp(1rem,3vw,2.2rem)}
    .hero{padding-block:clamp(2rem,5vw,3.6rem) 1.5rem}
    .eyebrow{font:700 .7rem/1.2 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
    h1,h2,h3{font-family:var(--serif);letter-spacing:-.015em;text-wrap:balance}
    h1{font-size:clamp(2rem,5vw,3.5rem);line-height:1.02;margin:.55rem 0 .8rem;max-width:14ch}
    .lede{max-width:72ch;color:var(--muted);font-size:1rem;margin:0}
    .lede strong{color:var(--ink)}
    .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(135px,1fr));gap:1px;background:var(--rule);border:1px solid var(--rule);margin-top:1.4rem}
    .stat{background:var(--surface);padding:.75rem .9rem}
    .stat b{display:block;font:700 1.5rem/1.1 var(--serif)}
    .stat span{font:600 .68rem/1.3 var(--mono);color:var(--quiet);text-transform:uppercase;letter-spacing:.06em}
    main{padding-block:1.2rem 4rem}
    .controls{display:grid;grid-template-columns:minmax(220px,1fr) repeat(2,minmax(150px,220px));gap:.75rem;
      border:1px solid var(--rule);background:var(--surface);padding:.9rem;position:sticky;top:0;z-index:5}
    .field{display:flex;flex-direction:column;gap:.25rem}
    .field label{font:700 .65rem/1.2 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--quiet)}
    input,select{width:100%;min-height:40px;border:1px solid var(--rule);background:var(--raised);padding:.45rem .6rem;border-radius:0}
    .resultline{display:flex;justify-content:space-between;gap:1rem;align-items:center;flex-wrap:wrap;
      color:var(--quiet);font:500 .74rem/1.4 var(--mono);padding:.8rem .1rem}
    .resultline b{color:var(--ink)}
    .records{display:flex;flex-direction:column;gap:.7rem}
    details.record{border:1px solid var(--rule);background:var(--raised)}
    details.record[open]{border-color:var(--accent)}
    summary{list-style:none;cursor:pointer;padding:1rem;display:grid;grid-template-columns:auto 1fr auto;gap:.75rem;align-items:start}
    summary::-webkit-details-marker{display:none}
    summary:hover{background:var(--surface)}
    .claim{font-weight:650;line-height:1.4}
    .meta{display:flex;flex-wrap:wrap;gap:.25rem .7rem;margin-top:.3rem;color:var(--quiet);font:500 .67rem/1.4 var(--mono)}
    .chev{color:var(--quiet);font:700 .72rem/1.4 var(--mono);white-space:nowrap}
    details[open] .chev::before{content:"kapat −"}
    details:not([open]) .chev::before{content:"incele +"}
    .badge{display:inline-flex;align-items:center;padding:.22rem .46rem;font:700 .62rem/1.2 var(--mono);letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
    .established{background:var(--ok-soft);color:var(--ok)} .contested{background:var(--warn-soft);color:var(--warn)}
    .minority{background:var(--accent-soft);color:var(--accent)} .refuted{background:var(--bad-soft);color:var(--bad)}
    .unknown{background:var(--soft);color:var(--muted)} .unmeasurable{background:var(--special-soft);color:var(--special)}
    .body{border-top:1px solid var(--soft);padding:1rem;display:flex;flex-direction:column;gap:1rem}
    .auditfacts{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:1px;background:var(--soft);border:1px solid var(--soft)}
    .fact{background:var(--surface);padding:.65rem .75rem}
    .fact span{display:block;color:var(--quiet);font:700 .61rem/1.3 var(--mono);letter-spacing:.08em;text-transform:uppercase}
    .fact b{display:block;margin-top:.12rem;font-size:.85rem}
    .section{display:flex;flex-direction:column;gap:.5rem}
    .section h3{font-family:var(--mono);font-size:.67rem;letter-spacing:.1em;text-transform:uppercase;color:var(--quiet);margin:0}
    .items{display:flex;flex-direction:column;gap:.45rem}
    .item{border-left:3px solid var(--accent);background:var(--surface);padding:.72rem .8rem}
    .item.counter{border-left-color:var(--bad)}
    .item p{margin:0;color:var(--muted);max-width:84ch}
    .itemid{display:block;margin-bottom:.25rem;font:600 .62rem/1.3 var(--mono);color:var(--quiet)}
    .citations{display:flex;flex-wrap:wrap;gap:.32rem;margin-top:.55rem}
    .citation{display:inline-flex;flex-wrap:wrap;align-items:center;gap:.3rem;border:1px solid var(--rule);
      background:var(--raised);padding:.28rem .45rem;font:600 .66rem/1.35 var(--mono);text-decoration:none}
    .citation:hover{border-color:var(--accent)}
    .ctype{padding:.08rem .28rem;background:var(--accent-soft);color:var(--accent)}
    .ctype.counter{background:var(--bad-soft);color:var(--bad)}
    .sourcegrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:.5rem}
    .source{border:1px solid var(--rule);padding:.75rem;background:var(--surface)}
    .source .sid{font:600 .61rem/1.3 var(--mono);color:var(--quiet)}
    .source b{display:block;margin:.25rem 0 .15rem}
    .source p{margin:0;color:var(--muted);font-size:.82rem}
    .review-draft{color:var(--warn)} .review-editor-reviewed{color:var(--accent)} .review-expert-reviewed{color:var(--ok)}
    .empty{border:1px dashed var(--rule);padding:2.5rem 1rem;text-align:center;color:var(--quiet)}
    .legacy-note{margin-top:.8rem;color:var(--quiet);font-size:.78rem}
    @media(max-width:760px){
      .controls{grid-template-columns:1fr;position:static}
      summary{grid-template-columns:auto 1fr}.chev{grid-column:2}
    }
    @media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
  
/* Siteye geri donus */
.geri{display:inline-flex;align-items:center;gap:.4rem;font-family:var(--mono);font-size:.72rem;
  font-weight:600;letter-spacing:.05em;text-decoration:none;color:var(--muted);
  border:1px solid var(--rule);padding:.35rem .65rem;margin-bottom:.9rem;
  transition:color .15s ease,border-color .15s ease,background .15s ease}
.geri:hover{color:var(--accent);border-color:var(--accent);background:var(--accent-soft)}
.geri:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
</style>
</head>

<a class="skip" href="#content">İçeriğe geç</a>
<header>
  <div class="wrap hero">
    <a class="geri" href="https://kanitatlasi.com/">&#8592; Kanıt Atlası</a>
    <div class="eyebrow">İnsanlık Tarihi · araştırma altyapısı</div>
    <h1>Kanıt denetimi</h1>

    <div class="stats" id="stats" aria-label="Denetim özeti"></div>
    <p class="legacy-note" id="legacy-note"></p>

    </div>
    <div class="field">
      <label for="review">İnceleme durumu</label>
      <select id="review"><option value="">Tümü</option></select>
    </div>
  </section>

  <div class="resultline" id="resultline" aria-live="polite"></div>
  <section class="records" id="records" aria-label="Denetlenebilir bulgular"></section>
</main>

naklardır.","status":"contested","confidence":"medium","topic":["kapadokya","derinkuyu","matiate","islev"],"subject":{"site":"Kapadokya yer altı yerleşimleri ve Matiate","region":"Kapadokya ve Yukarı Mezopotamya","modern_country":"Türkiye","coordinates":{"lat":38.3735,"lon":34.7345}},"period":{"earliest":100,"latest":1000,"era_label":"Belgelenebilir kullanım dönemi","precision":"range","dating_method":["typology","historical-record"]},"languages":["Türkçe"],"disciplines":["arkeoloji","mimarlik"],"popular_claim":"Yer altı şehirleri saldırı anında sığınmak için kazılmış gizli sığınaklardır.","divergence":"Savunma özellikleri gerçektir - tek kişilik dar geçitler, içeriden kapatılan taş kapılar. AMA 'yalnızca sığınak' çerçevesi eksik: hem Derinkuyu'da hem Matiate'de mekanlar ÜRETİM VE DEPOLAMA işlevi taşıyor. Bakanlığın resmî sayfası Derinkuyu'da şarap üretim tesisleri, erzak depoları, kiliseler ve manastırlar sayar. Matiate'de hakemli çalışma A-1 ve A-4 mekanlarını üzüm işliği, silo ve şırahane olarak değerlendirir. Bunlar kısa süreli sığınmanın değil, SÜREGİDEN EKONOMİK KULLANIMIN işaretleridir. Doğru soru 'sığınak mı' değil, 'sığınma İLE üretim aynı mekânda nasıl birleşiyor'.","divergence_type":["kategori-hatasi","turizm-kopyalamasi"],"sources":[{"id":"kultur-portali-derinkuyu","tier":"institutional","type":"webpage","title":"Derinkuyu Yeraltı Şehri","institution":"T.C. Kültür ve Turizm Bakanlığı - Kültür Portalı","url":"https://www.kulturportali.gov.tr/turkiye/nevsehir/gezilecekyer/derinkuyu-yeralti-sehri","language":"tr","accessed":"2026-09-07","note":"Resmî kurumsal kaynak. Kapasite rakamı ve havalandırma bacası sayısı VERMEZ - bu yokluk kayıtlarda kanıt olarak kullanılmıştır."},{"id":"ersun-2021-matiate","tier":"peer-reviewed","type":"article","authors":["Ersun, Durmuş"],"year":2021,"title":"Matiate (Midyat) Yeraltı Şehri A-1 ve A-4 Mekanlarının İşlevine Yönelik Bir Değerlendirme","container":"Sinop Üniversitesi Sosyal Bilimler Dergisi","volume":"5(2)","pages":"1 f":"ersun-2021-matiate","locator":"Kapsam","support_type":"context"}]},{"id":"tarihleme-islev-baglantisi","text":"Hangi mekânın hangi dönemde hangi işlevle kullanıldığı tarihlenemediği için (bkz. kapadokya-tarihlenemez), işlev tartışması da kesin sonuca bağlanamaz.","citations":[{"source_ref":"derinkuyu-wikipedia-en","locator":"Tarihçe bölümü","support_type":"counter"}]}],"open_questions":["Sığınma ile üretim aynı mekânda nasıl birleşiyordu - mevsimlik mi, sürekli mi, dönemsel mi?","Üretim mekânları savunma mekânlarıyla aynı evreye mi ait? Tarihleme yapılamadığı için açık."],"checked":"2026-09-07","used_in":["kapadokya"],"supersedes":[],"review":{"status":"draft","notes":"BU KAYDIN ESASI DEĞİŞTİ. Önceki sürüm 'insan saldırılarından korunmak için yapılmış sığınaklardır' iddiasını established sayıyordu. Türkçe kaynaklar (Bakanlık resmî sayfası + Ersun 2021) her iki bölgede de üretim/depolama işlevi gösterdiği için iddia 'yalnızca sığınak' biçiminde daraltıldı ve contested'a çekildi."}},{"schema_version":2,"id":"gobekli-karahan-alan-karsilastirmasi","claim":"Karahan Tepe yüzey alanı olarak Göbekli Tepe'den büyüktür.","status":"refuted","confidence":"medium","topic":["gobekli-tepe","karahan-tepe","tas-tepeler","yontem"],"subject":{"site":"Göbekli Tepe ve Karahan Tepe","region":"Şanlıurfa, Yukarı Mezopotamya","modern_country":"Türkiye","coordinates":{"lat":37.2233,"lon":38.9224}},"period":{"earliest":-9600,"latest":-8000,"era_label":"Çanak Çömleksiz Neolitik A-B","precision":"range","dating_method":["radiocarbon","stratigraphy"]},"languages":["Türkçe","İngilizce"],"disciplines":["arkeoloji","jeoloji"],"popular_claim":"Karahan Tepe Göbekli Tepe'den daha büyüktür.","divergence":"Bu proje de aynı hatayı yaptı ve kaydı düzeltiyor. Karahan Tepe için dolaşan dört farklı rakam (10 / 13-14 / 15 / 32,5 ha) tabloya konup 'hangisi neyi sayıyor' diye soruldu - doğru bir uyarı. Ama AYNI SORU GÖBEKLİ TEPE İÇİN SORULMADI: Karahan'ın değişken aralığı, Göbekli'nin tek ve denetlenmemiş bi i-tahmin","text":"Saray kitaplığının 273'te zarar görmüş olması mümkündür, fakat bunu doğrudan söyleyen antik bir kaynak yoktur; sonuç saray bölgesindeki genel yıkımdan çıkarılır.","citations":[{"source_ref":"bagnall-2002-library-dreams","locator":"s. 358, ilk paragraf","support_type":"direct"}]},{"id":"serapeum-ayri-koleksiyon","text":"İskenderiye'de birden fazla kitaplık bulunmuş olabileceği için Caesar veya Aurelian dönemindeki bir yıkımın Serapeum'daki olası koleksiyonu zorunlu olarak sona erdirmesi gerekmez.","citations":[{"source_ref":"bagnall-2002-library-dreams","locator":"s. 358, ikinci ve üçüncü paragraflar","support_type":"direct"}]},{"id":"omer-anlatisi-gec","text":"Halife Ömer'in kitapları yaktırdığı anlatısı olaydan yüzyıllar sonra ortaya çıkar ve modern uzmanlık literatüründe tarihsel kurgu olarak değerlendirilir.","citations":[{"source_ref":"bagnall-2002-library-dreams","locator":"s. 357, ilk paragraf ve dn. 37","support_type":"direct"}]}],"counter_evidence":[{"id":"strabon-sessizligi-belirsiz","text":"Strabon Caesar yangınından sonra Mouseion'u betimlerken kitaplıktan açıkça söz etmez; bu sessizlik hem süreklilik hem de kayıp yönünde kesin kanıt sayılamaz.","citations":[{"source_ref":"bagnall-2002-library-dreams","locator":"s. 357, dn. 39","support_type":"counter"}]}],"sources":[{"id":"bagnall-2002-library-dreams","tier":"peer-reviewed","type":"article","authors":["Bagnall, Roger S."],"year":2002,"title":"Alexandria: Library of Dreams","container":"Proceedings of the American Philosophical Society","volume":"146(4)","pages":"348-362","url":"https://archive.nyu.edu/handle/2451/28263","language":"en","accessed":"2026-09-07"}],"open_questions":["Saray kitaplığı tam olarak ne zaman ve hangi ölçekte işlevini yitirdi?","Serapeum'da geç antikçağa kadar yaşayan koleksiyonun kapsamı neydi?"],"checked":"2026-09-07","used_in":["iskenderiye"],"review":{"status":"draft","notes":"Kaynak-konum zinciri kuruldu; konu uzmanı incelemesi henüz yapılmadı."}},{"schema_ve 9, ikinci paragraf","support_type":"direct"}]},{"id":"kopyalarin-hayatta-kalma-secimi","text":"Antik eserlerin çoğu birden fazla nüsha hâlinde bulunuyordu; belirleyici sorun tek bir merkezdeki yıkımdan çok, nüshaların sonraki yüzyıllarda kopyalanmaya devam edip etmemesiydi.","citations":[{"source_ref":"bagnall-2002-library-dreams","locator":"s. 360, ilk paragraf","support_type":"direct"}]}],"counter_evidence":[{"id":"yanginlar-onemsiz-degil","text":"Yangın ve savaşlar belirli koleksiyonları gerçekten yok etmiş olabilir; kaynaklar, toplam kayıpta fiziksel felaket ile uzun süreli kurumsal çözülmenin payını nicel olarak ayırmaya yetmez.","citations":[{"source_ref":"bagnall-2002-library-dreams","locator":"s. 356-360","support_type":"counter"}]}],"sources":[{"id":"bagnall-2002-library-dreams","tier":"peer-reviewed","type":"article","authors":["Bagnall, Roger S."],"year":2002,"title":"Alexandria: Library of Dreams","container":"Proceedings of the American Philosophical Society","volume":"146(4)","pages":"348-362","url":"https://archive.nyu.edu/handle/2451/28263","language":"en","accessed":"2026-09-07"}],"open_questions":["İskenderiye koleksiyonlarında kopyalama hızını ve bütçeyi gösteren kayıp idari kayıtlar var mıydı?","Tek tek eserlerin aktarım zincirinde hangi seçim mekanizması daha belirleyiciydi?"],"checked":"2026-09-07","used_in":["iskenderiye"],"review":{"status":"draft","notes":"Ana sentez kaynağındaki sayfa konumları bağlandı; ikinci uzmanlık kaynağıyla çapraz inceleme önerilir."}},{"schema_version":2,"id":"iskenderiye-metin-elestirisi-dogdu","claim":"Metin eleştirisi, İskenderiye'de Homeros metinlerinin karşılaştırılması ve standartlaştırılmasıyla ilk sürekli kurumsal programına kavuştu.","status":"established","confidence":"high","topic":["iskenderiye","metin-elestirisi","yontem-tarihi"],"subject":{"site":"İskenderiye Mouseion","region":"Helenistik Mısır","modern_country":"Mısır","coordinates":{"lat":31.2001,"lon":29.9187}},"period":{"earliest":-280,"latest":-1 ounter_evidence":["Örneklem küçük ve coğrafi olarak dağınık; ağaçları bilinen göç yollarıyla güvenilir biçimde eşleştirmek mümkün değil.","Alternatif açıklamalar dışlanmıyor: bağımsız gelişim, sömürgecilik, misyoner faaliyeti ve komşular arası yayılma aynı deseni üretebilir.","Anlatı gelenekleri akışkandır; 'uluslararası masal tipi' denen birimin kendisi modern bir kurgudur, doğal bir birim değil.","Sonuçların karşılaştırılabileceği bağımsız olarak bilinen bir cevap yok - yöntem sınanamıyor."],"open_questions":["Yöntem, cevabı dilbilimden bilinen Hint-Avrupa vakasında sınanırsa doğru ağacı verir mi? Bu test yapılmalı."],"sources":[{"tier":"peer-reviewed","type":"article","authors":["d'Huy, Julien"],"year":2013,"title":"A Cosmic Hunt in the Berber sky: a phylogenetic reconstruction of Palaeolithic mythology","container":"Les Cahiers de l'AARS","volume":"15","pages":"93-106","language":"en"},{"tier":"peer-reviewed","type":"chapter","title":"Phylogenetics Meets Folklore: Bioinformatics Approaches to the Study of International Folktales","url":"https://link.springer.com/content/pdf/10.1007/978-3-319-39445-9_6.pdf","language":"en","accessed":"2026-09-07"},{"tier":"peer-reviewed","type":"article","title":"The Cultural Transmission and Evolution of Folk Narratives","url":"https://durham-repository.worktribe.com/OutputFile/1642267","language":"en","accessed":"2026-09-07","note":"Yönteme yöneltilen itirazların kaynağı."}],"checked":"2026-09-07","volatile":true,"used_in":["gokteki-ayi"]},{"id":"gokteki-av-bering-oncesi","claim":"Büyük Ayı takımyıldızının avlanan bir hayvan olarak görülmesi, Bering geçişinden önceki ortak bir mitolojik mirastan gelir.","status":"unknown","confidence":"medium","topic":["mitoloji","gokteki-av","arkeoastronomi","bering"],"subject":{"site":"Kuzey Avrasya ve Kuzey Amerika","region":"Kuzey yarımküre","modern_country":"çok uluslu"},"period":{"earliest":-15000,"latest":1900,"era_label":"Bering geçişinden etnografik derlemelere","precision":"disputed", _ref":"thompson-2013-witzel-degerlendirmesi","locator":"Ölçüt tutarlılığı itirazı","support_type":"counter"}]},{"id":"istisna-fazlaligi","text":"İstisna sayısı şemayı zayıflatacak kadar çok: 'şu grupta bulunmaz' denen motifler öteki grupta bulunabiliyor.","citations":[{"source_ref":"thompson-2013-witzel-degerlendirmesi","locator":"İstisnalar","support_type":"counter"}]},{"id":"eskimis-derlemeler","text":"Kullanılan derlemelerin önemli bölümü güncelliğini yitirmiş kaynaklardır.","citations":[{"source_ref":"thompson-2013-witzel-degerlendirmesi","locator":"Kaynak tabanı eleştirisi","support_type":"counter"}]},{"id":"hiyerarsi-kaygisi","text":"Ayrım, gruplar arasında bir kültürel hiyerarşi kuruyor ve bu, ırksal önyargı kaygısı doğuruyor.","citations":[{"source_ref":"thompson-2013-witzel-degerlendirmesi","locator":"Hiyerarşi itirazı","support_type":"counter"}]},{"id":"dogrulama-yanliligi","text":"Destekleyici olarak sunulan diğer alanlardan gelen kanıtların önemli bölümü tartışmalı veya belirsiz; teze ters düşen yorumlar da mevcut - doğrulama yanlılığı işareti.","citations":[{"source_ref":"thompson-2013-witzel-degerlendirmesi","locator":"Yan alan kanıtlarının değerlendirmesi","support_type":"counter"}]},{"id":"tam-metin-okunmadi","text":"Bu kayıttaki itirazların ayrıntısı değerlendirmenin TAM METNİNDEN değil, kaydın önceki sürümünden devralınmıştır. Künye ve yazar doğrulandı; itirazların metindeki tam ifadesi doğrulanmadı.","citations":[{"source_ref":"thompson-2013-witzel-degerlendirmesi","locator":"Kayıt düzeyi sınırı","support_type":"context"}]}],"open_questions":["İki aile ayrımı, ölçütler tutarlı uygulandığında ayakta kalır mı?","Thompson'ın değerlendirmesinin tam metni okunduğunda itirazlar burada yazıldığı gibi mi duruyor?"],"checked":"2026-09-09","used_in":["gokteki-ayi"],"review":{"status":"draft","notes":"Ölü kaynak canlı sürümüyle değiştirildi, yazar ve yıl eklendi, tier kitap değerlendirmesi olduğu için institutional'a düşürüldü. Tam metinler okunmadı."}},{"id":"motif-yoklugu-cevre","claim":"Bir mitolojik motifin bir gelenekte bulunmaması her zaman kültürel mesafeyi gösterir.","status":"refuted","confidence":"high","topic":["mitoloji","yontem","cevre"],"subject":{"site":"İnuit bölgesi - ağaç sınırının kuzeyi","region":"Kuzey Kutbu","modern_country":"Kanada / Grönland / ABD (Alaska)","coordinates":{"lat":68,"lon":-100}},"period":{"earliest":1000,"latest":1950,"era_label":"Etnografik derleme dönemi","precision":"range","dating_method":["historical-record"]},"disciplines":["antropoloji","jeoloji"],"popular_claim":"Dünya ağacı motifi neredeyse evrenseldir; bulunmadığı yerler bu evrensel mirastan kopmuş demektir.","divergence":"İnuit geleneğinde dünya ağacı yok - ve sebebi kültürel uzaklık değil, AĞAÇ SINIRININ KUZEYİNDE YAŞAMAK. Bir motifin yokluğu bazen sadece o şeyin orada bulunmadığını gösterir. Karşılaştırmalı mitolojinin en sık atladığı nokta budur: karşılaştırılan halklar AYNI MALZEMEYE SAHİP DEĞİLDİR. Evrensellik iddiaları en çok burada tökezliyor.","divergence_type":["kategori-hatasi"],"evidence":["Dünya ağacı motifi Hint, Çin, İskandinav ve Sibirya geleneklerinde merkezî yer tutar.","İnuit yerleşim bölgesinin büyük bölümü ağaç sınırının kuzeyindedir; ağaç yerel çevrede bulunmaz."],"counter_evidence":["Çevresel açıklama her yokluk için geçerli değildir; bazı yokluklar gerçekten kültürel ayrışmayı gösterir. Bu kayıt 'her zaman kültürel mesafe' iddiasını çürütür, çevrenin her zaman belirleyici olduğunu savunmaz.","Sürüklenmiş odun (driftwood) İnuit maddi kültüründe kullanılıyordu; ağacın tamamen bilinmediği söylenemez."],"sources":[{"tier":"peer-reviewed","type":"chapter","title":"Phylogenetics Meets Folklore: Bioinformatics Approaches to the Study of International Folktales","url":"https://link.springer.com/content/pdf/10.1007/978-3-319-39445-9_6.pdf","language":"en","accessed":"2026-09-07","note":"Çevre ve motif dağılımı ilişkisi tartışması için."}],"checked":"2026-09-07","used_in":["gokteki-ayi"]},{"id":"gelenek-tek "gokteki-ayi"]},{"id":"yanlis-teslim-olum-motifi","claim":"Sahra altı Afrika'nın geniş bir bölümünde ölümün kökeni bir ceza değil, yanlış teslim edilmiş bir mesajla açıklanır.","status":"established","confidence":"high","topic":["mitoloji","olum-kokeni","afrika","motif-dagilimi"],"subject":{"site":"Sahra altı Afrika","region":"Afrika","modern_country":"çok uluslu"},"period":{"earliest":1850,"latest":1960,"era_label":"Etnografik derleme dönemi","precision":"range","dating_method":["historical-record"]},"languages":["Bantu dilleri","Khoisan dilleri"],"disciplines":["antropoloji","dilbilim"],"people":[{"name":"Abrahamsson, Hans","role":"analyst","year":1951}],"popular_claim":"Ölümün bir yasağın çiğnenmesinin cezası olduğu fikri evrenseldir.","divergence":"Değil. Bu anlatı tipinde ölüm AHLAKİ BİR SONUÇ DEĞİL, İDARİ BİR KAZADIR: kimse yasak meyve yemez, kimse tanrıları kızdırmaz. Tanrı ölümsüzlük veya yeniden doğuş haberini gönderir; ikinci bir haberci - ya da kulak misafiri olan biri - tersini taşır. Yavaş olan gecikir, hızlı olan önce varır ve ilk duyulan mesaj bağlayıcı olur. 'Ölüm cezadır' kalıbının evrensel sanılması, tanıdık olanı evrensel sanmanın örneğidir.","divergence_type":["kategori-hatasi","ideolojik-secim"],"evidence":["En yaygın haberci çifti bukalemun (yavaş, iyi haber) ve kertenkeledir (hızlı, kötü haber).","Malavi'deki Tumbuka anlatımında haberi gönderen Chiuta'dır; bukalemun yeniden doğuş, kertenkele kalıcı ölüm haberiyle yola çıkar ve kertenkele önce varır.","Bazı anlatımlarda iki ayrı haberci, bazılarında tek haberci vardır ve mesaj yolda bozulur ya da çalınıp çarpıtılır.","Değişmeyen çekirdek: ölüm bir ceza değil, bir iletişim kazasıdır ve geri alınamaz."],"counter_evidence":["Afrika derlemelerinin büyük bölümü misyonerler aracılığıyla yapıldı; 'ölüm bir ceza' kalıbının yerel anlatılara sızma ihtimali her vakada ayrıca elenmeli - çoğu çalışmada bu yapılmıyor.","'Sahra altı Afrika' tek bir gelenek değildir; bu genelleme kaba bir taramadır."],"sources dan yanlışlıyor."],"counter_evidence":["Tipler saf değildir; aynı bölgede birden fazla tip bulunabilir ve karma anlatımlar vardır.","Tip sınıflandırmasının kendisi analistin kurduğu bir birimdir; doğal bir kategori değil."],"sources":[{"tier":"primary","type":"edition","title":"Gılgamış Destanı, XI. tablet (gençlik otu ve yılan)","language":"akk"},{"tier":"primary","type":"edition","title":"Kojiki (İzanagi - İzanami, günlük ölüm ve doğum sayısı)","year":712,"language":"ja"},{"tier":"peer-reviewed","type":"book","authors":["Abrahamsson, Hans"],"year":1951,"title":"The Origin of Death: Studies in African Mythology","language":"en"}],"checked":"2026-09-07","used_in":["gec-kalan-haberci"]},{"id":"khoisan-arkaik-varyant","claim":"Yanlış-teslim motifinin en arkaik varyantı Khoisan bölgesinde köklenir ve bu, mit ağacı ile nüfus ağacının aynı noktayı gösterdiği bir vakadır.","status":"contested","confidence":"low","topic":["mitoloji","olum-kokeni","afrika","yontem"],"subject":{"site":"Khoisan bölgesi","region":"Güney Afrika","modern_country":"çok uluslu","coordinates":{"lat":-24,"lon":21}},"period":{"earliest":-50000,"latest":1960,"era_label":"İddia edilen köken derinliğinden derleme dönemine","precision":"disputed","dating_method":["none"]},"languages":["Khoisan dilleri"],"disciplines":["antropoloji","genetik","dilbilim"],"popular_claim":"Bilim, insanlığın en eski mitinin izini sürdü.","divergence":"Bulgu ilgi çekici: bölgesel analiz ve filogenetik araçlarla yapılan çalışma, motifin tek habercili en arkaik varyantının Khoisan bölgesinde köklendiğini gösteriyor - ve Khoisan halkları insan genetik çeşitliliğinin bilinen en derin dalını temsil eder. İki bağımsız disiplin aynı noktayı işaret ediyor. AMA tam da bu yüzden dikkatli olmak gerekiyor: araştırmacı BEKLENEN CEVABI ÖNCEDEN BİLİYOR. Khoisan'ın en derin dal olduğu genetikte yerleşik bilgi. Biyolojide filogenetik yöntemler tam bu yüzden cevabı bilinmeyen vakalarda sınanır. Sonucun aranan sonuçla örtüşmesi, doğrulama yanlılığının en klasik zeminidir.","divergence_type":["medya-abartisi","provenans-yoklugu"],"evidence":["Motifin Afrika içi dağılımı bölgesel analiz ve filogenetik araçlarla incelendi.","En arkaik varyant - mesajın tek haberciyle taşınıp yolda bozulduğu biçim - Khoisan bölgesinde köklenmiş görünüyor.","Khoisan halkları insan genetik çeşitliliğinin bilinen en derin dalını temsil eder."],"counter_evidence":["Araştırmacı beklenen cevabı önceden biliyordu - doğrulama yanlılığı riski yüksek.","Yöntem hâlâ kalibre edilmedi: mit filogenetiği cevabı bağımsız olarak bilinen vakalarda sınanmadı (bkz. mit-filogenetigi-kalibre-degil).","Misyoner aracılı derleme sorunu bu motif için özellikle ağır."],"open_questions":["Sonuç, araştırmacının beklentisinden bağımsız olarak üretilebilir mi? Kör bir yeniden analiz gerekiyor."],"sources":[{"tier":"peer-reviewed","type":"article","title":"En Afrique, pourquoi meurt-on ? Essai sur l'histoire d'un mythe africain","url":"https://ouci.dntb.gov.ua/en/works/4rJO6MX4/","language":"fr","accessed":"2026-09-07","note":"Motifin bölgesel analizi ve filogenetik yeniden kurulumu."},{"tier":"peer-reviewed","type":"book","authors":["Abrahamsson, Hans"],"year":1951,"title":"The Origin of Death: Studies in African Mythology","language":"en"}],"checked":"2026-09-07","volatile":true,"supersedes":[],"used_in":["gec-kalan-haberci"]},{"id":"everywhen-dogrusal-olmayan-zaman","claim":"Avustralya yerli geleneklerindeki 'Rüya', geçmişte kalmış bir yaratılış dönemi değil, geçmiş-şimdi-geleceğin aynı anda mevcut olduğu bir gerçekliktir.","status":"established","confidence":"high","topic":["mitoloji","avustralya","zaman-kavrami","yontem"],"subject":{"site":"Avustralya yerli gelenekleri","region":"Avustralya","modern_country":"Avustralya","coordinates":{"lat":-25,"lon":133}},"period":{"earliest":1930,"latest":2026,"era_label":"Antropolojik kavramsallaştırma dönemi","precision":"range","dating_method":["historical-record"]},"languages":["Avustralya yerli dilleri","İngili span":"1885-1964"},{"name":"Campbell, Joseph","role":"proposer","year":1949,"lifespan":"1904-1987"}],"popular_claim":"Bilim, dünyanın bütün mitlerinde bulunan ortak kahraman iskeletini keşfetti.","divergence":"Akademik folklorcular ve antikçağ edebiyatı uzmanları teoriyi neredeyse oybirliğiyle reddediyor. Başlıca gerekçe KAYNAK SEÇME YANLILIĞI: kalıp yalnızca kalıba uyan anlatılar seçilerek kuruldu, uymayan ve en az onlar kadar geçerli anlatılar dışarıda bırakıldı. İkinci gerekçe YANLIŞLANAMAZLIK: aşamalar o kadar soyut ki mecazi okumaya izin verildiğinde neredeyse her anlatı uyuyor - markete ekmek almaya gitmek dahil. Bir çerçeve her şeyi açıklıyorsa hiçbir şeyi ayırt etmiyor demektir.","divergence_type":["medya-abartisi","ideolojik-secim"],"evidence":["Aynı malzemeye bakan üç analist üç FARKLI liste çıkardı: Rank doğum anlatılarına, Raglan 22 maddeye, Campbell 17 aşamaya. Kalıp veride olsaydı yakınsama beklenirdi; yakınsamadılar.","Kalıba uymayan merkezî metinler var: Gılgamış gençlik otunu elde eder ama yılana kaptırır - 'iksirle dönüş' aşaması yoktur.","Düzenbaz anlatıları (Çakal, Anansi) bölüm bölümdür, bir yay çizmez; kahraman dönüşmez ve çoğu zaman kaybeder.","Kalıp DÜZ BİR ZAMAN ÇİZGİSİ varsayar; zamanı böyle örgütlemeyen gelenekler testten otomatik sıfır alır (bkz. yaratilis-sorusu-alet-yanliligi)."],"counter_evidence":["Anlatılarda gerçek düzenlilikler vardır; bu kayıt onların varlığını değil, monomitin evrensellik iddiasını reddeder.","'Neredeyse oybirliği' bir sayım değil, alan içi değerlendirmelere dayanan nitel bir ifadedir.","Kalıp bir SENARYO ARACI olarak fiilen çalışır; itiraz araca değil, aracın keşif diye sunulmasınadır."],"open_questions":["Kültürler arası gerçek anlatı düzenliliklerinin ölçeği nedir? Monomit bu soruyu cevaplamıyor, atlıyor."],"sources":[{"tier":"peer-reviewed","type":"book","authors":["Campbell, Joseph"],"year":1949,"title":"The Hero with a Thousand Faces","language":"en","note":"İncelenen tezin kendisi; kanıt olarak değil."},{"tier":"institutional","type":"webpage","title":"Why Folklorists Hate Joseph Campbell's Work","authors":["Jorgensen, Jeana"],"url":"https://www.patheos.com/blogs/foxyfolklorist/why-folklorists-hate-joseph-campbells-work/","language":"en","accessed":"2026-09-07","note":"Folklorcu perspektifinden itirazların özeti."},{"tier":"institutional","type":"webpage","title":"The \"hero's journey\" isn't as universal as you think","url":"https://bigthink.com/high-culture/monomyth-heros-journey-campbell/","language":"en","accessed":"2026-09-07"}],"checked":"2026-09-07","used_in":["kendi-kaniti"]},{"id":"monomit-geri-besleme-dongusu","claim":"Monomitin bugün 'her hikâyede' bulunmasının sebebi evrensellik değil, kalıbın senaryo şablonuna çevrilmiş olmasıdır; çıktı girdinin kanıtı sayılmaktadır.","status":"established","confidence":"medium","topic":["mitoloji","monomit","yontem","kanit-uretimi"],"subject":{"site":"Hollywood senaryo pratiği","region":"ABD ve küresel sinema","modern_country":"ABD"},"period":{"earliest":1949,"latest":2026,"era_label":"Teoriden şablona, şablondan kanıta","precision":"range","dating_method":["historical-record"]},"languages":["İngilizce"],"disciplines":["antropoloji","sanat-tarihi","sosyoloji"],"people":[{"name":"Campbell, Joseph","role":"proposer","year":1949},{"name":"Vogler, Christopher","role":"editor","affiliation":"Walt Disney Studios","year":1985}],"popular_claim":"Bakın, bütün filmlerde ve hikâyelerde aynı kalıp var - demek ki kalıp evrensel.","divergence":"Döngü dört adımlı ve kapalı: (1) 1949'da seçilmiş mitlerden bir kalıp çıkarılır; (2) 1980'lerde kalıp senaryo yazımı için bir reçeteye çevrilir; (3) filmler bu şablona göre yazılır ve kalıba tam uyar; (4) bu filmler gösterilip 'her hikâyede var' denerek teoriye kanıt sayılır. Kritik adım dördüncüsüdür: filmlerin kalıba uymasının sebebi kalıbın evrensel olması DEĞİL, filmlerin kalıba göre yazılmış olmasıdır. Çıktıyı girdinin kanıtı saymak döngüyü kapatıyor.","divergence_type":["medya-abartisi","hayatta-kalma-yanliligi"],"evidence":["Kalıp 1980'lerde bir stüdyo içi not aracılığıyla senaryo yazımı reçetesine çevrildi ve sonra kitaplaştırıldı.","Şablon senaryo eğitiminde ve yazarlık kılavuzlarında standart hâle geldi.","Aynı mekanizma serinin başka yerlerinde de görüldü: turizm anlatısının kendi kanıtını üretmesi, popüler kaynakların birbirini kopyalayarak 'çok kaynak' görünümü yaratması."],"counter_evidence":["Şablonun sinema anlatısına yayılma oranı bu kayıtta niceliksel olarak ölçülmedi; mekanizma tarif edildi, büyüklüğü verilmedi.","Kalıp bir anlatı aracı olarak gerçekten çalışır ve iyi yapılandırılmış hikâyeler üretir; bu kayıt aracı değil, 'keşfedilmiş evrensel yapı' iddiasını hedef alır."],"open_questions":["Şablonun yaygınlığı niceliksel olarak ölçülebilir mi? Ölçülmedi."],"sources":[{"tier":"institutional","type":"webpage","title":"The \"hero's journey\" isn't as universal as you think","url":"https://bigthink.com/high-culture/monomyth-heros-journey-campbell/","language":"en","accessed":"2026-09-07"},{"tier":"institutional","type":"webpage","title":"Why Folklorists Hate Joseph Campbell's Work","authors":["Jorgensen, Jeana"],"url":"https://www.patheos.com/blogs/foxyfolklorist/why-folklorists-hate-joseph-campbells-work/","language":"en","accessed":"2026-09-07"}],"checked":"2026-09-07","used_in":["kendi-kaniti"]},{"id":"kapsam-disiplini-ilkesi","claim":"Tanımlı bir külliyat üzerine kurulmuş anlatı iddiaları sınanabilir; 'tüm insanlık' üzerine kurulanlar sınanamaz.","status":"established","confidence":"high","topic":["mitoloji","yontem","bilim-felsefesi"],"subject":{"site":"Anlatı çözümlemesi yöntemi","region":"kuramsal","modern_country":"çok uluslu"},"period":{"earliest":1928,"latest":1949,"era_label":"Propp'tan Campbell'a","precision":"range","dating_method":["historical-record"]},"languages":["Rusça","İngilizce"],"disciplines":["filoloji","antropoloji","felsefe"],"people":[{"name":"Propp, Vladimir","role":"proposer","year":1928,"lifespan":"1895-1970"},{"name":"Campbell, Joseph","role":"critic","year":1949}],"popular_claim":"Daha geniş kapsamlı bir kuram daha güçlü bir kuramdır.","divergence":"Tersi. 1928'de Rus halk masalları üzerine yapılan çözümleme, anlatıları işlevlere ayırdı ve iddiasını BELİRLİ BİR DERLEMEDEKİ BELİRLİ BİR MASAL TÜRÜ ile sınırladı. Külliyat açıkça tanımlı olduğu için iddia test edilebilir: o derlemeye bakıp uymayan masal aranabilir. Monomit ise dünyanın bütün mitolojisi hakkında konuşur; külliyat tanımlı değildir, dolayısıyla uymayan bir anlatı bulunduğunda teori düşmez - o anlatı ya kapsam dışı sayılır ya da mecazi okumayla uydurulur. YANLIŞLAYACAK BİR GÖZLEM TANIMLANAMIYOR. 'Tüm insanlıkta ortak' iddiası kulağa daha büyük gelir ama bilgi değeri daha düşüktür.","divergence_type":["kategori-hatasi"],"evidence":["Propp'un iddiası tanımlı bir derlemedeki sihirli masallarla sınırlıydı ve bu yüzden sınanabilir.","Monomitin külliyatı tanımlı değildir; hangi anlatıların dahil olduğu baştan belirlenmemiştir.","Bir iddianın değeri neyi DIŞARIDA BIRAKTIĞIYLA ölçülür."],"counter_evidence":["Propp'un çözümlemesi de eleştirildi: işlev birimlerinin esnekliği ve külliyat seçimi tartışıldı. Buradaki üstünlük sonuçta değil, yöntemde - iddia sınanabilir biçimde kurulmuştu."],"sources":[{"tier":"peer-reviewed","type":"book","authors":["Propp, Vladimir"],"year":1928,"title":"Morphology of the Folktale","language":"ru","note":"Tanımlı külliyat üzerine kurulmuş sınanabilir iddianın örneği."},{"tier":"peer-reviewed","type":"book","authors":["Campbell, Joseph"],"year":1949,"title":"The Hero with a Thousand Faces","language":"en","note":"İncelenen tezin kendisi; kanıt olarak değil."}],"checked":"2026-09-07","used_in":["kendi-kaniti"]},{"id":"ates-hirsizligi-zorunlu-motif","claim":"Ateşin insanlara başka birinden geçmesi motifinin yaygınlığı, ortak köken kanıtı değildir.","status":"established","confidence":"high","topic":["mitoloji","ates-hirsizligi","motif-dagilimi","yontem"],"subject":{"site":"Yunan, Polinezya, Kuzeybatı Kıyısı, Vedik gelenekler","region":"küresel","modern_country":"çok uluslu"},"period":{"earliest":-700,"latest":1900,"era_label":"Hesiodos'tan etnografik derlemelere","precision":"range","dating_method":["textual","historical-record"]},"languages":["Grekçe","Maori","Tlingit","Sanskritçe"],"disciplines":["antropoloji","filoloji","dilbilim"],"popular_claim":"Ateş hırsızlığı anlatısı dünyanın her yerinde var; bu, hepsinin ortak bir kökenden geldiğini gösterir.","divergence":"Motif gerçekten yaygın ama BİLGİLENDİRİCİ DEĞİL, çünkü zorunlu uçta duruyor. Ateşin gündelik gerçeği şudur: ateş yoktan yaratılmaz, ELDE EDİLİR - yıldırımdan alınır, başka kamptan getirilir, sürtmeyle çıkarılır. Dolayısıyla 'ateş başlangıçta bizde değildi, birinden alındı' anlatısı ateşle yaşayan her toplulukta kendiliğinden makuldür. Ortak ata gerekmiyor, ateşin fiziği yetiyor. Üç anlatının paylaştığı şey bir hikâye değil, bir CÜMLE ŞABLONUDUR.","divergence_type":["kategori-hatasi","medya-abartisi"],"evidence":["Prometheus tanrılardan ateşi ÇALAR ve sonsuza kadar cezalandırılır.","Māui ateşi Mahuika'dan tırnak tırnak ALIR ve tüketir; kaçar, cezalandırılmaz; ateş ağaçlara sığınır ve bu, sürtmeyle ateş yakmayı açıklar.","Kuzgun anlatısının çekirdeği ateş değil IŞIK hırsızlığıdır; ateş yalnızca bazı anlatımlarda geçer.","Vedik gelenekte Mātariśvan ateşi gökten getirir ama hilebaz değildir.","Ortak olan yalnızca en soyut düzeyde: ateş başlangıçta insanlarda değil, birinde var, kurnaz bir figür alıyor, insanlar kullanabiliyor."],"counter_evidence":["Bölgesel alt-desenler bilgilendirici OLABİLİR: belirli bir bölgede paylaşılan keyfî ayrıntılar (örneğin ateşi hayvanlar arasında bayrak yarışıyla taşımak) temas ya da yerel ortak köken gösterebilir. Bu kayıt o düzeye inmemiştir.","'Polinezya' ve 'Kuzeybatı Kıyısı' başlıkları çok sayıda ayrı geleneği kapsar."],"open_questions":["Motifin bölgesel alt-desenleri nelerdir? Asıl iş orada, bu kayıt genel motif düzeyinde kaldı."],"sources":[{"tier":"primary","type":"edition","authors":["Hesiodos"],"title":"Theogonia ve İşler ve Günler (Prometheus anlatısı)","language":"grc"},{"tier":"institutional","type":"webpage","title":"Theft of fire","container":"Wikipedia","url":"https://en.wikipedia.org/wiki/Theft_of_fire","language":"en","accessed":"2026-09-07","note":"Ara kaynak; motif dağılımının genel görünümü için."}],"checked":"2026-09-07","used_in":["calinan-ates"]},{"schema_version":2,"id":"prometheus-pramantha-etimolojisi","claim":"Prometheus adı Sanskritçe pramantha (ateş burgusu) sözcüğünden gelir ve bu, Hint-Avrupa ortak kökeninin kanıtıdır.","status":"refuted","confidence":"medium","topic":["mitoloji","ates-hirsizligi","dilbilim","yontem"],"subject":{"site":"Yunan ve Vedik gelenekler","region":"Hint-Avrupa dil alanı","modern_country":"çok uluslu"},"period":{"earliest":-700,"latest":2026,"era_label":"Anlatının yazımından etimoloji tartışmasına","precision":"range","dating_method":["textual"]},"languages":["Grekçe","Sanskritçe"],"disciplines":["dilbilim","filoloji","antropoloji"],"people":[{"name":"Müller, Max","role":"proposer","year":1870,"lifespan":"1823-1900"}],"popular_claim":"Prometheus adının Sanskritçe ateş burgusu pramantha ile aynı kökten geldiği kanıtlanmıştır.","divergence":"İddia 19. yüzyılda önerildi ve o günden beri 'kesin kanıt' olarak dolaşıyor. Çekici çünkü hem ses hem anlam uyuyor gibi. Ama biçimsel olarak oturmuyor; Yunanca içi türetme ise sorunsuz çalışıyor ve kardeş adı Epimetheus ile bir çift oluşturuyor.","divergence_type":["eski-ceviri","guncellenmemis","medya-abartisi"],"sources":[{"id":"etymonline-prometheus","tier":"institutional","type":"webpage","title":"Prometheus - Etymology, Origin & Meaning","container":"Online Etymology Dictionary","institution":"Online Etymology Dictionary","url":"https://www.etymonline.com/word/prometheus","language":"en","accessed":"2026-09-07","note":"Sözlük maddesi; Yunanca içi türetme ve alternatif öneri için kullanıldı."},{"id":"cybalist-pramantha","tier":"institutional","type":"webpage","title":"Pramantha/Prometheus: a false etymology?","institution":"Cybalist dilbilim listesi arşivi","url":"https://wrdingham.co.uk/cybalist/msg/169/75.html","language":"en","accessed":"2026-09-07","note":"Dilbilim tartışma arşivi; biçimsel uyuşmazlık gerekçesi için kullanıldı. Hakemli değil - bu yüzden yalnız dayanak değil."}],"evidence":[{"id":"yunanca-turetme","text":"Ad antik dönemden beri 'önceden düşünen' olarak yorumlanır: pro- (önce) + mathein/mēthos (öğrenmek, düşünmek).","citations":[{"source_ref":"etymonline-prometheus","locator":"Madde gövdesi","support_type":"direct"}]},{"id":"bicimsel-uyusmazlik","text":"Sanskritçe pramantha 'ateş burgusu' demektir ve 'şiddetle karıştırmak' anlamındaki bir kökten gelir, ancak Yunanca Promētheus ile biçimsel olarak tam örtüşmez.","citations":[{"source_ref":"cybalist-pramantha","locator":"Tartışma iletisi gövdesi","support_type":"counter"}]}],"counter_evidence":[{"id":"calmak-onerisi","text":"Alternatif bir öneri ikinci öğenin 'çalmak' anlamındaki bir kökten gelebileceğini savunur; bu da tartışmalıdır.","citations":[{"source_ref":"etymonline-prometheus","locator":"Madde gövdesi, alternatif öneri","support_type":"context"}]},{"id":"kapsam-siniri","text":"Bu kayıt Sanskritçe bağlantısının yerleşik olmadığını söyler; kesin olarak imkânsız olduğunu değil.","citations":[{"source_ref":"cybalist-pramantha","locator":"Tartışma iletisi gövdesi","support_type":"context"}]}],"open_questions":["İkinci öğenin kökeni kesin olarak belirlendi mi? Hayır."],"checked":"2026-09-07","used_in":["calinan-ates"],"review":{"status":"draft","notes":"Locator'lar sayfa gövdesi düzeyindedir. Hakemli dilbilim kaynağıyla değiştirilmeli; cybalist arşivi hakemli değildir ve tek dayanak olarak kullanılmamıştır."}},{"id":"hilebaz-kategorisi-uretilmis","claim":"'Hilebaz' / 'kültür kahramanı' kategorisi doğal bir mitolojik türdür.","status":"contested","confidence":"medium","topic":["mitoloji","yontem","karsilastirmali-mitoloji"],"subject":{"site":"Karşılaştırmalı mitoloji kategorileri","region":"kuramsal","modern_country":"çok uluslu"},"period":{"earliest":1880,"latest":2026,"era_label":"Kategorinin tanımlanmasından bugüne","precision":"range","dating_method":["historical-record"]},"disciplines":["antropoloji","filoloji"],"popular_claim":"Hilebaz figürü tüm dünya mitolojilerinde bulunan evrensel bir arketiptir.","divergence":"Kategori gerçek bir düzenliliği yakalıyor OLABİLİR - sınırları çiğneyen, kurnazlıkla iş gören, insanlığa bir şey kazandıran figür. Ama uyarı gerekiyor: 'hilebaz' kategorisi 19.-20. yüzyıl antropolojisinin ürünüdür ve TANIMLANDIKTAN SONRA her yerde bulunmuştur - monomit vakasındaki mekanizmanın aynısı. Kategoriye koymak bir bulgu değil, bir İŞLEMDİR. Bulgu olması için kategorinin dışında kalan vakaların da gösterilmesi gerekir; gösterildiğinde kategori daralır: Māui cezalandırılmaz, Kuzgun ateş değil ışık getirir, Mātariśvan hilebaz değildir.","divergence_type":["kategori-hatasi","somurge-anlatisi"],"evidence":["Prometheus, Māui, Kuzgun ve Çakal genellikle aynı başlık altında toplanır.","Kategori 19.-20. yüzyıl antropolojisinde tanımlandı ve sonra evrensel olarak 'bulundu'.","Kategoriye alınan vakalar temel özelliklerde ayrışıyor: ceza, alınan şey, alanın türü."],"counter_evidence":["Kültür kahramanı figürünün yaygınlığı gerçek bir SOSYOLOJİK düzenlilik olabilir ve insan topluluklarının anlatı ihtiyaçları hakkında bir şey söyleyebilir.","Bu kayıt kategorinin işe yaramaz olduğunu söylemez; 'yaygın olması ortak kökene kanıttır' çıkarımını reddeder. İkisi ayrı iddialardır."],"open_questions":["Kategorinin dışında kalan vakalar sistematik olarak sayıldı mı? Bu yapılmadan yaygınlık iddiası sınanamaz."],"sources":[{"tier":"institutional","type":"webpage","title":"Why Folklorists Hate Joseph Campbell's Work","authors":["Jorgensen, Jeana"],"url":"https://www.patheos.com/blogs/foxyfolklorist/why-folklorists-hate-joseph-campbells-work/","language":"en","accessed":"2026-09-07","note":"Kategori üretme mekanizması üzerine folklorcu eleştirisi."},{"tier":"peer-reviewed","type":"article","title":"The Cultural Transmission and Evolution of Folk Narratives","url":"https://durham-repository.worktribe.com/OutputFile/1642267","language":"en","accessed":"2026-09-07"}],"checked":"2026-09-07","used_in":["calinan-ates"]},{"id":"ulker-takvim-bagimsiz-icat","claim":"Ülker'in mevsim takvimi olarak dünyanın dört bir yanında kullanılması, bağımsız icadın en güçlü vakalarından biridir.","status":"established","confidence":"high","topic":["mitoloji","ulker","arkeoastronomi","takvim","yontem"],"subject":{"site":"Ülker (Pleiades) yıldız kümesi","region":"küresel","modern_country":"çok uluslu"},"period":{"earliest":-700,"latest":2026,"era_label":"Hesiodos'tan günümüz tarımına","precision":"range","dating_method":["astronomical","textual","historical-record"]},"languages":["Grekçe","Maori","Japonca","Türkçe","Keçuvaca"],"disciplines":["astronomi","antropoloji","tarih"],"people":[{"name":"Hesiodos","role":"editor","year":-700}],"popular_claim":"Ülker'in tüm kültürlerde önemli olması, ortak bir kadim bilginin kanıtıdır.","divergence":"Sebep mitolojik değil, GÖK MEKANİĞİ. Ülker gökyüzündeki en dikkat çekici sıkışık yıldız kümesidir; tek yıldızlardan farklı olarak leke gibi görünür ve bir kez tanındıktan sonra kaçırılması zordur. Güneşten hemen önce doğuşu ve batışı HER YIL AYNI MEVSİME denk gelir. Küme ekvatora yakın olduğu için yerleşilebilir dünyanın neredeyse tamamından görülür. Yani ortada herkesin gördüğü, herkes için aynı anda çalışan ücretsiz bir mevsim saati var. Tarım yapan bir topluluğun bunu fark etmemesi, fark etmesinden daha şaşırtıcı olurdu. Aynı problem, aynı çözüm, aynı gökyüzü.","divergence_type":["kategori-hatasi"],"evidence":["Hesiodos doğuşunda hasat, batışında sürüm önerir; denizciliğin güvenli mevsimi de buna bağlanır.","And Dağları'nda haziranda kümenin parlaklığına bakılarak patates ekim tarihi belirlenir.","Maori geleneğinde kümenin yeniden görünmesi (Matariki) yılbaşıdır.","Japonca adı Subaru 'bir araya gelmek'ten gelir ve kümenin görünüşünü tarif eder.","Kullanım ezici çoğunlukla mevsim ve tarım zamanlamasıdır - ortak kökene değil ORTAK SORUNA işaret eder."],"counter_evidence":["Kullanım biçimlerindeki ayrıntılar (hangi eşik, hangi ürün, hangi tören) bölgesel olarak farklıdır ve bunların bir kısmı temasla yayılmış olabilir.","Anadolu geleneği bu kayıtta yüzeysel ele alınmıştır."],"open_questions":["Ülker'in Türk halk takvimindeki yeri ayrıntılı incelenmedi; yerel kaynak erişimi kolay olduğu için ayrı bir çalışmayı hak ediyor."],"sources":[{"tier":"primary","type":"edition","authors":["Hesiodos"],"title":"İşler ve Günler (Ülker'in doğuşu ve batışına göre tarım takvimi)","language":"grc"},{"tier":"institutional","type":"webpage","title":"Pleiades","container":"Wikipedia","url":"https://en.wikipedia.org/wiki/Pleiades","language":"en","accessed":"2026-09-07"}],"checked":"2026-09-07","used_in":["herkesin-saati"]},{"schema_version":2,"id":"and-ulker-elnino-tahmini","claim":"And çiftçilerinin Ülker'in parlaklığına bakarak yaptığı ekim tahmini, uydu verileriyle doğrulanmış işleyen bir iklim tahminidir.","status":"established","confidence":"high","topic":["ulker","arkeoastronomi","iklim","geleneksel-bilgi"],"subject":{"site":"And Dağları yüksek yaylaları","region":"Peru ve Bolivya","modern_country":"Peru / Bolivya","coordinates":{"lat":-15.5,"lon":-70}},"period":{"earliest":1500,"latest":2026,"era_label":"Geleneksel uygulamadan modern doğrulamaya","precision":"range","dating_method":["astronomical","historical-record"]},"languages":["Keçuvaca","Aymarca","İspanyolca"],"disciplines":["astronomi","iklim-bilimi","antropoloji"],"people":[{"name":"Orlove, Benjamin S.","role":"analyst","affiliation":"University of California, Davis","year":2000}],"popular_claim":"Gökyüzüne bakarak tarım takvimi kurmak bilim öncesi bir inanç pratiğidir.","divergence":"Bu vakada değil: uygulama gerçekten bilgi taşıyan bir sinyalin okunmasıdır ve modern aletle sınanıp doğrulanmıştır. Zincir şudur: haziranda Ülker soluk görünüyorsa yüksek irtifada ince bulut ve su buharı artmış demektir; bu El Niño yılının erken işaretidir; El Niño ekim mevsiminde daha az yağış ve düşük hasat getirir. Çiftçiler çıplak gözle, aylar öncesinden, işleyen bir tahmin yapıyorlar.","divergence_type":["somurge-anlatisi","guncellenmemis"],"sources":[{"id":"orlove-chiang-cane-2000","tier":"peer-reviewed","type":"article","authors":["Orlove, Benjamin S.","Chiang, John C. H.","Cane, Mark A."],"year":2000,"title":"Forecasting Andean rainfall and crop yield from the influence of El Niño on Pleiades visibility","container":"Nature","volume":"403","pages":"68-71","doi":"10.1038/47456","url":"https://www.nature.com/articles/47456","language":"en","note":"Künye (DOI, cilt, sayfa) doğrulandı. Locator'lar özet düzeyindedir; tam metin sayfa doğrulaması yapılmamıştır."},{"id":"ucdavis-2000-basin","tier":"institutional","type":"press-release","title":"Andean Farmers Accurately Time Rains, Planting, By The Stars","institution":"University of California, Davis","url":"https://www.ucdavis.edu/news/andean-farmers-accurately-time-rains-planting-stars","language":"en","accessed":"2026-09-07","note":"Kurumsal özet; mekanizma zincirinin okunabilir aktarımı için kullanıldı."}],"evidence":[{"id":"ekim-karari","text":"Çiftçiler haziranda Ülker'in görünürlüğüne bakarak patates ekimini erteleyip ertelemeyeceklerine karar veriyor.","citations":[{"source_ref":"ucdavis-2000-basin","locator":"Basın bülteni gövdesi","support_type":"direct"}]},{"id":"bulut-su-buhari","text":"Kümenin sönük görünmesi, yüksek irtifadaki bulut miktarı ve su buharı artışıyla açıklanıyor.","citations":[{"source_ref":"ucdavis-2000-basin","locator":"Basın bülteni gövdesi, mekanizma bölümü","support_type":"direct"}]},{"id":"elnino-baglantisi","text":"Sönük görünürlük, azalan yağış ve düşük hasat El Niño ile ilişkilendirildi; bağlantı uydu verileriyle denetlendi.","citations":[{"source_ref":"orlove-chiang-cane-2000","locator":"Başlık ve özet","support_type":"direct"}]}],"counter_evidence":[{"id":"isabet-orani-yok","text":"Bu kayıt mekanizmayı doğrular; geleneksel yöntemin isabet oranını vermez. Modern tahminle karşılaştırmalı başarım ayrı bir sorudur.","citations":[{"source_ref":"orlove-chiang-cane-2000","locator":"Başlık ve özet","support_type":"context"}]}],"open_questions":["Geleneksel yöntemin isabet oranı modern tahminle karşılaştırıldığında nedir?"],"checked":"2026-09-07","used_in":["herkesin-saati"],"review":{"status":"draft","notes":"Locator'lar özet ve basın bülteni gövdesi düzeyindedir; tam metin sayfa doğrulaması yapılmamıştır."}},{"id":"yedi-kiz-kardes-derin-koken","claim":"Ülker'in 'yedi kız kardeş, biri kayıp' anlatısı, insanların Afrika'dan yayılmasından önceye, yaklaşık yüz bin yıl öncesine dayanır.","status":"minority","confidence":"low","topic":["mitoloji","ulker","arkeoastronomi","yontem"],"subject":{"site":"Ülker (Pleiades) yıldız kümesi","region":"küresel","modern_country":"çok uluslu"},"period":{"earliest":-100000,"latest":2021,"era_label":"İddia edilen köken derinliğinden önerinin yayımına","precision":"disputed","dating_method":["astronomical","none"]},"disciplines":["astronomi","antropoloji","dilbilim"],"people":[{"name":"Norris, Ray P.","role":"proposer","affiliation":"Western Sydney University / CSIRO","year":2021},{"name":"Norris, Barnaby R. M.","role":"proposer","affiliation":"University of Sydney","year":2021}],"popular_claim":"Bilim, insanlığın en eski hikâyesinin yüz bin yıllık olduğunu gösterdi.","divergence":"Öneri serinin ölçütünü iyi karşılıyor: ayrıntı KEYFÎ (çıplak gözle çoğu insan altı yıldız seçer ama anlatı yedi der), dağılım geniş, ve açıklama fiziksel olarak sınanabilir bir şeye dayanıyor - Pleione ve Atlas zaman içinde birbirine yaklaştı, çok uzun zaman önce ayrı ayrı seçilebiliyor olmalıydı. AMA desteklenmiş değil. NOT: bu öneriye yöneltilmiş yayımlanmış reddiyelere araştırmamızda RASTLANMADI; bu, önerinin kabul gördüğü anlamına gelmez, yalnızca bakabildiğimiz yerde tartışmanın izine rastlamadığımız anlamına gelir ve bir sınırlılık olarak kaydedilir.","divergence_type":["medya-abartisi","provenans-yoklugu"],"evidence":["Çıplak gözle çoğu insan altı yıldız seçer ama pek çok gelenek kümeyi yedi olarak sayar - ayrıntı gökyüzü tarafından dayatılmıyor.","Pek çok gelenekte anlatı 'yedi kız kardeş' biçimindedir ve sık sık birinin kayıp ya da saklanmış olduğu ayrıntısını taşır.","Pleione ve Atlas'ın öz hareketi hesaplanabilir; geçmişte açısal ayrımları daha genişti."],"counter_evidence":["Yüz bin yıllık anlatı kararlılığı için bir MEKANİZMA sunulmuyor; bu, alanın denediği en uzun zaman ölçeğidir ve mit filogenetiği henüz kalibre edilmedi (bkz. mit-filogenetigi-kalibre-degil).","'Yedi' bağımsız olarak yüklü bir sayıdır: gezegen sayısı, hafta günü, tekrarlayan anlatı kalıpları. Bir gelenek yedi sayıyorsa sebep gökyüzü değil sayının kendisi olabilir.","Görülen yıldız sayısı sabit değildir; göz keskinliğine, gökyüzü karanlığına ve havaya göre değişir - bazı insanlar gerçekten yedi ve daha fazlasını seçer.","'Çoğu kültür yedi diyor' ifadesi sayılmamıştır; hangi gelenekler, hangi derlemelerden ve sömürge dönemi teması elenerek mi - bunlar gösterilmemiştir.","Öneri astronomlardan gelmektedir, folklorculardan değil."],"open_questions":["Kaç gelenek gerçekten 'yedi' diyor? Sayılmadı.","Yayımlanmış reddiye var mı? Aramamızda bulunamadı - bu bir onay değildir."],"sources":[{"tier":"peer-reviewed","type":"article","authors":["Norris, Ray P.","Norris, Barnaby R. M."],"year":2021,"title":"Why are there Seven Sisters?","url":"https://arxiv.org/abs/2101.09170","language":"en","accessed":"2026-09-07","note":"İncelenen öneri; kanıt olarak değil, değerlendirilen tez olarak kaydedildi."},{"tier":"institutional","type":"webpage","title":"Pleiades","container":"Wikipedia","url":"https://en.wikipedia.org/wiki/Pleiades","language":"en","accessed":"2026-09-07"}],"checked":"2026-09-07","volatile":true,"used_in":["herkesin-saati"]},{"id":"zorunlu-keyfi-ekseni","claim":"Bir mitolojik benzerliğin bilgi değeri, yaygınlığıyla değil, ayrıntının ne kadar keyfî olduğuyla belirlenir.","status":"established","confidence":"high","topic":["mitoloji","yontem","karsilastirmali-mitoloji"],"subject":{"site":"Karşılaştırmalı mitoloji yöntemi","region":"kuramsal","modern_country":"çok uluslu"},"period":{"earliest":1850,"latest":2026,"era_label":"Karşılaştırmalı mitolojinin kuruluşundan bugüne","precision":"range","dating_method":["historical-record"]},"disciplines":["antropoloji","felsefe","astronomi"],"popular_claim":"Bir motif ne kadar çok kültürde varsa, ortak köken kanıtı o kadar güçlüdür.","divergence":"Sezgi ters çalışıyor. Doğanın dayattığı benzerlikler YAYGIN oldukları için etkileyici görünür ama hiçbir şey söylemez: fırtına ve yılan her yerde vardır, ateş her yerde alınarak elde edilir, Ülker her yerde aynı mevsimde doğar. Seçilmiş ayrıntılardaki benzerlikler ise NADİR ve DAĞINIK oldukları için zayıf görünür ama tek bilgi taşıyan onlardır: yedi yıldıza ayı demek, altı görünen kümeye yedi demek. Ölçüt şudur: DOĞA NEYİ DAYATIYOR, NE SEÇİLMİŞ.","divergence_type":["kategori-hatasi","medya-abartisi"],"evidence":["Zorunlu uçtaki örnekler: fırtına tanrısının yılanı öldürmesi, ateşin başkasından alınması, Ülker'in takvim olarak kullanılması. Üçü de yaygın, üçü de bilgilendirici değil.","Keyfî uçtaki örnekler: Büyük Ayı'nın avlanan hayvan olması, Ülker'in 'yedi kız kardeş, biri kayıp' anlatısı. İkisi de dağınık, ikisi de açıklanmayı hak ediyor.","Ve ikisi de HENÜZ ÇÖZÜLMEDİ - çünkü zor taraf orası.","Aynı nesne (Ülker) ekseni iki ucundan birden gösteriyor: kullanımı zorunlu, sayımı keyfî."],"counter_evidence":["'Keyfî' ölçütü niceliksel değildir; neyin keyfî sayılacağı yorumcuya bağlıdır ve bu, ölçütün en zayıf noktasıdır.","Zorunlu-keyfî ayrımı süreklidir, ikili değildir; pek çok motif arada kalır."],"open_questions":["'Keyfîlik' niceliksel olarak tanımlanabilir mi? Tanımlanabilirse yöntem ciddi biçimde güçlenir."],"sources":[{"tier":"peer-reviewed","type":"chapter","title":"Phylogenetics Meets Folklore: Bioinformatics Approaches to the Study of International Folktales","url":"https://link.springer.com/content/pdf/10.1007/978-3-319-39445-9_6.pdf","language":"en","accessed":"2026-09-07"},{"tier":"peer-reviewed","type":"article","title":"The Cultural Transmission and Evolution of Folk Narratives","url":"https://durham-repository.worktribe.com/OutputFile/1642267","language":"en","accessed":"2026-09-07"}],"checked":"2026-09-07","used_in":["calinan-ates","herkesin-saati"]},{"schema_version":2,"id":"halk-takvimi-iki-yarim-yapisi","claim":"Anadolu halk takvimi yılı dört mevsime değil, 8 Kasım ve 6 Mayıs'ta menteşelenen iki yarıma böler ve kış yarısını sayılı dilimlere ayırır.","status":"established","confidence":"medium","topic":["halk-takvimi","anadolu","takvim","ulker"],"subject":{"site":"Anadolu halk takvimi","region":"Anadolu","modern_country":"Türkiye","coordinates":{"lat":39,"lon":35}},"period":{"earliest":1000,"latest":2026,"era_label":"Belgelenebilir kullanımdan bugüne","precision":"approximate","dating_method":["historical-record","textual"]},"languages":["Türkçe","Arapça","Farsça"],"disciplines":["antropoloji","astronomi","tarih"],"popular_claim":"Halk takvimi dört mevsime dayanır ve yıl gündönümlerinde döner.","divergence":"Halk takvimi dört mevsim kullanmaz, İKİ YARIM kullanır: Kasım (kış, 8 Kasım'dan itibaren 179 gün) ve Hızır (yaz, 6 Mayıs'tan itibaren 186 gün). Menteşeler gündönümü ya da ekinoks DEĞİLDİR; ekinokslardan yaklaşık kırk beş gün sonra, yani ekinoksla gündönümünün ortasına düşer. Sebep ölçülebilir: ılıman kuşakta toprak güneşten yaklaşık altı hafta geriden ısınır ve soğur. Takvim güneşi değil toprağı izliyor. Ayrıca dilimlerin adları mevsim değil SAYI belirtir - kırk, elli.","divergence_type":["kategori-hatasi","guncellenmemis"],"sources":[{"id":"halk-takvimi-halkbilimi-derleme","tier":"institutional","type":"w :"Cilt 1, yöntem bölümü","support_type":"direct"}]},{"id":"ehrman-cevap","text":"Agnostik bir metin eleştirmeni, varlığı reddeden konuma doğrudan cevap veren bir kitap yazmış ve tarihsel İsa'yı savunmuştur.","citations":[{"source_ref":"ehrman-2012-did-jesus-exist","locator":"Kitabın tezi","support_type":"direct"}]},{"id":"pavlus-tanisma","text":"En yakın kayıt Pavlus'un mektuplarıdır (y. 50'ler, ~23 yıl sonra) ve BİRİNCİ AĞIZDANDIR: 'Rab'bin kardeşi Yakup' ile görüştüğünü yazar - mucize değil, sıradan biyografik ayrıntı.","citations":[{"source_ref":"pavlus-galatyalilar-1-19","locator":"Galatyalılar 1:18-19","support_type":"direct"}]},{"id":"josephus-yakup","text":"Josephus, 93-94'te Yakup'u 'Mesih denilen İsa'nın kardeşi' diye tanımlar; kısa, geçerken söylenmiş, övgüsüz.","citations":[{"source_ref":"josephus-ant-20-200","locator":"Kitap 20, 200. paragraf","support_type":"direct"}]},{"id":"tacitus-kaydi","text":"Tacitus, y. 116'da Tiberius döneminde vali Pontius Pilatus tarafından idam edildiğini yazar; bağımsız ve açıkça küçümseyici bir Roma kaydıdır.","citations":[{"source_ref":"tacitus-annales-15-44","locator":"15. kitap, 44. bölüm","support_type":"direct"}]}],"counter_evidence":[{"id":"dort-tanik-yanlis","text":"Anlatılar tam bağımsız değildir: Matta ve Luka Markos'u kaynak alır. 'Dört bağımsız tanık' ifadesi YANLIŞTIR.","citations":[{"source_ref":"ehrman-2012-did-jesus-exist","locator":"Kaynak bağımlılığı tartışması","support_type":"counter"}]},{"id":"taraf-kaynaklar","text":"Bütün erken kaynaklar taraf olan kaynaklardır; taraf olmayan iki kayıt olaydan 60-90 yıl sonradır.","citations":[{"source_ref":"tacitus-on-jesus-wikipedia","locator":"Tarihlendirme bölümü","support_type":"counter"}]},{"id":"yanlilik-riski","text":"Yeni Ahit çalışmaları alanında kurumsal yanlılık riski gerçektir; bu kayıt onu Katolik/agnostik eşleşmesiyle karşılar ama tamamen ortadan kaldırmaz.","citations":[{"source_ref":"meier-1991-marginal-jew-1","locator":"Yöntem ve sınırlar","support_type":"context"}]},{"id":"yil-belirsiz","text":"İdam yılı 30 mu 33 mü kesinleşmemiştir.","citations":[{"source_ref":"tacitus-on-jesus-wikipedia","locator":"Kronoloji","support_type":"counter"}]},{"id":"tam-metin-okunmadi","text":"Bu kayıtta iki standart eserin de tam metni okunmamıştır; künyeler ve tezler doğrulanmıştır.","citations":[{"source_ref":"ehrman-2012-did-jesus-exist","locator":"Kaynak erişim düzeyi","support_type":"context"}]}],"open_questions":["Anlatılarda kaç ayrı bağımsız geleneğin izi sürülebilir? Alanda tartışmalı.","İdam yılı 30 mu 33 mü?"],"checked":"2026-09-07","used_in":["isa-tarihsellik"],"review":{"status":"draft","notes":"İki hakemli çıpa eklendi; Katolik/agnostik eşleşmesi yanlılık itirazına somut cevap. Tam metinler okunmadı."}},{"schema_version":2,"id":"testimonium-flavianum-mudahale","claim":"Josephus'un Eskiçağ Tarihi 18.63'teki pasajı Hristiyan müdahalesi görmüştür; özgün bir çekirdeğin var olup olmadığı tartışmalıdır.","status":"contested","confidence":"high","topic":["isa","josephus","metin-elestirisi","yontem"],"subject":{"site":"Antiquitates Judaicae elyazması geleneği","region":"Roma İmparatorluğu / Bizans kopyalama geleneği","modern_country":"çok uluslu"},"period":{"earliest":93,"latest":1000,"era_label":"Yazımdan Arapça/Süryanice aktarımlara","precision":"range","dating_method":["paleography","textual"]},"languages":["Grekçe","Arapça","Süryanice"],"disciplines":["metin-elestirisi","filoloji","tarih"],"people":[{"name":"Flavius Josephus","role":"editor","year":93,"lifespan":"y. 37-100"}],"popular_claim":"Josephus İsa hakkında yazmıştır ve bu, tarihselliğin tartışmasız kanıtıdır. (Karşı popüler iddia: pasajın tamamı sahtedir, dolayısıyla Josephus hiçbir şey söylememiştir.)","divergence":"İki popüler iddia da alanın gerçek durumunu yanlış aktarıyor. 'O, Mesih'ti' cümlesinin sonradan eklendiği neredeyse evrensel kabul görür - yani pasaj olduğu gibi kullanılamaz. Ama tamamının sahte olduğu da uzlaşı değil, güçlü bir azınlık görüşüdür. Bir literatür taramasında değerlendirilen 52 akademisyenin dağılımı: 4 tamamen özgün, 6 büyük ölçüde özgün, 20 bazı eklemelerle özgün, 9 birçok eklemeyle özgün, 13 tamamı sonradan eklenmiş. Yani %56'lık orta grup 'özgün çekirdek + müdahale' modelinde birleşiyor, %25'lik azınlık tamamen reddediyor.","divergence_type":["ideolojik-secim","medya-abartisi"],"open_questions":["Pasajın özgün hâli neydi? Kesin metin elde yok.","Arapça ve Süryanice aktarımlar gerçekten bağımsız mı?"],"checked":"2026-09-09","volatile":true,"used_in":["isa-tarihsellik"],"sources":[{"id":"josephus-antiquitates-18-63","language":"grc","accessed":"2026-09-09","tier":"primary","type":"manuscript","authors":["Flavius Josephus"],"title":"Antiquitates Judaicae 18.63 (Testimonium Flavianum)","note":"Tartışmanın konusu olan pasaj. Elimizdeki bütün Grekçe elyazmaları Hristiyan kopyalama geleneğinden gelir."},{"id":"meier-1991-marginal-jew-1","language":"en","accessed":"2026-09-09","tier":"peer-reviewed","type":"book","authors":["Meier, John P."],"year":1991,"title":"A Marginal Jew: Rethinking the Historical Jesus, Volume 1","publisher":"Doubleday","isbn":"9780385264259","note":"Testimonium'un 'özgün çekirdek + müdahale' okumasının standart savunusu."},{"id":"whealey-2003-josephus-on-jesus","language":"en","accessed":"2026-09-09","tier":"peer-reviewed","type":"book","authors":["Whealey, Alice"],"year":2003,"title":"Josephus on Jesus: The Testimonium Flavianum Controversy from Late Antiquity to Modern Times","publisher":"Peter Lang","isbn":"9780820452418","note":"Tartışmanın tarihçesi ve Arapça/Süryanice aktarımların değerlendirmesi."}],"evidence":[{"id":"mesih-cumlesi-eklendi","text":"Bir Yahudi tarihçinin kaleminden 'O, Mesih'ti' cümlesi çıkmaz; bu ifadenin eklendiği neredeyse evrensel kabul görür.","citations":[{"source_ref":"meier-1991-marginal-jew-1","locator":"Testimonium çözümlemesi","support_type":"direct"}]},{"id":"pasaj-metni","text":"Pasajın kendisi Antiquitates 18.63'tedir.","citations":[{"sour lund, Robert K."],"year":1993,"title":"Archaic Bookkeeping: Early Writing and Techniques of Economic Administration in the Ancient Near East","publisher":"University of Chicago Press","isbn":"9780226586595","pages":"xi+169","language":"en","note":"Proto-çivi yazısı külliyatının standart çözümlemesi. Ana tezi doğrudan bu kaydın konusu: en erken tabletlerin amacı DİLİ kaydetmek değil, sayısal bir sistemle yerel ekonominin yönetimini izlemekti. Paul Larsen çevirisi. Önceki sürümde bu kaynağın yerinde 'Proto-çivi yazısı ve erken Mezopotamya idaresi literatürü' yazan bir YER TUTUCU vardı."}],"evidence":[{"id":"idari-kayit-turleri","text":"Uruk IV tabletleri teslimat, sayım ve tayın kayıtlarıdır: arpa, bira, koyun, işçi payı.","citations":[{"source_ref":"nissen-damerow-englund-1993-archaic-bookkeeping","locator":"İdari metin türleri bölümü","support_type":"direct"}]},{"id":"nesneye-bagli-sayi-sistemi","text":"En erken sayı sistemi saydığı şeye göre değişir - tahıl ve hayvan için ayrı düzenler; soyut sayı fikri henüz yok.","citations":[{"source_ref":"nissen-damerow-englund-1993-archaic-bookkeeping","locator":"Sayı sistemleri çözümlemesi","support_type":"direct"}]},{"id":"amac-dil-degil-yonetim","text":"Tabletlerin amacı dili kaydetmek değil, sayısal bir sistemle yerel ekonominin yönetimini izlemekti.","citations":[{"source_ref":"nissen-damerow-englund-1993-archaic-bookkeeping","locator":"Kitabın ana tezi","support_type":"direct"}]},{"id":"ilk-edebi-metinler-2600","text":"İlk edebî metinler (Şuruppak Öğütleri, Keş Tapınak İlahisi) ~MÖ 2600'e tarihlenir.","citations":[{"source_ref":"nissen-damerow-englund-1993-archaic-bookkeeping","locator":"Kronolojik çerçeve","support_type":"context"}]}],"counter_evidence":[{"id":"yayimlanmis-kulliyat-siniri","text":"'Ezici çoğunluk idari' ifadesi YAYIMLANMIŞ külliyata dayanır. Kazılmamış ve yayımlanmamış malzemenin dağılımı bilinmiyor; oran bir örneklem oranıdır.","citations":[{"source_ref":"nissen-damerow-englund-1993-archaic-bookkeeping","locator":"Külliyatın kapsamı","support_type":"counter"}]},{"id":"korunma-yanliligi","text":"İdari tabletlerin daha iyi korunmuş olması da mümkündür: pişmiş kil arşivler yangınla sertleşir, başka ortamlardaki kayıtlar korunmaz. Dağılım kısmen hayatta kalma yanlılığı olabilir.","citations":[{"source_ref":"nissen-damerow-englund-1993-archaic-bookkeeping","locator":"Korunma koşulları","support_type":"context"}]},{"id":"tam-metin-okunmadi","text":"Bu kaydın kaynağının TAM METNİ OKUNMADI; locator'lar bölüm düzeyinde, sayfa düzeyinde değil.","citations":[{"source_ref":"nissen-damerow-englund-1993-archaic-bookkeeping","locator":"Kayıt düzeyi sınırı","support_type":"context"}]}],"open_questions":["Yayımlanmamış Uruk külliyatının tür dağılımı yayımlanmışla aynı mı?"],"checked":"2026-09-09","used_in":["sumer"],"review":{"status":"draft","notes":"Yer tutucu kaynak ('...literatürü') gerçek künyeyle değiştirildi. Boş olan counter_evidence dolduruldu - örneklem ve korunma yanlılığı işaretlendi."}},{"schema_version":2,"id":"sumer-uruk-iv-dili","claim":"En eski Uruk IV tabletleri Sümerce yazılmıştır.","status":"unknown","confidence":"high","topic":["sumer","proto-civi-yazisi","dil"],"subject":{"site":"Uruk","region":"Güney Mezopotamya","modern_country":"Irak","coordinates":{"lat":31.3225,"lon":45.6361}},"period":{"earliest":-3300,"latest":-3100,"era_label":"Uruk IV","precision":"approximate","dating_method":["stratigraphy","paleography"]},"disciplines":["filoloji","dilbilim","epigrafi"],"popular_claim":"Dünyanın en eski yazısı Sümerce'dir.","divergence":"Sistemin sonradan Sümerce yazmak için kullanıldığı kesin. Ama en erken tabletlerdeki işaretlerin SES DEĞERİ oturmamıştır ve metinlerin hangi dili kaydettiği doğrudan gösterilemez. Sorun kanıtın azlığı değil, KAYDIN TÜRÜ: sayı ve mal işaretlerinden oluşan bir muhasebe notu, hangi dilde düşünüldüğünü ele vermez.","divergence_type":["kategori-hatasi"],"sources":[{"id":"nissen-damerow-englund-1993-archaic-bookkeeping","tier":"peer-reviewed","type":"book","authors":["Nissen, Hans J.","Damerow, Peter","Englund, Robert K."],"year":1993,"title":"Archaic Bookkeeping: Early Writing and Techniques of Economic Administration in the Ancient Near East","publisher":"University of Chicago Press","isbn":"9780226586595","pages":"xi+169","language":"en","note":"Proto-çivi yazısı külliyatının standart çözümlemesi. Ana tezi doğrudan bu kaydın konusu: en erken tabletlerin amacı DİLİ kaydetmek değil, sayısal bir sistemle yerel ekonominin yönetimini izlemekti. Paul Larsen çevirisi. Önceki sürümde bu kaynağın yerinde 'Proto-çivi yazısı ve erken Mezopotamya idaresi literatürü' yazan bir YER TUTUCU vardı."}],"evidence":[{"id":"dil-tasimak-uzere-tasarlanmamis","text":"En erken tabletlerin işlevi dili kaydetmek değil, sayısal bir sistemle ekonomiyi izlemekti - yani metinler dil taşımak üzere tasarlanmamıştı.","citations":[{"source_ref":"nissen-damerow-englund-1993-archaic-bookkeeping","locator":"Kitabın ana tezi","support_type":"direct"}]}],"counter_evidence":[{"id":"resim-yazi-ses-degeri-sonra","text":"En erken işaretler büyük ölçüde resim-yazıdır; ses değeri sonradan gelişir.","citations":[{"source_ref":"nissen-damerow-englund-1993-archaic-bookkeeping","locator":"İşaret sistemi gelişimi","support_type":"counter"}]},{"id":"dilbilgisi-isaretleyicisi-yok","text":"İdari listelerde dilbilgisi işaretleyicisi neredeyse yok - dil tespiti için gereken yapı bulunmuyor.","citations":[{"source_ref":"nissen-damerow-englund-1993-archaic-bookkeeping","locator":"Metin yapısı çözümlemesi","support_type":"counter"}]},{"id":"sumerce-degil-demiyoruz","text":"Bu kayıt 'Sümerce DEĞİLDİR' demiyor; 'gösterilemez' diyor. Sonraki dönemde sistemin Sümerce yazdığı kesin olduğuna göre sürekliliğin Sümerce olması makul bir olasılıktır - ama olasılık kanıt değildir.","citations":[{"source_ref":"nissen-damerow-englund-1993-archaic-bookkeeping","locator":"Süreklilik tartışması","support_type":"context"}]}],"open_questions":["Uruk IV metinlerinin dil ":2,"id":"uruk-rahip-kral","claim":"Geç Uruk ikonografisinde baş bantlı ve ağ desenli etekli seçkin bir erkek tipi vardır; ‘rahip-kral’ modern bir tanımlamadır.","status":"established","confidence":"high","topic":["uruk","mezopotamya"],"subject":{"site":"Uruk: Eanna ve Anu bölgeleri","region":"Güney Mezopotamya","modern_country":"Irak","coordinates":{"lat":31.3222,"lon":45.6361}},"period":{"earliest":-4200,"latest":-2900,"era_label":"Geç Uruk — Cemdet Nasr","precision":"range","dating_method":["stratigraphy","radiocarbon","epigraphic","historical-record"]},"languages":["Sümerce","Akadca","Türkçe"],"disciplines":["arkeoloji","filoloji"],"popular_claim":"Bu figür Uruk’un adı bilinen tek mutlak hükümdarıdır.","sources":[{"id":"matris-kaynak-15","tier":"primary","type":"webpage","title":"British Museum — Late Uruk cylinder seal 116722","url":"https://www.britishmuseum.org/collection/object/W_1925-0110-20","language":"en","note":"Rahip-kral, sürü ve İnanna’nın kamış demeti simgeleri.","institution":"British Museum"}],"evidence":[{"id":"muhurlerde-figur-rituel-tarim-suru-ve-inanna-simgeleriyle-bi","text":"Mühürlerde figür ritüel, tarım, sürü ve İnanna simgeleriyle birlikte tekrarlanır.","citations":[{"source_ref":"matris-kaynak-15","locator":"İlgili bölüm (paket notundan türetildi)","support_type":"direct"}]}],"counter_evidence":[{"id":"figurun-adi-ve-tam-unvani-erken-sahnelerde-yazili-degildir-t","text":"Figürün adı ve tam unvanı erken sahnelerde yazılı değildir; tek kişi mi makam tipi mi olduğu açık değildir.","citations":[{"source_ref":"matris-kaynak-15","locator":"İlgili bölüm (paket notundan türetildi)","support_type":"counter"}]}],"open_questions":["İkonografik tip bir kralı, rahibi, kurumsal makamı veya ideal yöneticiyi mi gösterir?"],"checked":"2026-09-10","used_in":["uruk"],"review":{"status":"draft","notes":"Codex iddia matrisinden dönüştürüldü. Kanıt-kaynak eşlemesi paketin kaynak numaralarından türetildi; locator'lar bölüm düzeyinde. DOI'li künnyeler CrossRef'ten doğrulandı."},"divergence":"‘Rahip-kral’ MODERN BİR TANIMLAMADIR, antik bir unvan değil. Mühürlerde baş bantlı ve ağ desenli etekli bir erkek tipi tekrar tekrar görünüyor - ritüel, tarım, sürü ve İnanna simgeleriyle birlikte. Ama figürün adı ve tam unvanı erken sahnelerde yazılı değil; TEK BİR KİŞİ mi yoksa bir MAKAM TİPİ mi olduğu bile açık değil. Modern etiketin kesinliği, antik kaydın kesinliği sanılıyor.","divergence_type":["kategori-hatasi"]},{"schema_version":2,"id":"uruk-ilk-demokrasi","claim":"Uruk’un ‘ilk demokrasi’ olduğu sonucunu doğrulayacak çağdaş anayasal belge yoktur.","status":"contested","confidence":"high","topic":["uruk","mezopotamya"],"subject":{"site":"Uruk (Warka)","region":"Güney Mezopotamya","modern_country":"Irak","coordinates":{"lat":31.3222,"lon":45.6361}},"period":{"earliest":-4200,"latest":-2900,"era_label":"Geç Uruk — Cemdet Nasr","precision":"range","dating_method":["stratigraphy","radiocarbon","epigraphic","historical-record"]},"languages":["Sümerce","Akadca","Türkçe"],"disciplines":["arkeoloji","filoloji"],"popular_claim":"Gilgameş iki meclise danıştığı için demokrasi Uruk’ta icat edildi.","sources":[{"id":"matris-kaynak-17","tier":"institutional","type":"webpage","title":"University of Oxford — ETCSL","url":"https://www.orinst.ox.ac.uk/electronic-text-corpus-sumerian-literature-etcsl","language":"en","note":"Sümer edebî metinlerinin çoğunun geç 3. ve erken 2. binyıl nüshaları olduğu bağlamı.","institution":"University of Oxford, ETCSL"},{"id":"matris-kaynak-23","tier":"peer-reviewed","type":"article","title":"Kramer & Jacobsen — Gilgamesh and Agga","url":"https://www.journals.uchicago.edu/doi/10.2307/501208","language":"en","note":"Yaşlılar ve savaşabilir erkekler meclislerinin geçtiği edebî metin.","authors":["Kramer, Samuel Noah","Jacobsen, Thorkild"],"year":1949,"container":"American Journal of Archaeology","volume":"53","pages":"1-18"},{"id":"matris-kaynak-24","tier":"peer-reviewed","type":"article","title":"Jacobsen — Primitive Democracy in Ancient Mesopotamia","url":"https://www.journals.uchicago.edu/doi/10.2307/542482","language":"en","note":"‘İlkel demokrasi’ tezinin klasik formülasyonu; doğrudan anayasal belge değildir.","authors":["Jacobsen, Thorkild"],"year":1943,"container":"Journal of Near Eastern Studies","volume":"2","pages":"159-172"}],"evidence":[{"id":"gilgames-ve-aga-anlatisinda-yaslilar-ve-savasabilir-erkekler","text":"Gilgameş ve Aga anlatısında yaşlılar ve savaşabilir erkekler topluluğu görünür.","citations":[{"source_ref":"matris-kaynak-17","locator":"İlgili bölüm (paket notundan türetildi)","support_type":"direct"}]},{"id":"metin-kolektif-danisma-fikrinin-mezopotamya-siyasal-hayalind","text":"Metin, kolektif danışma fikrinin Mezopotamya siyasal hayalinde yer aldığını gösterir.","citations":[{"source_ref":"matris-kaynak-17","locator":"İlgili bölüm (paket notundan türetildi)","support_type":"direct"}]}],"counter_evidence":[{"id":"korunan-nushalar-olaylardan-yuzyillar-sonradir","text":"Korunan nüshalar olaylardan yüzyıllar sonradır.","citations":[{"source_ref":"matris-kaynak-17","locator":"İlgili bölüm (paket notundan türetildi)","support_type":"counter"}]},{"id":"kral-istemedigi-gorusu-birakip-destekledigi-gruba-gider-esit","text":"Kral istemediği görüşü bırakıp desteklediği gruba gider; eşit yurttaşlık, seçim ve hesap verme gösterilmez.","citations":[{"source_ref":"matris-kaynak-17","locator":"İlgili bölüm (paket notundan türetildi)","support_type":"counter"}]}],"open_questions":["Erken Hanedanlık kentlerindeki meclislerin gerçek yetkisi ne kadardı?"],"checked":"2026-09-10","used_in":["uruk"],"review":{"status":"draft","notes":"Codex iddia matrisinden dönüştürüldü. Kanıt-kaynak eşlemesi paketin kaynak numaralarından türetildi; locator'lar bölüm düzeyinde. DOI'li künnyeler CrossRef'ten doğrulandı."},"divergence":"Edebî bir sahne, anayasal bir belge yerine konuyor. Gilgameş ve Aga anlatısında yaşlılar ve savaşabilir erkekler topluluğu görünüyor - ve bu, kolektif danışma fikrinin Mezopotamya siyasal hayalinde yer aldığını gerçekten gösteriyor. Ama metnin kendisinde kral, istemediği görüşü bırakıp desteklediği gruba gidiyor; eşit yurttaşlık, seçim ve hesap verme yok. Üstelik korunan nüshalar olaylardan yüzyıllar sonra. ‘Danışma vardı’ ile ‘demokrasi icat edildi’ arasındaki mesafeyi popüler anlatı tek adımda atlıyor.","divergence_type":["ideolojik-secim","eski-ceviri"]},{"schema_version":2,"id":"gilgames-tarihsel","claim":"Gilgameş’in tarihsel bir kral olması mümkündür; mevcut kanıt biyografisini doğrulamaya yetmez.","status":"unknown","confidence":"high","topic":["uruk","mezopotamya"],"subject":{"site":"Uruk (Warka)","region":"Güney Mezopotamya","modern_country":"Irak","coordinates":{"lat":31.3222,"lon":45.6361}},"period":{"earliest":-4200,"latest":-2900,"era_label":"Geç Uruk — Cemdet Nasr","precision":"range","dating_method":["stratigraphy","radiocarbon","epigraphic","historical-record"]},"languages":["Sümerce","Akadca","Türkçe"],"disciplines":["arkeoloji","filoloji"],"popular_claim":"Gilgameş’in hayatı destanda anlatıldığı gibi kanıtlanmıştır.","sources":[{"id":"matris-kaynak-20","tier":"primary","type":"database","title":"CDLI — Sumerian King List","url":"https://cdli.earth/artifacts/112355","language":"en","note":"Krallık listesinin kopyaları ve Uruk hanedan geleneği.","institution":"Cuneiform Digital Library Initiative (CDLI)"},{"id":"matris-kaynak-21","tier":"peer-reviewed","type":"article","title":"Oxford Classical Dictionary — Gilgamesh/Gilgamesh Epic","url":"https://doi.org/10.1093/acrefore/9780199381135.013.9025","language":"en","note":"Gilgameş’in tarihselliğinin bilinmediği ve metin geleneğinin katmanları.","authors":["Jiménez, Enrique"],"year":2025,"container":"Oxford Classical Dictionary","doi":"10.1093/acrefore/9780199381135.013.9025"},{"id":"matris-kaynak-22","tier":"institutional","type":"webpage","title":"Metropolitan Museum of Art — Gilgamesh","url":"https://www.metmuseum.org/essays/gilgamesh","language":"en","no
