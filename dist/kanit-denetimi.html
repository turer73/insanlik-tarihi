ument for Jesus of Nazareth","publisher":"HarperOne","isbn":"9780062204608","language":"en","accessed":"2026-09-07","note":"Yazar agnostiktir ve mitçi konumu doğrudan ele alır. Künye doğrulandı, tam metin okunmadı."},{"id":"pilate-stone-wikipedia","tier":"institutional","type":"webpage","title":"Pilate stone","institution":"Wikipedia","url":"https://en.wikipedia.org/wiki/Pilate_stone","language":"en","accessed":"2026-09-07","note":"Ara kaynak; birincil epigrafik yayınla değiştirilmeli."}],"evidence":[{"id":"ikincil-kullanim","text":"Yazıt, Kayseriye tiyatrosunda ikincil kullanımda bir basamak taşı olarak bulundu - özgün bağlamından çıkarılıp sonradan yeniden kullanılmış.","citations":[{"source_ref":"pilate-stone-wikipedia","locator":"Buluntu bağlamı","support_type":"direct"}]},{"id":"yazit-metni","text":"Korunan metin Tiberius'a adanmış bir yapıyı ve Pilatus'un adını ve unvanını içerir; unvan 'praefectus' okunur.","citations":[{"source_ref":"pilatus-yaziti-caesarea","locator":"Yazıt metni","support_type":"direct"}]},{"id":"tartisma-disi","text":"Pilatus'un tarihselliği, tarihsel İsa literatüründe tartışma konusu değildir.","citations":[{"source_ref":"ehrman-2012-did-jesus-exist","locator":"Arka plan bölümü","support_type":"context"}]}],"counter_evidence":[{"id":"kirik-yazit","text":"Yazıt kırık ve eksiktir; okumanın bazı bölümleri tamamlamaya dayanır.","citations":[{"source_ref":"pilate-stone-wikipedia","locator":"Okuma ve tamamlama","support_type":"counter"}]},{"id":"ozgun-konum-belirsiz","text":"İkincil kullanımda bulunduğu için özgün konumu ve tam tarihi kesin değildir.","citations":[{"source_ref":"pilate-stone-wikipedia","locator":"Buluntu bağlamı","support_type":"counter"}]},{"id":"epigrafik-yayin-gorulmedi","text":"Yazıtın epigrafik yayını bu kayıtta doğrudan görülmemiştir; ara kaynak üzerinden kullanılmıştır.","citations":[{"source_ref":"pilate-stone-wikipedia","locator":"Kaynak düzeyi","support_type":"context"}]}],"checked":"2026-09-07","used_in":["isa-tarihsellik"],"review":{"status":"draft","notes":"Birincil epigrafik yayın hâlâ görülmedi; ara kaynak düzeyinde."}},{"id":"roma-hristiyanligi-uydurdu-tezi","claim":"Hristiyanlık, Roma tarafından bir yönetim aracı olarak icat edilmiştir.","status":"refuted","confidence":"high","topic":["isa","roma","hristiyanlik","komplo-tezi"],"subject":{"site":"Roma İmparatorluğu","region":"Akdeniz havzası","modern_country":"çok uluslu"},"period":{"earliest":30,"latest":380,"era_label":"Hareketin doğuşundan devlet dini ilanına","precision":"range","dating_method":["historical-record","textual"]},"languages":["Latince","Grekçe"],"disciplines":["tarih","metin-elestirisi"],"popular_claim":"İsa ve Hristiyanlık, Roma'nın itaat üretmek için tasarladığı bir kurgudur.","divergence":"Tez üç ayrı yerden kırılıyor ve üçü de test edilebilir. (1) KRONOLOJİ: Roma'nın ittifakı 313, devlet dini ilanı 380 - hareket o tarihte zaten ~300 yıllık. Uyduran taraf onu üç yüz yıl kullanmamış olamaz. (2) ZULÜM: Roma bu dönemde Hristiyanlara dönem dönem zulmetti; bir devletin kendi imal ettiği inancın mensuplarını yüzyıllarca kovuşturması açıklanamaz. (3) ÇARMIH: merkezdeki figür bir Roma valisince çarmıha gerilmiş bir taşralıdır; çarmıh asilere ve kölelere ayrılmış, kasıtlı olarak aşağılayıcı bir infaz biçimiydi. İtaat üretmek için tasarlanan bir anlatının merkezine devletin kendi idam ettiği bir mahkûm konmaz - bu ayrıntı uyduran taraf için utanç vericidir.","divergence_type":["medya-abartisi","ideolojik-secim"],"counter_evidence":["En erken metinler iktidar dışı bir çevreden gelir; saray hamiliği kaydı yoktur. Karşılaştırma: Philostratos'un Apollonius'u doğrudan imparatoriçe Julia Domna'nın isteğiyle yazılmıştır.","Tez akademik literatürde kabul görmüyor.","Roma'nın Hristiyanlığı SONRADAN biçimlendirdiği doğrudur (piskoposluk bölgeleri, bazilika planı, Latince, hukuk mantığı) - ama sonradan biçimlendirmek ile baştan icat etmek aynı şey değildir. Tez tam bu ikisini karıştırıyor."],"evidence":["Roma'nın dini siyaseten kullandığı doğrudur; tezin çıkış noktası bu bakımdan boş değildir."],"open_questions":["313 sonrası imparatorluk müdahalesinin doktrini ne ölçüde şekillendirdiği ayrı ve meşru bir sorudur - bu kayıt onu değil, 'baştan icat' tezini reddediyor."],"sources":[{"tier":"primary","type":"edition","title":"Codex Theodosianus XVI.1.2 (Cunctos populos)","year":380,"language":"la","note":"Devlet dini ilanının tarihi - kronoloji argümanının çıpası."},{"tier":"peer-reviewed","type":"article","authors":["de Ste. Croix, G. E. M."],"year":1963,"title":"Why Were the Early Christians Persecuted?","container":"Past & Present","volume":"26","language":"en","note":"Zulmün gerçekliği ve hukuki mekanizması - ikinci argümanın çıpası."},{"tier":"peer-reviewed","type":"book","authors":["Jones, A. H. M."],"year":1964,"title":"The Later Roman Empire 284-602","publisher":"Basil Blackwell","language":"en"}],"checked":"2026-09-07","used_in":["isa-tarihsellik"]},{"id":"apollonius-kaynak-durumu","claim":"Tyanalı Apollonius hakkında bilinenlerin tamamı, ölümünden ~125 yıl sonra saray hamiliğinde yazılmış tek bir esere dayanır.","status":"established","confidence":"high","topic":["apollonius","isa","kaynak-elestirisi","yontem"],"subject":{"site":"Tyana","site_native":"Τύανα","region":"Kapadokya","modern_country":"Türkiye","coordinates":{"lat":37.8236,"lon":34.6108}},"period":{"earliest":40,"latest":230,"era_label":"Apollonius'un yaşamından Philostratos'un yazımına","precision":"approximate","dating_method":["textual","historical-record"]},"languages":["Grekçe"],"disciplines":["filoloji","metin-elestirisi","tarih"],"people":[{"name":"Philostratos (Atinalı)","role":"editor","year":220,"lifespan":"y. 170-250"},{"name":"Julia Domna","role":"editor","year":217,"lifespan":"y. 160-217"}],"popular_claim":"Tyanalı Apollonius, İsa ile birebir aynı mucizeleri gerçekleştirmiş bir çağdaşıdır; anlatılar birbirinin kopyasıdır.","divergence":"Karşılaştırma meşru bir yöntem sorusu doğuruyor ama popüler biçimi iki yönden de hatalı. (a) 'Birebir kopya' listeleri abartılı: Philostratos'un diriltme sahnesinde yazarın kendisi çekince koyar, kızda bir yaşam kıvılcımı kalmış olabileceğini söyler. (b) Kanıt durumu aynı değil: Apollonius için elimizdeki tek kaynak ~125 yıl sonra ve İMPARATORİÇE ISMARLAMASIYLA yazılmış; iddia edilen birinci el kaynağı (Ninovalı Damis'in anıları) çoğunluk görüşüne göre edebî kurgudur. Fark VARLIK sorusundadır; mucize iddiaları ikisi için de aynı derecede tarih yönteminin dışındadır.","divergence_type":["medya-abartisi","provenans-yoklugu"],"evidence":["Ana kaynak Philostratos'un sekiz kitaplık Apollonius'un Yaşamı; y. 220'lerde, imparatoriçe Julia Domna'nın isteğiyle yazıldı.","Philostratos kaynağı olarak Ninovalı Damis'in anılarını gösteriyor; 'bulunmuş elyazması' antik bir anlatı hilesidir ve Damis çoğunluk görüşünde kurgu sayılır.","Bağımsız izler zayıf ve dolaylı: Cassius Dio'da kısa bir anma, Tyana'da sikke ve tapınak izleri.","Doğum yeri Tyana - bugünkü Kemerhisar, Bor, Niğde."],"counter_evidence":["Apollonius'un yaşamış olması muhtemeldir; kaynak sorunu varlığını değil, AYRINTILARI ulaşılamaz kılıyor.","Geleneksel yaşam tarihleri (y. MÖ 3 - y. MS 97) güvenilir değildir.","Philostratos'un kasıtlı olarak Hristiyanlığa rakip bir figür kurguladığı tezi alanda azınlıkta kalır; anti-Hristiyan kullanım sonradan gelmiştir."],"open_questions":["Damis gerçekten var mıydı? Çoğunluk hayır diyor ama kesin değil.","Philostratos'un elinde daha erken bir kaynak var mıydı?"],"sources":[{"tier":"primary","type":"edition","authors":["Philostratos"],"year":220,"title":"Ta es ton Tyanea Apollonion (Tyanalı Apollonius'un Yaşamı), 8 kitap","language":"grc","note":"Apollonius hakkındaki neredeyse tüm bilginin tek kaynağı."},{"tier":"primary","type":"edition","authors":["Cassius Dio"],"title":"Historia Romana - Apollonius'a değinen bölüm","language":"grc","note":"Kısa ve dolaylı; bağımsız iz olarak zayıf."}],"checked":"2026-09-07","used_in":["isa-tarihsellik"]},{"id":"hierocles-apollonius-polemigi","claim":"Apollonius-İsa karşılaştırması modern değildir: ~303'te bir Roma valisi tarafından zulüm sırasında polemik silahı olarak kuruldu ve bize yalnızca karşı tarafın alıntıları üzerinden ulaştı.","status":"established","confidence":"high","topic":["apollonius","isa","hristiyanlik","hayatta-kalma"],"subject":{"site":"Bitinya / Roma Doğu eyaletleri","region":"Anadolu","modern_country":"Türkiye"},"period":{"earliest":303,"latest":340,"era_label":"Diocletianus zulmü ve Eusebios'un reddiyesi","precision":"approximate","dating_method":["textual","historical-record"]},"languages":["Grekçe"],"disciplines":["tarih","metin-elestirisi","filoloji"],"people":[{"name":"Sossianus Hierocles","role":"proposer","affiliation":"Roma eyalet valisi","year":303},{"name":"Eusebios (Kaisareia)","role":"refuter","year":310,"lifespan":"y. 260-339"}],"popular_claim":"Apollonius-İsa paraleli modern bir şüphecilik bulgusudur.","divergence":"Paralel 4. yüzyıl başında, Diocletianus zulmünün yöneticilerinden biri tarafından, zulmü meşrulaştırmak için kuruldu. Yani argüman doğduğu anda siyasi bir araçtı. Ve bugün onu yalnızca EUSEBIOS'UN AKTARDIĞI KADARIYLA okuyabiliyoruz - Hierocles'in metni bağımsız olarak korunmadı. Bir polemiği sadece karşı tarafın alıntıları üzerinden okumak, bu serinin hayatta kalma yanlılığı omurgasının ders kitabı örneğidir.","divergence_type":["hayatta-kalma-yanliligi","ideolojik-secim"],"evidence":["Hierocles, Philalethes (Hakikat Dostu) adlı metinde Apollonius'un da benzer şeyler yaptığını, paganların onu tanrılaştırmadığını savundu.","Eusebios, Hierocles'e Karşı adlı bir reddiye yazdı ve bu reddiye korundu.","Hierocles'in özgün metni bağımsız olarak elimizde değil; içeriğini yalnızca Eusebios'un alıntılarından biliyoruz."],"counter_evidence":["Eusebios taraf bir aktarıcıdır; Hierocles'in argümanını eksik veya çarpıtarak vermiş olabilir - ve bunu kontrol edecek bağımsız bir metin yok."],"open_questions":["Hierocles'in özgün argümanı Eusebios'un aktardığından ne kadar farklıydı? Ölçülemez."],"sources":[{"tier":"primary","type":"edition","authors":["Eusebios (Kaisareia)"],"year":310,"title":"Contra Hieroclem (Hierocles'e Karşı)","language":"grc","note":"Hierocles'in metnine dair tek tanık; taraf aktarıcı."},{"tier":"primary","type":"edition","authors":["Lactantius"],"title":"De mortibus persecutorum 16","language":"la","note":"Hierocles'in zulümdeki rolüne değinen çağdaş kaynak."}],"checked":"2026-09-07","used_in":["isa-tarihsellik"]},{"schema_version":2,"id":"catisma-tezi-terk-edildi","claim":"Bilim ile dinin doğaları gereği ve sürekli çatıştığı tezi (Draper-White çatışma tezi) bilim tarihi alanında terk edilmiştir.","status":"established","confidence":"high","topic":["tarih-yazimi","bilim-tarihi","kilise","yontem"],"subject":{"site":"Bilim tarihi yazımı","region":"Avrupa ve Kuzey Amerika akademisi","modern_country":"çok uluslu"},"period":{"earliest":1874,"latest":2026,"era_label":"Tezin üretiminden reddine","precision":"range","dating_method":["historical-record","textual"]},"languages":["İngilizce"],"disciplines":["bilim-tarihi","tarih"],"people":[{"name":"Draper, John William","role":"proposer","year":1874,"lifespan":"1811-1882"},{"name":"White, Andrew Dickson","role":"proposer","affiliation":"Cornell University","year":1896,"lifespan":"1832-1918"},{"name":"Numbers, Ronald L.","role":"refuter","affiliation":"University of Wisconsin-Madison","year":2009}],"popular_claim":"Kilise bilimi bastırdı ve bin yıllık bir Karanlık Çağ yarattı; bilim ile din tarih boyunca savaş hâlindeydi.","divergence":"Anlatının belirli yazarları ve tarihleri var: Draper (1874) ve White (1896). 20. yüzyıl bilim tarihçileri kanıtları denetledi ve önemli bölümünün yanlış yorumlandığını ya da uydurulduğunu gösterdi. 2009'da Harvard University Press, alanın önde gelen tarihçilerinin yazdığı 25 denemelik bir derlemeyle mitleri tek tek ele aldı - bu, reddin kurumsallaştığının göstergesidir. DİKKAT: tezin çökmesi somut olayları tion","title":"Enheduanna Diski (kalker adak diski, Ur)","language":"akk","note":"Çağdaş buluntu. Enheduanna'yı adıyla, 'Nanna'nın en-rahibesi' unvanıyla ve Sargon'un kızı olarak tanımlar. Varlığın kanıtı budur - yazarlığın değil."},{"id":"helle-2023-enheduana","tier":"peer-reviewed","type":"book","authors":["Helle, Sophus"],"year":2023,"title":"Enheduana: The Complete Poems of the World's First Author","publisher":"Yale University Press","url":"https://sophushelle.com/category/enheduana/","language":"en","accessed":"2026-09-09","note":"Şiirlerin tam çevirisi ve yazarlık tartışmasının güncel değerlendirmesi. Helle atıf tartışmasını hem dikkat dağıtıcı hem çağdışı bulur. ISBN DOĞRULANAMADI; künye iki bağımsız aramayla teyit edildi ama URL olarak yazarın kendi sayfası kullanıldı - yayıncı kaydı kadar güçlü bir çıpa değil."}],"evidence":[{"id":"disk-cagdas-buluntu","text":"Enheduanna Diski çağdaş bir buluntudur ve onu adıyla, unvanıyla ve babasıyla tanımlar.","citations":[{"source_ref":"enheduanna-diski","locator":"Adak yazıtı","support_type":"direct"}]},{"id":"atfedilen-eserler","text":"Nin-me-şara (İnanna'nın Yüceltilmesi) ve Tapınak İlahileri geleneksel olarak ona atfedilir.","citations":[{"source_ref":"helle-2023-enheduana","locator":"Şiirlerin derlemi ve atıf geleneği","support_type":"claim-origin"}]},{"id":"birinci-tekil-anlatici","text":"Metinlerde birinci tekil şahıs anlatıcı ve kişisel bir ses var.","citations":[{"source_ref":"helle-2023-enheduana","locator":"Metin çevirileri","support_type":"direct"}]}],"counter_evidence":[{"id":"nushalar-500-yil-sonra","text":"Bilinen nüshaların hiçbiri çağdaş değil; hepsi ~500 yıl sonrasına, Eski Babil dönemine ait.","citations":[{"source_ref":"helle-2023-enheduana","locator":"Nüsha tarihlemesi","support_type":"counter"}]},{"id":"gec-donem-atif-gelenegi","text":"Mezopotamya'da geç dönem atıfları yaygın bir gelenektir; bir metni ünlü bir figüre bağlamak sık görülür. Alandan somut itiraz: 'Kâtipler neden geriye bakıp bir başrahibeyi seçsin? Çok sayıda başrahibe vardı. Neden o?'","citations":[{"source_ref":"helle-2023-enheduana","locator":"Yazarlık tartışmasının değerlendirmesi","support_type":"counter"}]},{"id":"anlatici-kisilestirme-olabilir","text":"Birinci tekil anlatıcı, yazarın kendisi olmayabilir - edebî bir kişileştirme de olabilir.","citations":[{"source_ref":"helle-2023-enheduana","locator":"Anlatıcı sesi tartışması","support_type":"counter"}]},{"id":"helle-ucuncu-konum","text":"Helle'nin kendi konumu ikisinden de farklı: yazarlık tartışmasını hem dikkat dağıtıcı hem çağdışı buluyor. Yazarlığın 'çok iplikli bir dokuma' olduğunu, kişi ile metin arasında birebir karşılık aramanın meseleyi kaçırdığını savunuyor.","citations":[{"source_ref":"helle-2023-enheduana","locator":"Yazarlık kavramı tartışması","support_type":"context"}]},{"id":"kunye-siniri","text":"Bu kaydın kaynağının TAM METNİ OKUNMADI ve ISBN'i doğrulanamadı; künye iki bağımsız aramayla teyit edildi.","citations":[{"source_ref":"helle-2023-enheduana","locator":"Kayıt düzeyi sınırı","support_type":"context"}]}],"open_questions":["Atıf tartışması yeni bir buluntu olmadan kapanabilir mi?","'İlk yazar' sorusu, yazarlık kavramının kendisi bu döneme uymuyorsa anlamlı mı?"],"checked":"2026-09-09","used_in":["sumer"],"review":{"status":"draft","notes":"Yer tutucu kaynak ('Enheduanna atfı üzerine Asirbilim tartışması') Helle 2023 ile değiştirildi. Helle'nin üçüncü konumu kayda eklendi - önceki sürümde tartışma yalnızca iki taraflı görünüyordu."}},{"schema_version":2,"id":"sumer-ur-nammu-tazminat","claim":"Bilinen en eski yasa derlemesi olan Ur-Nammu Yasaları bedensel zararlara tazminat öngörür; misilleme ilkesi ('göze göz') daha sonra gelir.","status":"established","confidence":"high","topic":["sumer","hukuk-tarihi","ur-nammu"],"subject":{"site":"Nippur ve Ur tabletleri","region":"Güney Mezopotamya","modern_country":"Irak","coordinates":{"lat":32.126,"lon":45.234}},"period":{"earliest":-2100,"latest":-2050,"era_label":"Ur III", yön de savunulabilir.","Manu anlatısının Mezopotamya ile ilişkisini doğrudan inceleyen Hint-Avrupa ve Vedik literatür taranmalı."],"checked":"2026-09-09","used_in":["tufan-bilmecesi"],"review":{"status":"draft","notes":"Lambert 1965 DOI ile doğrulandı AMA konusu Tekvin'dir, Manu değil. Bağlam kaynağı olarak alındı ve dolaylılığı açıkça yazıldı."}},{"schema_version":2,"id":"tufan-avustralya-deniz-seviyesi-hafizasi","claim":"Bazı Aborjin sözlü gelenekleri ~7.000 yıl öncesine ait kıyı çizgisi değişimini koruyor olabilir.","status":"contested","confidence":"medium","topic":["tufan","avustralya","sozlu-gelenek"],"subject":{"region":"Avustralya kıyıları","modern_country":"Avustralya"},"period":{"earliest":-7000,"latest":2016,"era_label":"Holosen deniz yükselmesi - modern derleme","precision":"range","dating_method":["radiocarbon","historical-record"]},"languages":["Aborjin dilleri"],"disciplines":["antropoloji","jeoloji"],"people":[{"name":"Nunn, Patrick D.","role":"proposer","affiliation":"University of the Sunshine Coast","year":2016},{"name":"Reid, Nicholas","role":"proposer","affiliation":"University of New England","year":2016}],"popular_claim":"Sözlü gelenek binlerce yıllık olayları güvenilir biçimde taşıyamaz.","divergence":"Bu kayıt tersini KANITLAMIYOR - ama iddianın sınanabilir hale geldiğini gösteriyor. Nunn ve Reid çok sayıda gelenekteki deniz yükselmesi motifini jeolojik kıyı verileriyle eşleştirdi. Zorluk şurada: eşleştirme SONRADAN yapılıyor. Bir anlatı ile bir jeolojik olay arasında örtüşme aramak, aramaya nereden başlandığına duyarlıdır. Yani bulgu ilginç, yöntemi tartışmalı - kaydın durumu 'contested' tam da bu yüzden.","divergence_type":["kategori-hatasi"],"sources":[{"id":"nunn-reid-2016-aboriginal-memories","language":"en","accessed":"2026-09-09","tier":"peer-reviewed","type":"article","authors":["Nunn, Patrick D.","Reid, Nicholas J."],"year":2016,"title":"Aboriginal Memories of Inundation of the Australian Coast Dating from More than 7000 Years Ago","container":"Australian Geographer","doi":"10.1080/00049182.2015.1077539","note":"İddianın kaynağı olan çalışma. Bu kayıtta doğrulayıcı değil, önerinin kendisi olarak kullanılıyor."}],"evidence":[{"id":"nunn-reid-eslestirmesi","text":"Nunn ve Reid (2016) çok sayıda gelenekte deniz yükselmesi motifi tespit etti ve jeolojik kıyı verileriyle eşleştirdi.","citations":[{"source_ref":"nunn-reid-2016-aboriginal-memories","locator":"Yöntem ve bulgular","support_type":"claim-origin"}]}],"counter_evidence":[{"id":"7000-yil-tartismali","text":"Sözlü aktarımın 7.000 yıl bilgi taşıyabileceği tartışmalı.","citations":[{"source_ref":"nunn-reid-2016-aboriginal-memories","locator":"Tartışma bölümü","support_type":"counter"}]},{"id":"sonradan-eslestirme","text":"Eşleştirme sonradan yapılan bir yorum; test edilebilirliği sınırlı.","citations":[{"source_ref":"nunn-reid-2016-aboriginal-memories","locator":"Yöntem sınırları","support_type":"counter"}]},{"id":"tek-calisma","text":"Bu kayıt TEK BİR ÇALIŞMAYA dayanıyor; öneriyi bağımsız olarak sınayan bir yayın burada künyelenmedi.","citations":[{"source_ref":"nunn-reid-2016-aboriginal-memories","locator":"Kaynak bağımsızlığı","support_type":"context"}]}],"open_questions":["Öneriyi bağımsız sınayan çalışma var mı? Bu turda aranmadı."],"checked":"2026-09-09","used_in":["tufan-bilmecesi"],"review":{"status":"draft","notes":"Nunn & Reid DOI ile bağlandı ve claim-origin olarak işaretlendi - kayıt tek bir çalışmaya dayanıyor, bu açıkça yazıldı."}}]</script>
<script>
(function(){
  "use strict";
  var ALL = JSON.parse(document.getElementById("data").textContent);
  var D = ALL.filter(function(r){ return r.schema_version === 2; });
  var STATUS = {
    established:"yerleşik", contested:"tartışmalı", minority:"azınlık görüşü",
    refuted:"çürütülmüş", unknown:"bilinmiyor", unmeasurable:"ölçülemez"
  };
  var REVIEW = {
    draft:"taslak", "editor-reviewed":"editör incelemeli", "expert-reviewed":"uzman incelemeli"
  };
  var SUPPORT = {
    direct:"doğrudan", inference:"çıkarım", context:"bağlam",
    "claim-origin":"iddia kökeni", counter:"karşı kanıt"
  };
  var state = {q:"", status:"", review:""};

  function esc(value){
    return String(value == null ? "" : value).replace(/[&<>"']/g,function(ch){
      return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[ch];
    });
  }
  function uniq(values){ return Array.from(new Set(values.filter(Boolean))); }
  function sourceMap(record){
    var map = {};
    (record.sources || []).forEach(function(source){ if(source.id) map[source.id] = source; });
    return map;
  }
  function sourceName(source, fallback){
    if(!source) return fallback;
    var lead = source.authors && source.authors.length ? source.authors[0] : source.title;
    return lead + (source.year ? " (" + source.year + ")" : "");
  }
  function sourceHref(source){
    if(!source) return "";
    if(source.url) return source.url;
    if(source.doi) return "https://doi.org/" + source.doi;
    return "";
  }
  function bibliography(source){
    var parts = [];
    if(source.authors && source.authors.length) parts.push(source.authors.join("; "));
    if(source.year) parts.push("(" + source.year + ")");
    if(source.title) parts.push(source.title);
    if(source.container) parts.push(source.container);
    if(source.volume) parts.push(source.volume);
    if(source.pages) parts.push("s. " + source.pages);
    if(source.publisher) parts.push(source.publisher);
    if(source.doi) parts.push("doi:" + source.doi);
    return parts.join(" · ");
  }
  function citations(item, sources, isCounter){
    return (item.citations || []).map(function(citation){
      var source = sources[citation.source_ref];
      var label = sourceName(source, citation.source_ref);
      var href = sourceHref(source);
      var cls = citation.support_type === "counter" || isCounter ? " counter" : "";
      var inner = "<span>" + esc(label) + "</span><span>· " + esc(citation.locator) + "</span>"
        + "<span class=\"ctype" + cls + "\">" + esc(SUPPORT[citation.support_type] || citation.support_type) + "</span>";
      return href
        ? "<a class=\"citation\" href=\"" + esc(href) + "\" target=\"_blank\" rel=\"noopener noreferrer\">" + inner + "</a>"
        : "<span class=\"citation\">" + inner + "</span>";
    }).join("");
  }
  function evidenceSection(record, field, title, isCounter){
    var items = (record[field] || []).filter(function(item){ return item && typeof item === "object"; });
    if(!items.length) return "";
    var sources = sourceMap(record);
    return "<section class=\"section\"><h3>" + esc(title) + "</h3><div class=\"items\">"
      + items.map(function(item){
          return "<article class=\"item" + (isCounter ? " counter" : "") + "\">"
            + "<span class=\"itemid\">" + esc(item.id) + "</span>"
            + "<p>" + esc(item.text) + "</p>"
            + "<div class=\"citations\">" + citations(item, sources, isCounter) + "</div>"
            + "</article>";
        }).join("")
      + "</div></section>";
  }
  function sourcesSection(record){
    if(!(record.sources || []).length) return "";
    return "<section class=\"section\"><h3>Kaynak künyeleri</h3><div class=\"sourcegrid\">"
      + record.sources.map(function(source){
          var href = sourceHref(source);
          return "<article class=\"source\"><span class=\"sid\">" + esc(source.id || "kimliksiz") + "</span>"
            + "<b>" + (href ? "<a href=\"" + esc(href) + "\" target=\"_blank\" rel=\"noopener noreferrer\">" + esc(source.title) + "</a>" : esc(source.title)) + "</b>"
            + "<p>" + esc(bibliography(source)) + "</p></article>";
        }).join("")
      + "</div></section>";
  }
  function recordCard(record){
    var review = record.review && record.review.status || "draft";
    var evidenceCount = (record.evidence || []).filter(function(v){return v && typeof v === "object";}).length;
    var counterCount = (record.counter_evidence || []).filter(function(v){return v && typeof v === "object";}).length;
    var citationCount = ["evidence","counter_evidence"].reduce(function(total,field){
      return total + (record[field] || []).reduce(function(sum,item){return sum + ((item && item.citations) || []).length;},0);
    },0);
    var period = record.period || {};
    var facts = [
      ["sınıflandırma güveni", record.confidence || "—"],
      ["inceleme", REVIEW[review] || review],
      ["kanıt / karşı kanıt", evidenceCount + " / " + counterCount],
      ["atıf bağlantısı", citationCount],
      ["son kontrol", record.checked || "—"]
    ];
    return "<details class=\"record\">"
      + "<summary><span class=\"badge " + esc(record.status) + "\">" + esc(STATUS[record.status] || record.status) + "</span>"
      + "<span><span class=\"claim\">" + esc(record.claim) + "</span><span class=\"meta\">"
      + "<span>" + esc(record.id) + "</span>"
      + (record.subject && record.subject.site ? "<span>· " + esc(record.subject.site) + "</span>" : "")
      + (period.era_label ? "<span>· " + esc(period.era_label) + "</span>" : "")
      + "<span class=\"review-" + esc(review) + "\">· " + esc(REVIEW[review] || review) + "</span>"
      + "</span></span><span class=\"chev\" aria-hidden=\"true\"></span></summary>"
      + "<div class=\"body\"><div class=\"auditfacts\">"
      + facts.map(function(f){return "<div class=\"fact\"><span>" + esc(f[0]) + "</span><b>" + esc(f[1]) + "</b></div>";}).join("")
      + "</div>"
      + (record.popular_claim ? "<section class=\"section\"><h3>Popüler hâli ve sapma</h3><div class=\"item counter\"><p><strong>" + esc(record.popular_claim) + "</strong></p>"
          + (record.divergence ? "<p style=\"margin-top:.45rem\">" + esc(record.divergence) + "</p>" : "") + "</div></section>" : "")
      + evidenceSection(record,"evidence","Lehte kanıt",false)
      + evidenceSection(record,"counter_evidence","Aleyhte kanıt ve sınırlar",true)
      + sourcesSection(record)
      + (record.review && record.review.notes ? "<section class=\"section\"><h3>İnceleme notu</h3><div class=\"item\"><p>" + esc(record.review.notes) + "</p></div></section>" : "")
      + "</div></details>";
  }
  function searchable(record){
    return [
      record.id, record.claim, record.popular_claim, record.divergence,
      (record.topic || []).join(" "),
      (record.sources || []).map(function(s){return [s.id,s.title,(s.authors||[]).join(" ")].join(" ");}).join(" ")
    ].join(" ").toLocaleLowerCase("tr");
  }
  function render(){
    var rows = D.filter(function(record){
      if(state.status && record.status !== state.status) return false;
      var review = record.review && record.review.status || "draft";
      if(state.review && review !== state.review) return false;
      if(state.q && searchable(record).indexOf(state.q) < 0) return false;
      return true;
    });
    rows.sort(function(a,b){
      var ro = {"expert-reviewed":0,"editor-reviewed":1,draft:2};
      var ar = a.review && a.review.status || "draft";
      var br = b.review && b.review.status || "draft";
      return (ro[ar] - ro[br]) || a.claim.localeCompare(b.claim,"tr");
    });
    document.getElementById("records").innerHTML = rows.length
      ? rows.map(recordCard).join("")
      : "<div class=\"empty\">Bu filtrelerle eşleşen v2 kayıt bulunamadı.</div>";
    document.getElementById("resultline").innerHTML = "<span><b>" + rows.length + "</b> / " + D.length + " denetlenebilir kayıt</span>"
      + "<span>" + (ALL.length - D.length) + " eski biçim kayıt bu görünümün dışında</span>";
  }
  function options(){
    var statuses = uniq(D.map(function(r){return r.status;}));
    var reviews = uniq(D.map(function(r){return r.review && r.review.status || "draft";}));
    document.getElementById("status").innerHTML = "<option value=\"\">Tümü</option>"
      + statuses.map(function(v){return "<option value=\"" + esc(v) + "\">" + esc(STATUS[v] || v) + "</option>";}).join("");
    document.getElementById("review").innerHTML = "<option value=\"\">Tümü</option>"
      + reviews.map(function(v){return "<option value=\"" + esc(v) + "\">" + esc(REVIEW[v] || v) + "</option>";}).join("");
  }
  function stats(){
    var evidence = 0, citationsCount = 0, drafts = 0;
    D.forEach(function(record){
      ["evidence","counter_evidence"].forEach(function(field){
        (record[field] || []).forEach(function(item){
          if(item && typeof item === "object"){ evidence += 1; citationsCount += (item.citations || []).length; }
        });
      });
      if(!record.review || record.review.status === "draft") drafts += 1;
    });
    var items = [[D.length,"şema v2 kayıt"],[evidence,"kimlikli kanıt"],[citationsCount,"konumlu atıf"],[drafts,"uzman incelemesi bekleyen"]];
    document.getElementById("stats").innerHTML = items.map(function(item){
      return "<div class=\"stat\"><b>" + item[0] + "</b><span>" + esc(item[1]) + "</span></div>";
    }).join("");
    document.getElementById("legacy-note").textContent =
      (ALL.length - D.length) + " kayıt hâlâ v1 biçimindedir; bu sayı göç borcudur, kalite puanı değildir.";
  }

  document.getElementById("q").addEventListener("input",function(event){
    state.q = event.target.value.trim().toLocaleLowerCase("tr"); render();
  });
  document.getElementById("status").addEventListener("change",function(event){
    state.status = event.target.value; render();
  });
  document.getElementById("review").addEventListener("change",function(event){
    state.review = event.target.value; render();
  });

  options(); stats(); render();
})();
</script>
</body>
</html>
