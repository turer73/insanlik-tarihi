<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="İnsanlık Tarihi bulgularında kanıt, kaynak ve konum bağlantılarını denetleme aracı.">
  <title>Kanıt Denetimi · İnsanlık Tarihi</title>
  <style>
    :root{
      color-scheme:light dark;
      --bg:#eceae4;--surface:#f7f5f0;--raised:#fff;--ink:#171a1c;--muted:#565d62;
      --quiet:#7a8186;--rule:#cbc7bd;--soft:#dfdcd4;--accent:#264e6a;--accent-soft:#d9e5ec;
      --ok:#286343;--ok-soft:#d9eadf;--warn:#865f09;--warn-soft:#f1e5c4;
      --bad:#92382c;--bad-soft:#f1dbd6;--special:#60417f;--special-soft:#e6dcef;
      --mono:ui-monospace,SFMono-Regular,Consolas,"Liberation Mono",monospace;
      --sans:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      --serif:Georgia,"Times New Roman",serif;
    }
    @media(prefers-color-scheme:dark){
      :root{--bg:#111518;--surface:#181d21;--raised:#1e2429;--ink:#e7eaec;--muted:#a8afb4;
        --quiet:#7d858b;--rule:#343b41;--soft:#292f34;--accent:#8bb9d6;--accent-soft:#182b38;
        --ok:#78c99a;--ok-soft:#142a1e;--warn:#dfb75f;--warn-soft:#2c2514;
        --bad:#e08a7d;--bad-soft:#311b17;--special:#c0a2df;--special-soft:#291f34}
    }
    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 var(--sans);-webkit-font-smoothing:antialiased}
    a{color:var(--accent);text-underline-offset:3px}
    button,input,select{font:inherit;color:inherit}
    :focus-visible{outline:3px solid var(--accent);outline-offset:2px}
    .skip{position:absolute;left:-999px;top:0;background:var(--raised);padding:.7rem 1rem;z-index:20}
    .skip:focus{left:.75rem;top:.75rem}
    header{border-bottom:1px solid var(--rule);background:var(--surface)}
    .wrap{max-width:1280px;margin:auto;padding-inline:clamp(1rem,3vw,2.2rem)}
    .hero{padding-block:clamp(2rem,5vw,3.6rem) 1.5rem}
    .eyebrow{font:700 .7rem/1.2 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
    h1,h2,h3{font-family:var(--serif);letter-spacing:-.015em;text-wrap:balance}
    h1{font-size:clamp(2rem,5vw,3.5rem);line-height:1.02;margin:.55rem 0 .8rem;max-width:14ch}
    .lede{max-width:72ch;color:var(--muted);font-size:1rem;margin:0}
    .lede strong{color:var(--ink)}
    .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(135px,1fr));gap:1px;background:var(--rule);border:1px solid var(--rule);margin-top:1.4rem}
    .stat{background:var(--surface);padding:.75rem .9rem}
    .stat b{display:block;font:700 1.5rem/1.1 var(--serif)}
    .stat span{font:600 .68rem/1.3 var(--mono);color:var(--quiet);text-transform:uppercase;letter-spacing:.06em}
    main{padding-block:1.2rem 4rem}
    .controls{display:grid;grid-template-columns:minmax(220px,1fr) repeat(2,minmax(150px,220px));gap:.75rem;
      border:1px solid var(--rule);background:var(--surface);padding:.9rem;position:sticky;top:0;z-index:5}
    .field{display:flex;flex-direction:column;gap:.25rem}
    .field label{font:700 .65rem/1.2 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--quiet)}
    input,select{width:100%;min-height:40px;border:1px solid var(--rule);background:var(--raised);padding:.45rem .6rem;border-radius:0}
    .resultline{display:flex;justify-content:space-between;gap:1rem;align-items:center;flex-wrap:wrap;
      color:var(--quiet);font:500 .74rem/1.4 var(--mono);padding:.8rem .1rem}
    .resultline b{color:var(--ink)}
    .records{display:flex;flex-direction:column;gap:.7rem}
    details.record{border:1px solid var(--rule);background:var(--raised)}
    details.record[open]{border-color:var(--accent)}
    summary{list-style:none;cursor:pointer;padding:1rem;display:grid;grid-template-columns:auto 1fr auto;gap:.75rem;align-items:start}
    summary::-webkit-details-marker{display:none}
    summary:hover{background:var(--surface)}
    .claim{font-weight:650;line-height:1.4}
    .meta{display:flex;flex-wrap:wrap;gap:.25rem .7rem;margin-top:.3rem;color:var(--quiet);font:500 .67rem/1.4 var(--mono)}
    .chev{color:var(--quiet);font:700 .72rem/1.4 var(--mono);white-space:nowrap}
    details[open] .chev::before{content:"kapat −"}
    details:not([open]) .chev::before{content:"incele +"}
    .badge{display:inline-flex;align-items:center;padding:.22rem .46rem;font:700 .62rem/1.2 var(--mono);letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
    .established{background:var(--ok-soft);color:var(--ok)} .contested{background:var(--warn-soft);color:var(--warn)}
    .minority{background:var(--accent-soft);color:var(--accent)} .refuted{background:var(--bad-soft);color:var(--bad)}
    .unknown{background:var(--soft);color:var(--muted)} .unmeasurable{background:var(--special-soft);color:var(--special)}
    .body{border-top:1px solid var(--soft);padding:1rem;display:flex;flex-direction:column;gap:1rem}
    .auditfacts{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:1px;background:var(--soft);border:1px solid var(--soft)}
    .fact{background:var(--surface);padding:.65rem .75rem}
    .fact span{display:block;color:var(--quiet);font:700 .61rem/1.3 var(--mono);letter-spacing:.08em;text-transform:uppercase}
    .fact b{display:block;margin-top:.12rem;font-size:.85rem}
    .section{display:flex;flex-direction:column;gap:.5rem}
    .section h3{font-family:var(--mono);font-size:.67rem;letter-spacing:.1em;text-transform:uppercase;color:var(--quiet);margin:0}
    .items{display:flex;flex-direction:column;gap:.45rem}
    .item{border-left:3px solid var(--accent);background:var(--surface);padding:.72rem .8rem}
    .item.counter{border-left-color:var(--bad)}
    .item p{margin:0;color:var(--muted);max-width:84ch}
    .itemid{display:block;margin-bottom:.25rem;font:600 .62rem/1.3 var(--mono);color:var(--quiet)}
    .citations{display:flex;flex-wrap:wrap;gap:.32rem;margin-top:.55rem}
    .citation{display:inline-flex;flex-wrap:wrap;align-items:center;gap:.3rem;border:1px solid var(--rule);
      background:var(--raised);padding:.28rem .45rem;font:600 .66rem/1.35 var(--mono);text-decoration:none}
    .citation:hover{border-color:var(--accent)}
    .ctype{padding:.08rem .28rem;background:var(--accent-soft);color:var(--accent)}
    .ctype.counter{background:var(--bad-soft);color:var(--bad)}
    .sourcegrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:.5rem}
    .source{border:1px solid var(--rule);padding:.75rem;background:var(--surface)}
    .source .sid{font:600 .61rem/1.3 var(--mono);color:var(--quiet)}
    .source b{display:block;margin:.25rem 0 .15rem}
    .source p{margin:0;color:var(--muted);font-size:.82rem}
    .review-draft{color:var(--warn)} .review-editor-reviewed{color:var(--accent)} .review-expert-reviewed{color:var(--ok)}
    .empty{border:1px dashed var(--rule);padding:2.5rem 1rem;text-align:center;color:var(--quiet)}
    .legacy-note{margin-top:.8rem;color:var(--quiet);font-size:.78rem}
    @media(max-width:760px){
      .controls{grid-template-columns:1fr;position:static}
      summary{grid-template-columns:auto 1fr}.chev{grid-column:2}
    }
    @media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
  
/* Siteye geri donus */
.geri{display:inline-flex;align-items:center;gap:.4rem;font-family:var(--mono);font-size:.72rem;
  font-weight:600;letter-spacing:.05em;text-decoration:none;color:var(--muted);
  border:1px solid var(--rule);padding:.35rem .65rem;margin-bottom:.9rem;
  transition:color .15s ease,border-color .15s ease,background .15s ease}
.geri:hover{color:var(--accent);border-color:var(--accent);background:var(--accent-soft)}
.geri:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
</style>
</head>

<a class="skip" href="#content">İçeriğe geç</a>
<header>
  <div class="wrap hero">
    <a class="geri" href="https://kanitatlasi.com/">&#8592; Kanıt Atlası</a>
    <div class="eyebrow">İnsanlık Tarihi · araştırma altyapısı</div>
    <h1>Kanıt denetimi</h1>

    <div class="stats" id="stats" aria-label="Denetim özeti"></div>
    <p class="legacy-note" id="legacy-note"></p>

    </div>
    <div class="field">
      <label for="review">İnceleme durumu</label>
      <select id="review"><option value="">Tümü</option></select>
    </div>
  </section>

  <div class="resultline" id="resultline" aria-live="polite"></div>
  <section class="records" id="records" aria-label="Denetlenebilir bulgular"></section>
</main>

naklardır.","status":"contested","confidence":"medium","topic":["kapadokya","derinkuyu","matiate","islev"],"subject":{"site":"Kapadokya yer altı yerleşimleri ve Matiate","region":"Kapadokya ve Yukarı Mezopotamya","modern_country":"Türkiye","coordinates":{"lat":38.3735,"lon":34.7345}},"period":{"earliest":100,"latest":1000,"era_label":"Belgelenebilir kullanım dönemi","precision":"range","dating_method":["typology","historical-record"]},"languages":["Türkçe"],"disciplines":["arkeoloji","mimarlik"],"popular_claim":"Yer altı şehirleri saldırı anında sığınmak için kazılmış gizli sığınaklardır.","divergence":"Savunma özellikleri gerçektir - tek kişilik dar geçitler, içeriden kapatılan taş kapılar. AMA 'yalnızca sığınak' çerçevesi eksik: hem Derinkuyu'da hem Matiate'de mekanlar ÜRETİM VE DEPOLAMA işlevi taşıyor. Bakanlığın resmî sayfası Derinkuyu'da şarap üretim tesisleri, erzak depoları, kiliseler ve manastırlar sayar. Matiate'de hakemli çalışma A-1 ve A-4 mekanlarını üzüm işliği, silo ve şırahane olarak değerlendirir. Bunlar kısa süreli sığınmanın değil, SÜREGİDEN EKONOMİK KULLANIMIN işaretleridir. Doğru soru 'sığınak mı' değil, 'sığınma İLE üretim aynı mekânda nasıl birleşiyor'.","divergence_type":["kategori-hatasi","turizm-kopyalamasi"],"sources":[{"id":"kultur-portali-derinkuyu","tier":"institutional","type":"webpage","title":"Derinkuyu Yeraltı Şehri","institution":"T.C. Kültür ve Turizm Bakanlığı - Kültür Portalı","url":"https://www.kulturportali.gov.tr/turkiye/nevsehir/gezilecekyer/derinkuyu-yeralti-sehri","language":"tr","accessed":"2026-09-07","note":"Resmî kurumsal kaynak. Kapasite rakamı ve havalandırma bacası sayısı VERMEZ - bu yokluk kayıtlarda kanıt olarak kullanılmıştır."},{"id":"ersun-2021-matiate","tier":"peer-reviewed","type":"article","authors":["Ersun, Durmuş"],"year":2021,"title":"Matiate (Midyat) Yeraltı Şehri A-1 ve A-4 Mekanlarının İşlevine Yönelik Bir Değerlendirme","container":"Sinop Üniversitesi Sosyal Bilimler Dergisi","volume":"5(2)","pages":"1 f":"ersun-2021-matiate","locator":"Kapsam","support_type":"context"}]},{"id":"tarihleme-islev-baglantisi","text":"Hangi mekânın hangi dönemde hangi işlevle kullanıldığı tarihlenemediği için (bkz. kapadokya-tarihlenemez), işlev tartışması da kesin sonuca bağlanamaz.","citations":[{"source_ref":"derinkuyu-wikipedia-en","locator":"Tarihçe bölümü","support_type":"counter"}]}],"open_questions":["Sığınma ile üretim aynı mekânda nasıl birleşiyordu - mevsimlik mi, sürekli mi, dönemsel mi?","Üretim mekânları savunma mekânlarıyla aynı evreye mi ait? Tarihleme yapılamadığı için açık."],"checked":"2026-09-07","used_in":["kapadokya"],"supersedes":[],"review":{"status":"draft","notes":"BU KAYDIN ESASI DEĞİŞTİ. Önceki sürüm 'insan saldırılarından korunmak için yapılmış sığınaklardır' iddiasını established sayıyordu. Türkçe kaynaklar (Bakanlık resmî sayfası + Ersun 2021) her iki bölgede de üretim/depolama işlevi gösterdiği için iddia 'yalnızca sığınak' biçiminde daraltıldı ve contested'a çekildi."}},{"schema_version":2,"id":"gobekli-karahan-alan-karsilastirmasi","claim":"Karahan Tepe yüzey alanı olarak Göbekli Tepe'den büyüktür.","status":"refuted","confidence":"medium","topic":["gobekli-tepe","karahan-tepe","tas-tepeler","yontem"],"subject":{"site":"Göbekli Tepe ve Karahan Tepe","region":"Şanlıurfa, Yukarı Mezopotamya","modern_country":"Türkiye","coordinates":{"lat":37.2233,"lon":38.9224}},"period":{"earliest":-9600,"latest":-8000,"era_label":"Çanak Çömleksiz Neolitik A-B","precision":"range","dating_method":["radiocarbon","stratigraphy"]},"languages":["Türkçe","İngilizce"],"disciplines":["arkeoloji","jeoloji"],"popular_claim":"Karahan Tepe Göbekli Tepe'den daha büyüktür.","divergence":"Bu proje de aynı hatayı yaptı ve kaydı düzeltiyor. Karahan Tepe için dolaşan dört farklı rakam (10 / 13-14 / 15 / 32,5 ha) tabloya konup 'hangisi neyi sayıyor' diye soruldu - doğru bir uyarı. Ama AYNI SORU GÖBEKLİ TEPE İÇİN SORULMADI: Karahan'ın değişken aralığı, Göbekli'nin tek ve denetlenmemiş bi i-tahmin","text":"Saray kitaplığının 273'te zarar görmüş olması mümkündür, fakat bunu doğrudan söyleyen antik bir kaynak yoktur; sonuç saray bölgesindeki genel yıkımdan çıkarılır.","citations":[{"source_ref":"bagnall-2002-library-dreams","locator":"s. 358, ilk paragraf","support_type":"direct"}]},{"id":"serapeum-ayri-koleksiyon","text":"İskenderiye'de birden fazla kitaplık bulunmuş olabileceği için Caesar veya Aurelian dönemindeki bir yıkımın Serapeum'daki olası koleksiyonu zorunlu olarak sona erdirmesi gerekmez.","citations":[{"source_ref":"bagnall-2002-library-dreams","locator":"s. 358, ikinci ve üçüncü paragraflar","support_type":"direct"}]},{"id":"omer-anlatisi-gec","text":"Halife Ömer'in kitapları yaktırdığı anlatısı olaydan yüzyıllar sonra ortaya çıkar ve modern uzmanlık literatüründe tarihsel kurgu olarak değerlendirilir.","citations":[{"source_ref":"bagnall-2002-library-dreams","locator":"s. 357, ilk paragraf ve dn. 37","support_type":"direct"}]}],"counter_evidence":[{"id":"strabon-sessizligi-belirsiz","text":"Strabon Caesar yangınından sonra Mouseion'u betimlerken kitaplıktan açıkça söz etmez; bu sessizlik hem süreklilik hem de kayıp yönünde kesin kanıt sayılamaz.","citations":[{"source_ref":"bagnall-2002-library-dreams","locator":"s. 357, dn. 39","support_type":"counter"}]}],"sources":[{"id":"bagnall-2002-library-dreams","tier":"peer-reviewed","type":"article","authors":["Bagnall, Roger S."],"year":2002,"title":"Alexandria: Library of Dreams","container":"Proceedings of the American Philosophical Society","volume":"146(4)","pages":"348-362","url":"https://archive.nyu.edu/handle/2451/28263","language":"en","accessed":"2026-09-07"}],"open_questions":["Saray kitaplığı tam olarak ne zaman ve hangi ölçekte işlevini yitirdi?","Serapeum'da geç antikçağa kadar yaşayan koleksiyonun kapsamı neydi?"],"checked":"2026-09-07","used_in":["iskenderiye"],"review":{"status":"draft","notes":"Kaynak-konum zinciri kuruldu; konu uzmanı incelemesi henüz yapılmadı."}},{"schema_ve 9, ikinci paragraf","support_type":"direct"}]},{"id":"kopyalarin-hayatta-kalma-secimi","text":"Antik eserlerin çoğu birden fazla nüsha hâlinde bulunuyordu; belirleyici sorun tek bir merkezdeki yıkımdan çok, nüshaların sonraki yüzyıllarda kopyalanmaya devam edip etmemesiydi.","citations":[{"source_ref":"bagnall-2002-library-dreams","locator":"s. 360, ilk paragraf","support_type":"direct"}]}],"counter_evidence":[{"id":"yanginlar-onemsiz-degil","text":"Yangın ve savaşlar belirli koleksiyonları gerçekten yok etmiş olabilir; kaynaklar, toplam kayıpta fiziksel felaket ile uzun süreli kurumsal çözülmenin payını nicel olarak ayırmaya yetmez.","citations":[{"source_ref":"bagnall-2002-library-dreams","locator":"s. 356-360","support_type":"counter"}]}],"sources":[{"id":"bagnall-2002-library-dreams","tier":"peer-reviewed","type":"article","authors":["Bagnall, Roger S."],"year":2002,"title":"Alexandria: Library of Dreams","container":"Proceedings of the American Philosophical Society","volume":"146(4)","pages":"348-362","url":"https://archive.nyu.edu/handle/2451/28263","language":"en","accessed":"2026-09-07"}],"open_questions":["İskenderiye koleksiyonlarında kopyalama hızını ve bütçeyi gösteren kayıp idari kayıtlar var mıydı?","Tek tek eserlerin aktarım zincirinde hangi seçim mekanizması daha belirleyiciydi?"],"checked":"2026-09-07","used_in":["iskenderiye"],"review":{"status":"draft","notes":"Ana sentez kaynağındaki sayfa konumları bağlandı; ikinci uzmanlık kaynağıyla çapraz inceleme önerilir."}},{"schema_version":2,"id":"iskenderiye-metin-elestirisi-dogdu","claim":"Metin eleştirisi, İskenderiye'de Homeros metinlerinin karşılaştırılması ve standartlaştırılmasıyla ilk sürekli kurumsal programına kavuştu.","status":"established","confidence":"high","topic":["iskenderiye","metin-elestirisi","yontem-tarihi"],"subject":{"site":"İskenderiye Mouseion","region":"Helenistik Mısır","modern_country":"Mısır","coordinates":{"lat":31.2001,"lon":29.9187}},"period":{"earliest":-280,"latest":-1 latılarında ayı sonbaharda yaralanır ve kanı yaprakları kızartır - mevsimle bağlı, ayrıntılı bir versiyon.","Yunan geleneğinde de takımyıldız bir ayıdır ve Yunan anlatısı bunu açıklamakta zorlanır: dönüşüm hikâyesi, zaten var olan bir ada sonradan getirilmiş bir gerekçe gibi durur.","Kuzey Avrasya ve Kuzey Amerika halkları en az 15.000 yıl önce ayrıldı; kara köprüsü sular altında, sonraki temas seçeneği fiilen kapalı."],"counter_evidence":["Dağılım sürekli değil: Çin, Hindistan ve İskandinavya'da ayı okuması yok. Ortak kökense bu geleneklerin hepsinde KAYBOLMUŞ olması gerekir - mümkün ama test edilemez.","16.-19. yüzyıl teması hafife alınıyor: derlemelerin çoğu misyoner ve etnograflar aracılığıyla yapıldı; Avrupa anlatılarının sızma ihtimali her vakada ayrıca elenmeli.","Örneklem küçük; 47 versiyon iki kıtaya yayılmış yüzlerce geleneği temsil etmiyor."],"open_questions":["Motif gerçekten Bering öncesinden mi geliyor? Mevcut örneklemle ayrılamıyor.","Sömürge dönemi teması ne ölçüde bulaştı? Çoğu çalışmada bu eleme yapılmıyor."],"sources":[{"tier":"peer-reviewed","type":"article","authors":["d'Huy, Julien"],"year":2013,"title":"A Cosmic Hunt in the Berber sky: a phylogenetic reconstruction of Palaeolithic mythology","container":"Les Cahiers de l'AARS","volume":"15","language":"en"},{"tier":"peer-reviewed","type":"article","title":"The Cultural Transmission and Evolution of Folk Narratives","url":"https://durham-repository.worktribe.com/OutputFile/1642267","language":"en","accessed":"2026-09-07","note":"Karşı görüş ve yöntem itirazları."}],"checked":"2026-09-07","volatile":true,"used_in":["gokteki-ayi"]},{"schema_version":2,"id":"laurasia-hipotezi","claim":"Dünya mitolojileri, biri yaratılıştan yıkıma uzanan tutarlı bir hikâye çizgisi taşıyan iki büyük aileye ayrılır ve birincisinin kökeni yaklaşık 40.000 yıl öncesine dayanır.","status":"minority","confidence":"medium","topic":["mitoloji","karsilastirmali-mitoloji","yontem"],"subject":{"site":"Dünya mitolojileri","regi rs düşen yorumlar da mevcut - doğrulama yanlılığı işareti.","citations":[{"source_ref":"thompson-2013-witzel-degerlendirmesi","locator":"Yan alan kanıtlarının değerlendirmesi","support_type":"counter"}]},{"id":"tam-metin-okunmadi","text":"Bu kayıttaki itirazların ayrıntısı değerlendirmenin TAM METNİNDEN değil, kaydın önceki sürümünden devralınmıştır. Künye ve yazar doğrulandı; itirazların metindeki tam ifadesi doğrulanmadı.","citations":[{"source_ref":"thompson-2013-witzel-degerlendirmesi","locator":"Kayıt düzeyi sınırı","support_type":"context"}]}],"open_questions":["İki aile ayrımı, ölçütler tutarlı uygulandığında ayakta kalır mı?","Thompson'ın değerlendirmesinin tam metni okunduğunda itirazlar burada yazıldığı gibi mi duruyor?"],"checked":"2026-09-09","used_in":["gokteki-ayi"],"review":{"status":"draft","notes":"Ölü kaynak canlı sürümüyle değiştirildi, yazar ve yıl eklendi, tier kitap değerlendirmesi olduğu için institutional'a düşürüldü. Tam metinler okunmadı."}},{"id":"motif-yoklugu-cevre","claim":"Bir mitolojik motifin bir gelenekte bulunmaması her zaman kültürel mesafeyi gösterir.","status":"refuted","confidence":"high","topic":["mitoloji","yontem","cevre"],"subject":{"site":"İnuit bölgesi - ağaç sınırının kuzeyi","region":"Kuzey Kutbu","modern_country":"Kanada / Grönland / ABD (Alaska)","coordinates":{"lat":68,"lon":-100}},"period":{"earliest":1000,"latest":1950,"era_label":"Etnografik derleme dönemi","precision":"range","dating_method":["historical-record"]},"disciplines":["antropoloji","jeoloji"],"popular_claim":"Dünya ağacı motifi neredeyse evrenseldir; bulunmadığı yerler bu evrensel mirastan kopmuş demektir.","divergence":"İnuit geleneğinde dünya ağacı yok - ve sebebi kültürel uzaklık değil, AĞAÇ SINIRININ KUZEYİNDE YAŞAMAK. Bir motifin yokluğu bazen sadece o şeyin orada bulunmadığını gösterir. Karşılaştırmalı mitolojinin en sık atladığı nokta budur: karşılaştırılan halklar AYNI MALZEMEYE SAHİP DEĞİLDİR. Evrensellik iddiaları en çok burada tökezliyor.","divergence_type":["kategori-hatasi"],"evidence":["Dünya ağacı motifi Hint, Çin, İskandinav ve Sibirya geleneklerinde merkezî yer tutar.","İnuit yerleşim bölgesinin büyük bölümü ağaç sınırının kuzeyindedir; ağaç yerel çevrede bulunmaz."],"counter_evidence":["Çevresel açıklama her yokluk için geçerli değildir; bazı yokluklar gerçekten kültürel ayrışmayı gösterir. Bu kayıt 'her zaman kültürel mesafe' iddiasını çürütür, çevrenin her zaman belirleyici olduğunu savunmaz.","Sürüklenmiş odun (driftwood) İnuit maddi kültüründe kullanılıyordu; ağacın tamamen bilinmediği söylenemez."],"sources":[{"tier":"peer-reviewed","type":"chapter","title":"Phylogenetics Meets Folklore: Bioinformatics Approaches to the Study of International Folktales","url":"https://link.springer.com/content/pdf/10.1007/978-3-319-39445-9_6.pdf","language":"en","accessed":"2026-09-07","note":"Çevre ve motif dağılımı ilişkisi tartışması için."}],"checked":"2026-09-07","used_in":["gokteki-ayi"]},{"id":"gelenek-tek-kutu-hatasi","claim":"'Kızılderili mitolojisi' ve 'Eskimo mitolojisi' karşılaştırmalarda tek bir gelenek olarak ele alınabilir.","status":"refuted","confidence":"high","topic":["mitoloji","yontem","karsilastirmali-mitoloji"],"subject":{"site":"Kuzey ve Güney Amerika yerli gelenekleri","region":"Amerika kıtaları ve Kuzey Kutbu","modern_country":"çok uluslu"},"period":{"earliest":1800,"latest":2026,"era_label":"Etnografik derlemeden bugüne","precision":"range","dating_method":["historical-record"]},"disciplines":["antropoloji","dilbilim"],"popular_claim":"Kızılderili mitolojisinde de aynı motif var - demek ki motif evrensel.","divergence":"'Kızılderili mitolojisi' diye tek bir şey yoktur: iki kıtaya yayılmış, birbirinden DİL AİLESİ DÜZEYİNDE ayrı yüzlerce gelenek vardır. Aynı şey 'Eskimo' için de geçerli - İnuit ve Yupik gelenekleri ayrıdır ve kendi içlerinde de bölgeseldir. 'Yunan mitolojisi' ile 'Kızılderili mitolojisi'ni aynı sütun düzeyine koymak, bir şehri bir kıtayla karşılaştırmaktır. Hata TEK YÖNDE çalışır: çeşitliliği tek kutuya sıkıştırdığınızda o kutuda 'her şey' bulunur ve her benzerlik doğrulanmış görünür.","divergence_type":["kategori-hatasi","somurge-anlatisi"],"evidence":["Amerika kıtalarında birbirinden dil ailesi düzeyinde ayrı yüzlerce yerli gelenek vardır.","İnuit ve Yupik gelenekleri ayrıdır; kendi içlerinde de bölgesel farklar taşır.","Sütunlar tek tek geleneklere bölündüğünde karşılaştırma kutularının çoğu boş ya da 'veri yetersiz' çıkar."],"counter_evidence":["Bölgesel gruplamalar (örneğin Kuzeydoğu Ormanları, Kutup bölgesi) yöntemsel olarak savunulabilir; itiraz bu tür dikkatli gruplamalara değil, kıta ölçeğinde tek kutuya karşıdır."],"sources":[{"tier":"peer-reviewed","type":"article","title":"The Cultural Transmission and Evolution of Folk Narratives","url":"https://durham-repository.worktribe.com/OutputFile/1642267","language":"en","accessed":"2026-09-07","note":"Örneklem ve birim sorunları tartışması."}],"checked":"2026-09-07","used_in":["gokteki-ayi"]},{"id":"yanlis-teslim-olum-motifi","claim":"Sahra altı Afrika'nın geniş bir bölümünde ölümün kökeni bir ceza değil, yanlış teslim edilmiş bir mesajla açıklanır.","status":"established","confidence":"high","topic":["mitoloji","olum-kokeni","afrika","motif-dagilimi"],"subject":{"site":"Sahra altı Afrika","region":"Afrika","modern_country":"çok uluslu"},"period":{"earliest":1850,"latest":1960,"era_label":"Etnografik derleme dönemi","precision":"range","dating_method":["historical-record"]},"languages":["Bantu dilleri","Khoisan dilleri"],"disciplines":["antropoloji","dilbilim"],"people":[{"name":"Abrahamsson, Hans","role":"analyst","year":1951}],"popular_claim":"Ölümün bir yasağın çiğnenmesinin cezası olduğu fikri evrenseldir.","divergence":"Değil. Bu anlatı tipinde ölüm AHLAKİ BİR SONUÇ DEĞİL, İDARİ BİR KAZADIR: kimse yasak meyve yemez, kimse tanrıları kızdırmaz. Tanrı ölümsüzlük veya yeniden doğuş haberini gönderir; ikinci bir haberci - ya da kulak misafiri olan biri - tersini taşır. Yavaş olan gecikir, hızlı olan önce varır ve ilk duyulan mesaj bağlayıcı olur. 'Ölüm cezadır' kalıbının evrensel sanılması, tanıdık olanı evrensel sanmanın örneğidir.","divergence_type":["kategori-hatasi","ideolojik-secim"],"evidence":["En yaygın haberci çifti bukalemun (yavaş, iyi haber) ve kertenkeledir (hızlı, kötü haber).","Malavi'deki Tumbuka anlatımında haberi gönderen Chiuta'dır; bukalemun yeniden doğuş, kertenkele kalıcı ölüm haberiyle yola çıkar ve kertenkele önce varır.","Bazı anlatımlarda iki ayrı haberci, bazılarında tek haberci vardır ve mesaj yolda bozulur ya da çalınıp çarpıtılır.","Değişmeyen çekirdek: ölüm bir ceza değil, bir iletişim kazasıdır ve geri alınamaz."],"counter_evidence":["Afrika derlemelerinin büyük bölümü misyonerler aracılığıyla yapıldı; 'ölüm bir ceza' kalıbının yerel anlatılara sızma ihtimali her vakada ayrıca elenmeli - çoğu çalışmada bu yapılmıyor.","'Sahra altı Afrika' tek bir gelenek değildir; bu genelleme kaba bir taramadır."],"sources":[{"tier":"peer-reviewed","type":"book","authors":["Abrahamsson, Hans"],"year":1951,"title":"The Origin of Death: Studies in African Mythology","language":"en","note":"Motifin Afrika içi dağılımı üzerine temel çalışma."},{"tier":"institutional","type":"webpage","title":"Origin of death","container":"Wikipedia","url":"https://en.wikipedia.org/wiki/Origin_of_death","language":"en","accessed":"2026-09-07"}],"checked":"2026-09-07","used_in":["gec-kalan-haberci"]},{"id":"olum-kokeni-tip-dagilimi","claim":"Ölümün kökeni sorusu evrenseldir ama cevabın TİPİ bölgesel olarak kümelenir.","status":"established","confidence":"medium","topic":["mitoloji","olum-kokeni","motif-dagilimi","yontem"],"subject":{"site":"Afrika, Mezopotamya, Yakın Doğu, Japonya, Hindistan","region":"Afrika ve Avrasya","modern_country":"çok uluslu"},"period":{"earliest":-2100,"latest":800,"era_label":"Gılgamış'tan Kojiki'ye","precision":"range","dating_method":["textual"]},"languages":["Akadca","İbranice","Japonca","Sanskritçe"],"disciplines":["antropoloji","filoloji","tarih"],"popular_claim":"Bütün kültürlerde ölümün kökeni aynı şekilde anlatılır.","divergence":"Soru evrensel, cevabın tipi değil - ve tipler coğrafi olarak kümeleniyor. En az dört ayrı tip var: (1) yanlış teslim edilen haber, Sahra altı Afrika'da yoğun; (2) elde edilip kaybedilen nesne, Mezopotamya - Gılgamış gençlik otunu çıkarır, bir yılan çalar; (3) ihlal ve ceza, Yakın Doğu tek tanrılı gelenekler; (4) sayısal pazarlık, Japonya - İzanami her gün bin can alacağına yemin eder, İzanagi bin beş yüz doğum sözü verir. Hint geleneğinin ana damarı ise soruyu hiç sormaz: ölüm bir başlangıç değil, döngünün bir aşamasıdır.","divergence_type":["kategori-hatasi","medya-abartisi"],"evidence":["Dört tip birbirinden yapısal olarak farklıdır: kaza, kayıp, ceza ve pazarlık.","Hint geleneğinde soru 'ölüm neden var' değil 'döngüden nasıl çıkılır' hâline gelir - eksik bir cevap değil, farklı bir soru.","Bu dağılım 'hepsinde aynı hikâye var' iddiasını doğrudan yanlışlıyor."],"counter_evidence":["Tipler saf değildir; aynı bölgede birden fazla tip bulunabilir ve karma anlatımlar vardır.","Tip sınıflandırmasının kendisi analistin kurduğu bir birimdir; doğal bir kategori değil."],"sources":[{"tier":"primary","type":"edition","title":"Gılgamış Destanı, XI. tablet (gençlik otu ve yılan)","language":"akk"},{"tier":"primary","type":"edition","title":"Kojiki (İzanagi - İzanami, günlük ölüm ve doğum sayısı)","year":712,"language":"ja"},{"tier":"peer-reviewed","type":"book","authors":["Abrahamsson, Hans"],"year":1951,"title":"The Origin of Death: Studies in African Mythology","language":"en"}],"checked":"2026-09-07","used_in":["gec-kalan-haberci"]},{"id":"khoisan-arkaik-varyant","claim":"Yanlış-teslim motifinin en arkaik varyantı Khoisan bölgesinde köklenir ve bu, mit ağacı ile nüfus ağacının aynı noktayı gösterdiği bir vakadır.","status":"contested","confidence":"low","topic":["mitoloji","olum-kokeni","afrika","yontem"],"subject":{"site":"Khoisan bölgesi","region":"Güney Afrika","modern_country":"çok uluslu","coordinates":{"lat":-24,"lon":21}},"period":{"earliest":-50000,"latest":1960,"era_label":"İddia edilen köken derinliğinden derleme dönemine","precision":"disputed","dating_method":["none"]},"languages":["Khoisan dilleri"],"disciplines":["antropoloji","genetik","dilbilim"],"popular_claim":"Bilim, insanlığın en eski mitinin izini sürdü.","divergence":"Bulgu ilgi çekici: bölgesel analiz ve filogenetik araçlarla yapılan çalışma, motifin tek habercili en arkaik varyantının Khoisan bölgesinde köklendiğini gösteriyor - ve Khoisan halkları insan genetik çeşitliliğinin bilinen en derin dalını temsil eder. İki bağımsız disiplin aynı noktayı işaret ediyor. AMA tam da bu yüzden dikkatli olmak gerekiyor: araştırmacı BEKLENEN CEVABI ÖNCEDEN BİLİYOR. Khoisan'ın en derin dal olduğu genetikte yerleşik bilgi. Biyolojide filogenetik yöntemler tam bu yüzden cevabı bilinmeyen vakalarda sınanır. Sonucun aranan sonuçla örtüşmesi, doğrulama yanlılığının en klasik zeminidir.","divergence_type":["medya-abartisi","provenans-yoklugu"],"evidence":["Motifin Afrika içi dağılımı bölgesel analiz ve filogenetik araçlarla incelendi.","En arkaik varyant - mesajın tek haberciyle taşınıp yolda bozulduğu biçim - Khoisan bölgesinde köklenmiş görünüyor.","Khoisan halkları insan genetik çeşitliliğinin bilinen en derin dalını temsil eder."],"counter_evidence":["Araştırmacı beklenen cevabı önceden biliyordu - doğrulama yanlılığı riski yüksek.","Yöntem hâlâ kalibre edilmedi: mit filogenetiği cevabı bağımsız olarak bilinen vakalarda sınanmadı (bkz. mit-filogenetigi-kalibre-degil).","Misyoner aracılı derleme sorunu bu motif için özellikle ağır."],"open_questions":["Sonuç, araştırmacının beklentisinden bağımsız olarak üretilebilir mi? Kör bir yeniden analiz gerekiyor."],"sources":[{"tier":"peer-reviewed","type":"article","title":"En Afrique, pourquoi meurt-on ? Essai sur l'histoire d'un mythe africain","url":"https://ouci.dntb.gov.ua/en/works/4rJO6MX4/","language" der ama yılana kaptırır - 'iksirle dönüş' aşaması yoktur.","Düzenbaz anlatıları (Çakal, Anansi) bölüm bölümdür, bir yay çizmez; kahraman dönüşmez ve çoğu zaman kaybeder.","Kalıp DÜZ BİR ZAMAN ÇİZGİSİ varsayar; zamanı böyle örgütlemeyen gelenekler testten otomatik sıfır alır (bkz. yaratilis-sorusu-alet-yanliligi)."],"counter_evidence":["Anlatılarda gerçek düzenlilikler vardır; bu kayıt onların varlığını değil, monomitin evrensellik iddiasını reddeder.","'Neredeyse oybirliği' bir sayım değil, alan içi değerlendirmelere dayanan nitel bir ifadedir.","Kalıp bir SENARYO ARACI olarak fiilen çalışır; itiraz araca değil, aracın keşif diye sunulmasınadır."],"open_questions":["Kültürler arası gerçek anlatı düzenliliklerinin ölçeği nedir? Monomit bu soruyu cevaplamıyor, atlıyor."],"sources":[{"tier":"peer-reviewed","type":"book","authors":["Campbell, Joseph"],"year":1949,"title":"The Hero with a Thousand Faces","language":"en","note":"İncelenen tezin kendisi; kanıt olarak değil."},{"tier":"institutional","type":"webpage","title":"Why Folklorists Hate Joseph Campbell's Work","authors":["Jorgensen, Jeana"],"url":"https://www.patheos.com/blogs/foxyfolklorist/why-folklorists-hate-joseph-campbells-work/","language":"en","accessed":"2026-09-07","note":"Folklorcu perspektifinden itirazların özeti."},{"tier":"institutional","type":"webpage","title":"The \"hero's journey\" isn't as universal as you think","url":"https://bigthink.com/high-culture/monomyth-heros-journey-campbell/","language":"en","accessed":"2026-09-07"}],"checked":"2026-09-07","used_in":["kendi-kaniti"]},{"id":"monomit-geri-besleme-dongusu","claim":"Monomitin bugün 'her hikâyede' bulunmasının sebebi evrensellik değil, kalıbın senaryo şablonuna çevrilmiş olmasıdır; çıktı girdinin kanıtı sayılmaktadır.","status":"established","confidence":"medium","topic":["mitoloji","monomit","yontem","kanit-uretimi"],"subject":{"site":"Hollywood senaryo pratiği","region":"ABD ve küresel sinema","modern_country":"ABD"},"period":{"earliest os","role":"editor","year":-700}],"popular_claim":"Ülker'in tüm kültürlerde önemli olması, ortak bir kadim bilginin kanıtıdır.","divergence":"Sebep mitolojik değil, GÖK MEKANİĞİ. Ülker gökyüzündeki en dikkat çekici sıkışık yıldız kümesidir; tek yıldızlardan farklı olarak leke gibi görünür ve bir kez tanındıktan sonra kaçırılması zordur. Güneşten hemen önce doğuşu ve batışı HER YIL AYNI MEVSİME denk gelir. Küme ekvatora yakın olduğu için yerleşilebilir dünyanın neredeyse tamamından görülür. Yani ortada herkesin gördüğü, herkes için aynı anda çalışan ücretsiz bir mevsim saati var. Tarım yapan bir topluluğun bunu fark etmemesi, fark etmesinden daha şaşırtıcı olurdu. Aynı problem, aynı çözüm, aynı gökyüzü.","divergence_type":["kategori-hatasi"],"evidence":["Hesiodos doğuşunda hasat, batışında sürüm önerir; denizciliğin güvenli mevsimi de buna bağlanır.","And Dağları'nda haziranda kümenin parlaklığına bakılarak patates ekim tarihi belirlenir.","Maori geleneğinde kümenin yeniden görünmesi (Matariki) yılbaşıdır.","Japonca adı Subaru 'bir araya gelmek'ten gelir ve kümenin görünüşünü tarif eder.","Kullanım ezici çoğunlukla mevsim ve tarım zamanlamasıdır - ortak kökene değil ORTAK SORUNA işaret eder."],"counter_evidence":["Kullanım biçimlerindeki ayrıntılar (hangi eşik, hangi ürün, hangi tören) bölgesel olarak farklıdır ve bunların bir kısmı temasla yayılmış olabilir.","Anadolu geleneği bu kayıtta yüzeysel ele alınmıştır."],"open_questions":["Ülker'in Türk halk takvimindeki yeri ayrıntılı incelenmedi; yerel kaynak erişimi kolay olduğu için ayrı bir çalışmayı hak ediyor."],"sources":[{"tier":"primary","type":"edition","authors":["Hesiodos"],"title":"İşler ve Günler (Ülker'in doğuşu ve batışına göre tarım takvimi)","language":"grc"},{"tier":"institutional","type":"webpage","title":"Pleiades","container":"Wikipedia","url":"https://en.wikipedia.org/wiki/Pleiades","language":"en","accessed":"2026-09-07"}],"checked":"2026-09-07","used_in":["herkesin-saati"]},{"schema_version":2,"id l","modern_country":"çok uluslu"},"period":{"earliest":-100000,"latest":2021,"era_label":"İddia edilen köken derinliğinden önerinin yayımına","precision":"disputed","dating_method":["astronomical","none"]},"disciplines":["astronomi","antropoloji","dilbilim"],"people":[{"name":"Norris, Ray P.","role":"proposer","affiliation":"Western Sydney University / CSIRO","year":2021},{"name":"Norris, Barnaby R. M.","role":"proposer","affiliation":"University of Sydney","year":2021}],"popular_claim":"Bilim, insanlığın en eski hikâyesinin yüz bin yıllık olduğunu gösterdi.","divergence":"Öneri serinin ölçütünü iyi karşılıyor: ayrıntı KEYFÎ (çıplak gözle çoğu insan altı yıldız seçer ama anlatı yedi der), dağılım geniş, ve açıklama fiziksel olarak sınanabilir bir şeye dayanıyor - Pleione ve Atlas zaman içinde birbirine yaklaştı, çok uzun zaman önce ayrı ayrı seçilebiliyor olmalıydı. AMA desteklenmiş değil. NOT: bu öneriye yöneltilmiş yayımlanmış reddiyelere araştırmamızda RASTLANMADI; bu, önerinin kabul gördüğü anlamına gelmez, yalnızca bakabildiğimiz yerde tartışmanın izine rastlamadığımız anlamına gelir ve bir sınırlılık olarak kaydedilir.","divergence_type":["medya-abartisi","provenans-yoklugu"],"evidence":["Çıplak gözle çoğu insan altı yıldız seçer ama pek çok gelenek kümeyi yedi olarak sayar - ayrıntı gökyüzü tarafından dayatılmıyor.","Pek çok gelenekte anlatı 'yedi kız kardeş' biçimindedir ve sık sık birinin kayıp ya da saklanmış olduğu ayrıntısını taşır.","Pleione ve Atlas'ın öz hareketi hesaplanabilir; geçmişte açısal ayrımları daha genişti."],"counter_evidence":["Yüz bin yıllık anlatı kararlılığı için bir MEKANİZMA sunulmuyor; bu, alanın denediği en uzun zaman ölçeğidir ve mit filogenetiği henüz kalibre edilmedi (bkz. mit-filogenetigi-kalibre-degil).","'Yedi' bağımsız olarak yüklü bir sayıdır: gezegen sayısı, hafta günü, tekrarlayan anlatı kalıpları. Bir gelenek yedi sayıyorsa sebep gökyüzü değil sayının kendisi olabilir.","Görülen yıldız sayısı sabit değildir; göz keskinliğine, gökyüzü karanlığına ve havaya göre değişir - bazı insanlar gerçekten yedi ve daha fazlasını seçer.","'Çoğu kültür yedi diyor' ifadesi sayılmamıştır; hangi gelenekler, hangi derlemelerden ve sömürge dönemi teması elenerek mi - bunlar gösterilmemiştir.","Öneri astronomlardan gelmektedir, folklorculardan değil."],"open_questions":["Kaç gelenek gerçekten 'yedi' diyor? Sayılmadı.","Yayımlanmış reddiye var mı? Aramamızda bulunamadı - bu bir onay değildir."],"sources":[{"tier":"peer-reviewed","type":"article","authors":["Norris, Ray P.","Norris, Barnaby R. M."],"year":2021,"title":"Why are there Seven Sisters?","url":"https://arxiv.org/abs/2101.09170","language":"en","accessed":"2026-09-07","note":"İncelenen öneri; kanıt olarak değil, değerlendirilen tez olarak kaydedildi."},{"tier":"institutional","type":"webpage","title":"Pleiades","container":"Wikipedia","url":"https://en.wikipedia.org/wiki/Pleiades","language":"en","accessed":"2026-09-07"}],"checked":"2026-09-07","volatile":true,"used_in":["herkesin-saati"]},{"id":"zorunlu-keyfi-ekseni","claim":"Bir mitolojik benzerliğin bilgi değeri, yaygınlığıyla değil, ayrıntının ne kadar keyfî olduğuyla belirlenir.","status":"established","confidence":"high","topic":["mitoloji","yontem","karsilastirmali-mitoloji"],"subject":{"site":"Karşılaştırmalı mitoloji yöntemi","region":"kuramsal","modern_country":"çok uluslu"},"period":{"earliest":1850,"latest":2026,"era_label":"Karşılaştırmalı mitolojinin kuruluşundan bugüne","precision":"range","dating_method":["historical-record"]},"disciplines":["antropoloji","felsefe","astronomi"],"popular_claim":"Bir motif ne kadar çok kültürde varsa, ortak köken kanıtı o kadar güçlüdür.","divergence":"Sezgi ters çalışıyor. Doğanın dayattığı benzerlikler YAYGIN oldukları için etkileyici görünür ama hiçbir şey söylemez: fırtına ve yılan her yerde vardır, ateş her yerde alınarak elde edilir, Ülker her yerde aynı mevsimde doğar. Seçilmiş ayrıntılardaki benzerlikler ise NADİR ve DAĞINIK oldukları için 7-persepolis-admin-archives","locator":"Yapı programı","support_type":"inference"}]}],"counter_evidence":[{"id":"sitede-idari-faaliyet","text":"Kale Tabletleri sitede ciddi bir idari faaliyet de olduğunu gösteriyor; 'yalnızca tören' ayrımı fazla keskin olabilir.","citations":[{"source_ref":"hallock-1969-oip92-fortification-tablets","locator":"Arşivin sitede üretilmiş olması","support_type":"counter"}]},{"id":"kabartma-yorumu-cikarim","text":"Apadana kabartmalarının 'törensel' okuması bir ÇIKARIMDIR: kabartma sahnesinin gerçek bir töreni mi yoksa ideal bir düzeni mi gösterdiği ayrı bir tartışmadır.","citations":[{"source_ref":"iranica-2017-persepolis-admin-archives","locator":"İkonografi yorumu","support_type":"context"}]}],"open_questions":["Törensel işlevin takvimdeki yeri - Nevruz bağlantısı sık öne sürülür ama doğrudan kanıtı tartışmalıdır.","'Tören başkenti' ile 'idari merkez' ayrımı, arşivin varlığı karşısında nasıl korunuyor?"],"checked":"2026-09-09","used_in":["persepolis"],"review":{"status":"draft","notes":"Kabartma yorumunun çıkarım olduğu açıkça işaretlendi; önceki sürümde doğrudan kanıt gibi duruyordu."}},{"id":"roma-buz-karotu-ekonomi","claim":"Roma ekonomisinin yükseliş ve krizleri Grönland buz karotlarındaki kurşun kirliliğinde yıllık çözünürlükte okunabilir.","status":"established","confidence":"high","topic":["roma","ekonomi-tarihi","buz-karotu","yontem"],"subject":{"site":"Kuzey Grönland buz karotu","region":"Arktik / Akdeniz havzası","modern_country":"Grönland (Danimarka)","coordinates":{"lat":75.1,"lon":-42.32}},"period":{"earliest":-1100,"latest":800,"era_label":"Geç Demir Çağı'ndan erken Ortaçağ'a","precision":"range","dating_method":["isotopic","stratigraphy","historical-record"]},"disciplines":["iklim-bilimi","tarih","jeoloji"],"people":[{"name":"McConnell, Joseph R.","role":"analyst","affiliation":"Desert Research Institute","year":2018}],"popular_claim":"Antik ekonomiler hakkında bilgimiz yalnızca yazılı kaynaklara dayanır.","divergence":"Kurşun kaydı tarihsel metinlerden BAĞIMSIZ bir ekonomik göstergedir. Tarihçilerin anlatısına, vergi kayıtlarına veya bir yazarın abartısına dayanmaz - fiziksel bir kayıttır ve tarihçilerin anlattığı krizlerle örtüşür.","divergence_type":["guncellenmemis"],"evidence":["423 metrelik buz karotu yıllık katman sayımıyla tarihlendi; kayıt MÖ 1100'den MS 800'e uzanıyor.","Kurşun, gümüş üretimi için yapılan kurşun cevheri izabesinden atmosfere salınıyor.","Kirlilik refah dönemlerinde yükseliyor - Fenike yayılması, sonra Roma; zirve imparatorluk döneminde.","Savaşlar ve büyük salgınlar eğride düşüş olarak görünüyor."],"counter_evidence":["Gösterge kısmidir: gümüş üretimiyle ilişkisi güçlü ama tarım, tekstil ve hizmetler bu kayıtta görünmez.","Kurşun taşınımı atmosferik koşullara bağlıdır; kaynak bölge ayrıştırması dolaylıdır."],"sources":[{"tier":"peer-reviewed","type":"article","authors":["McConnell, Joseph R."],"year":2018,"title":"Lead pollution recorded in Greenland ice indicates European emissions tracked plagues, wars, and imperial expansion during antiquity","container":"PNAS","doi":"10.1073/pnas.1721818115","url":"https://www.pnas.org/doi/10.1073/pnas.1721818115","language":"en","accessed":"2026-09-06"}],"checked":"2026-09-06","used_in":["roma-etki"]},{"id":"roma-kursun-kita-olcegi-zehirlenme","claim":"Roma dönemi madencilik ve izabesi Avrupa çapında atmosferik kurşun kirliliğine ve yükselmiş kan kurşun düzeylerine yol açtı.","status":"contested","confidence":"medium","topic":["roma","kirlilik","saglik-tarihi"],"subject":{"region":"Avrupa / Akdeniz havzası","modern_country":"Avrupa geneli"},"period":{"earliest":-100,"latest":200,"era_label":"Roma İmparatorluğu doruğu","precision":"range","dating_method":["isotopic","stratigraphy"]},"disciplines":["iklim-bilimi","tarih","antropoloji"],"popular_claim":"Roma'nın mirası yollar, hukuk ve mühendisliktir.","divergence":"Aynı buz karotu hem Roma'nın ekonomik zirvesini hem de bıraktığı kıta ölçekli kurşun kirliliğini kaydediyor. Bir ekonominin başarı göstergesi ile biraktigi hasar cogu zaman ayni egridir.","divergence_type":["guncellenmemis"],"evidence":["Buz karotu ölçümleri Roma döneminde Avrupa çapında yükselmiş atmosferik kurşun gösteriyor.","Kurşun bir nörotoksindir; yeterli düzeyde özellikle çocuklarda bilişsel etkiye yol açar."],"counter_evidence":["Bilişsel etkinin büyüklüğü MODELLENMIŞ bir tahmindir, doğrudan ölçüm değil - ve tartışmalıdır.","Roma dönemi kurşun düzeyleri modern sanayi çağının çok altındadır; bulgunun anlamı 'antik dünya bugünden kirliydi' değil.","Kan kurşun düzeyi tahminleri atmosferik veriden türetilir; iskelet ölçümleriyle bölgesel doğrulama sınırlıdır."],"sources":[{"tier":"peer-reviewed","type":"article","title":"Pan-European atmospheric lead pollution, enhanced blood lead levels, and cognitive decline from Roman-era mining and smelting","container":"PNAS","doi":"10.1073/pnas.2419630121","url":"https://www.pnas.org/doi/10.1073/pnas.2419630121","language":"en","accessed":"2026-09-06"}],"open_questions":["Bilişsel etkinin büyüklüğü nasıl doğrulanabilir?"],"checked":"2026-09-06","volatile":true,"used_in":["roma-etki"]},{"id":"roma-yollari-modern-refah","claim":"MS 117'deki Roma yol yoğunluğu, günümüz yol yoğunluğunu ve 2010-2020 ekonomik etkinliğini öngörür - ama yalnızca yolların kullanılmaya devam ettiği bölgelerde.","status":"established","confidence":"high","topic":["roma","altyapi","yol-agi","kalicilik"],"subject":{"region":"Roma İmparatorluğu toprakları (MS 117)","modern_country":"Avrupa, Kuzey Afrika, Yakındoğu"},"period":{"earliest":117,"latest":2020,"era_label":"Roma doruğundan bugüne","precision":"range","dating_method":["historical-record"]},"disciplines":["tarih","muhendislik","arkeoloji"],"people":[{"name":"Dalgaard, Carl-Johan","role":"analyst","affiliation":"University of Copenhagen","year":2022},{"name":"Olsson, Ola","role":"analyst","affiliation":"University of Gothenburg","year":2022},{"name":"Selaya, Pablo","role":"analyst","affiliation":"University of Copenhagen","year":2022}],"popular_claim":"Roma yolları etkileyici mühendislik eserleriydi.","divergence":"Asıl bulgu mühendislikte değil KALICILIKTA - ve kalıcılığın koşullu olmasında. Çalışmanın içinde bir DOĞAL DENEY var: tekerlekli araç kullanımının birinci binyıldan modern döneme kadar bırakıldığı bölgelerde (taşımacılık deve kervanlarına geçti) yollar bakılmadı ve kalıcılık etkisi anlamsızlığa kadar zayıflıyor. Aynı imparatorluk, aynı güzergâh seçimi, farklı sonuç.","divergence_type":["guncellenmemis"],"evidence":["Yüksek Roma yol yoğunluğu, yüksek modern yol yoğunluğu ve 2010-2020'de daha fazla ekonomik etkinlikle örtüşüyor.","500 CE'de daha fazla yerleşim oluşumu ile de örtüşüyor.","Erken ortaçağ ve modern dönemde pazar kasabalarının ortaya çıkışı, etkiyi sürdüren mekanizma olarak belirlendi.","KONTROL GRUBU: tekerleğin bırakıldığı bölgelerde kalıcılık kayboluyor - etkiyi taşıyan şey Romalıların yer seçimi değil, sonraki kuşakların bakımı."],"counter_evidence":["Tekerleğin bırakılması rastgele bir olay değil; o bölgelerin başka farkları da olabilir."],"sources":[{"tier":"peer-reviewed","type":"article","authors":["Dalgaard, Carl-Johan","Kaarsen, Nicolai","Olsson, Ola","Selaya, Pablo"],"year":2022,"title":"Roman roads to prosperity: Persistence and non-persistence of public infrastructure","container":"Journal of Comparative Economics","url":"https://www.sciencedirect.com/science/article/abs/pii/S0147596722000269","language":"en","accessed":"2026-09-06"}],"checked":"2026-09-06","used_in":["roma-etki"]},{"id":"roma-hukuk-kesintili-zincir","claim":"Roma hukuku Batı'ya kesintisiz aktarılmadı; beş yüzyıl kullanım dışı kaldıktan sonra 11. yüzyılda yeniden bulunup öğretilmeye başlandı.","status":"established","confidence":"high","topic":["roma","hukuk-tarihi","aktarim"],"subject":{"site":"Bologna hukuk okulu","region":"İtalya / Avrupa","modern_country":"İtalya","coordinates":{"lat":44.4949,"lon":11.3426}},"period":{"earliest":529,"latest":1926,"era_label":"Corpus Juris Civilis'ten modern medeni kanunlara","precision":"range","dating_method":["historical-record","textual"]},"languages":["Latince"],"disciplines":["hukuk","tarih","filoloji"],"popular_claim":"Roma hukuku Roma'dan bugüne kesintisiz aktarıldı.","divergence":"Zincirin ortasında beş yüz yıllık bir boşluk var. Metin Batı'da fiilen işlemedi; bir kopyası ayakta kaldığı ve 11. yüzyılda birileri onu yeniden OKUMAYA, ÖĞRETMEYE ve UYGULAMAYA karar verdiği için geri döndü. Miras düz bir çizgiyle gelmedi - kaybolup yeniden seçildi.","divergence_type":["guncellenmemis"],"evidence":["Corpus Juris Civilis 529-534'te Justinianus döneminde derlendi.","6.-11. yüzyıllarda Batı'da büyük ölçüde kullanım dışı kaldı.","~1070'lerde İtalya'da Digesta nüshası yeniden bulundu ve incelenmeye başlandı.","1088'de Bologna'da hukuk öğretimi kurumsallaştı.","Fransız (1804) ve Alman (1900) medeni kanunları bu gelenekten kodlandı; Türk Medeni Kanunu (1926) İsviçre Medeni Kanunu esas alınarak kabul edildi."],"counter_evidence":["Bologna sonrası yüzyıllar metni yalnızca aktarmadı, yeniden yorumladı; bugünkü medeni hukuk Roma hukuku değil, ondan TÜRETİLMİŞ bir yapıdır."],"sources":[{"tier":"peer-reviewed","type":"book","title":"Roma hukukunun aktarımı ve ius commune literatürü","language":"en"}],"checked":"2026-09-06","used_in":["roma-etki"]},{"id":"roma-bati-maddi-gerileme","claim":"Batı Roma topraklarında 5.-7. yüzyıllarda ölçülebilir bir maddi gerileme yaşandı.","status":"established","confidence":"high","topic":["roma","gec-antikcag","maddi-kultur"],"subject":{"region":"Batı Roma toprakları, özellikle Britanya","modern_country":"Batı Avrupa"},"period":{"earliest":400,"latest":700,"era_label":"Geç Antikçağ","precision":"range","dating_method":["stratigraphy","typology","radiocarbon"]},"disciplines":["arkeoloji","tarih"],"popular_claim":"Roma'nın sonunda çöküş değil dönüşüm yaşandı; 'karanlık çağ' diye bir şey yoktu.","divergence":"Bu yaklaşim bazi yonlerden duzelticidir ama maddi gostergeler Bati'da gercek bir dususu gosterir. Gostergeler metinlere degil NESNELERE dayanir: sayilan comlek parcasi, olculen kemik, tarihlenen batik.","divergence_type":["guncellenmemis"],"evidence":["Akdeniz batık gemi sayısı MÖ 1. - MS 1. yüzyıl zirvesinden sonra belirgin düşüyor - ticaret hacminin daralması.","Standart çarkta üretilmiş kaliteli sofra çömleği ortadan kalkıyor; yer yer çarksız el yapımına dönülüyor.","Çatı kiremidi bazı bölgelerde tamamen kayboluyor.","Sığır kemiklerinde boyut küçülmesi.","Kurşun kirliliğinin Roma düzeyine dönüşü yüzyıllar sürüyor."],"counter_evidence":["Düşüş her yerde aynı değil - Britanya'da sert, İtalya ve Akdeniz'de daha ılımlı. Tek bir 'Batı' eğrisi yanıltıcı olur.","Bu bulgu, sonraki bin yılın 'karanlık' sayılıp sayılamayacağı sorusundan AYRI bir sorudur; ikisi karıştırılmamalıdır."],"sources":[{"tier":"peer-reviewed","type":"book","title":"Geç Antikçağ maddi kültür ve ekonomi arkeolojisi literatürü","language":"en"}],"open_questions":["Bölgesel farklar nasıl ölçülür - tek bir Batı eğrisi çizilebilir mi?"],"checked":"2026-09-06","used_in":["roma-etki"]},{"id":"roma-476-uzlasimdir","claim":"Roma İmparatorluğu 476'da yıkıldı.","status":"refuted","confidence":"high","topic":["roma","donem-bolumleme","tarih-yazimi"],"subject":{"region":"Batı ve Doğu Roma","modern_country":"İtalya / Türkiye"},"period":{"earliest":476,"latest":1453,"era_label":"Batı'da imparatorluğun sonundan Konstantinopolis'in düşüşüne","precision":"exact","dating_method":["historical-record"]},"disciplines":["tarih"],"popular_claim":"Roma 476'da yıkıldı ve uygarlık çöktü.","divergence":"476'da Batı'daki son imparator tahttan indirildi - gerçek bir olay ama dönemin insanları için 'bir uygarlığın sonu' değil. Doğu Roma İmparatorluğu 1453'e kadar yaşadı; kendilerine Romalı diyorlardı ve hukukları Roma hukukuydu. 476 kesiği Batı Avrupa'dan bakan bir bölümlemedir - kullanışlı ama nötr değil.","divergence_type":["kategori-hatasi","ideolojik-secim"],"counter_evidence":["Doğu Roma bin yıl daha sürdü.","Batı'da imparatorluk zaten uzun süredir parçalanıyordu; 476 tek bir kırılma noktası değil.","Hangi bölgeyi merkeze aldığınıza göre 'son' başka bir tarihe düşer."],"sources":[{"tier":"peer-reviewed","type":"book","title":"Geç Roma ve Bizans tarih yazımı literatürü","language":"en"}],"checked":"2026-09-06","used_in":["roma-etki"]},{"id":"hristiyanlik-313-380-ayrimi","claim":"313 Milano fermanı Hristiyanlığı serbest bıraktı; devlet dini yapan 380 Selanik fermanıdır. Arada 67 yıl vardır.","status":"established","confidence":"high","topic":["roma","hristiyanlik","hukuk","kronoloji"],"subject":{"site":"Roma İmparatorluğu","region":"Akdeniz havzası","modern_country":"çok uluslu"},"period":{"earliest":313,"latest":392,"era_label":"Geç Roma İmparatorluğu","precision":"exact","dating_method":["textual","historical-record"]},"languages":["Latince"],"disciplines":["tarih","hukuk"],"people":[{"name":"Constantinus I","role":"proposer","year":313,"lifespan":"y. 272-337"},{"name":"Licinius","role":"proposer","year":313},{"name":"Theodosius I","role":"proposer","year":380,"lifespan":"347-395"}],"popular_claim":"Constantinus 313'te Hristiyanlığı Roma'nın devlet dini yaptı.","divergence":"313 tüm dinlere serbestlik tanıyan bir HOŞGÖRÜ metnidir; Hristiyanlığa ayrıcalık değil, yasağın kaldırılmasıdır. Devlet dini ilanı 380'de I. Theodosius döneminde gelir - 67 yıl sonra ve farklı bir imparatorla. Pagan kurbanının yasaklanması 391-392'yi bulur. Popüler anlatı üç ayrı olayı tek bir karara indirger.","divergence_type":["guncellenmemis","kategori-hatasi"],"evidence":["313 metninin içeriği Lactantius'un De mortibus persecutorum 48. bölümünde aktarılır ve 'Hristiyanlara ve herkese' dinini seçme serbestliği tanır.","Codex Theodosianus XVI.1.2 (Cunctos populos, 380) İznik inancını imparatorluğun resmî dini ilan eder.","391-392 tarihli yasalar pagan kurbanını ve tapınak ziyaretini yasaklar - hoşgürüden zorunluluğa geçişin son adımı.","Constantinus 337'de, saltanatının sonunda ölüm döşeğinde vaftiz edildi; vaftizi yapan Nikomedialı Eusebios, İznik'te mahkûm edilen Arius'un görüşüne yakın bir piskopostu."],"counter_evidence":["313'ten sonra kiliseye tanınan vergi muafiyetleri ve bağışlar hukuken 'devlet dini' olmasa da fiilî bir imtiyaz yaratmıştır; ayrımın keskinliği idari uygulamada bulanıklaşır.","'Milano fermanı' adlandırması tartışmalıdır: metin bir edictum değil, valilere gönderilen bir talimat mektubudur ve Galerius'un 311 hoşgörü fermanının devamı sayılabilir."],"open_questions":["Constantinus'un kişisel inancı samimi bir dönüşüm müydü, siyasi bir hesap mıydı? Niyet sorusu ölçülemez."],"sources":[{"tier":"primary","type":"edition","authors":["Lactantius"],"title":"De mortibus persecutorum, 48","language":"la","note":"313 metninin içeriğini aktaran çağdaş kaynak."},{"tier":"primary","type":"edition","title":"Codex Theodosianus XVI.1.2 (Cunctos populos)","year":380,"language":"la","note":"Devlet dini ilanının hukuk metni."},{"tier":"peer-reviewed","type":"book","authors":["Jones, A. H. M."],"year":1964,"title":"The Later Roman Empire 284-602: A Social, Economic and Administrative Survey","publisher":"Basil Blackwell","language":"en","note":"Dönemin idari ve hukuki çerçevesi için standart başvuru eseri."}],"checked":"2026-09-07","used_in":["roma-hristiyanlik"]},{"id":"iznik-kanonu-belirlemedi","claim":"325 İznik Konsili'nde Kutsal Kitap kanonunun tartışıldığına dair hiçbir kayıt yoktur.","status":"established","confidence":"high","topic":["hristiyanlik","kanon","konsil","yontem"],"subject":{"site":"İznik (Nicaea)","site_native":"Νίκαια","region":"Bitinya","modern_country":"Türkiye","coordinates":{"lat":40.4297,"lon":29.7208}},"period":{"earliest":325,"latest":325,"era_label":"Geç Roma İmparatorluğu","precision":"exact","dating_method":["textual","historical-record"]},"languages":["Yunanca","Latince"],"disciplines":["tarih","metin-elestirisi"],"people":[{"name":"Eusebios (Kaisareia)","role":"editor","year":325,"lifespan":"y. 260-339"},{"name":"Athanasios (İskenderiye)","role":"editor","year":367,"lifespan":"y. 296-373"},{"name":"Metzger, Bruce M.","role":"analyst","year":1987,"lifespan":"1914-2007"}],"popular_claim":"İznik Konsili'nde hangi İncillerin kutsal kitaba gireceği oylandı, dışarıda kalanlar yakıldı.","divergence":"Konsilin belgelenmiş gündemi: Arius tartışması, İznik inanç bildirgesi, Paskalya'nın tarihi ve yaklaşık yirmi idari kanon. Kanon - yani hangi kitapların Kutsal Kitap'a gireceği - bu gündemde yoktur. Konsile katılan ve ayrıntılı yazan görgü tanıkları (Eusebios, Athanasios) böyle bir karardan hiç söz etmez.","divergence_type":["medya-abartisi","kategori-hatasi"],"evidence":["Konsilden çıkan yirmi kanon metni elimizdedir ve tamamı kilise yönetimine ilişkindir - kutsal metin listesi içermez.","Konsilde bulunan Eusebios, İznik'i ayrıntılı anlatır ve kanon kararından bahsetmez.","Tartışmanın konusu İsa'nın ilahiliği DEĞİL, ilahiliğinin Baba ile ilişkisiydi: taraflardan hiçbiri İsa'nın ilahi olmadığını savunmuyordu.","Konsilden 42 yıl SONRA yazan Athanasios'un 367 tarihli mektubu, elimizdeki ilk 27 kitaplık listedir - İznik'te bir liste kabul edilmiş olsaydı bu gereksiz olurdu."],"counter_evidence":["Sessizlikten çıkarım genelde zayıf bir kanıt biçimidir; burada gücü, sessiz kalan kişilerin tam da o toplantıda bulunup ayrıntılı yazmış olmasından gelir."],"sources":[{"tier":"peer-reviewed","type":"book","authors":["Metzger, Bruce M."],"year":1987,"title":"The Canon of the New Testament: Its Origin, Development, and Significance","publisher":"Oxford University Press","language":"en","note":"Kanon oluşumunun standart başvuru eseri; İznik'in kanonla ilgisi olmadığını açıkça belirtir."},{"tier":"primary","type":"edition","title":"İznik Konsili kanonları (325)","year":325,"language":"grc","note":"Yirmi kanonun tamamı idari; kutsal metin listesi yoktur."}],"checked":"2026-09-07","used_in":["roma-hristiyanlik"]},{"id":"kanon-367-athanasios-listesi","claim":"Bugünkü 27 kitaplık Yeni Ahit listesinin bilinen ilk tam hâli, Athanasios'un 367 tarihli Paskalya mektubudur.","status":"established","confidence":"high","topic":["hristiyanlik","kanon","metin-tarihi"],"subject":{"site":"İskenderiye","region":"Mısır","modern_country":"Mısır","coordinates":{"lat":31.2001,"lon":29.9187}},"period":{"earliest":367,"latest":397,"era_label":"Geç Roma İmparatorluğu","precision":"exact","dating_method":["textual","paleography"]},"languages":["Yunanca","Latince"],"disciplines":["metin-elestirisi","tarih","filoloji"],"people":[{"name":"Athanasios (İskenderiye)","role":"editor","year":367,"lifespan":"y. 296-373"},{"name":"Metzger, Bruce M.","role":"analyst","year":1987}],"popular_claim":"Kanon bir konsilde tepeden ilan edildi; dışarıda kalan metinler imha edildi.","divergence":"Kanon bir kararla kurulmadı, kullanımla oluştu: hangi metinlerin okunmaya, kopyalanmaya ve öğretilmeye devam ettiğiyle. Athanasios'un kendisi yeni bir kanon KURDUĞUNU düşünmüyordu - zaten geniş kabul gören kitapları onaylıyordu. Sonraki bölgesel konsiller bu listeyi teyit etti. Sıra: kullanım -> uzlaşı -> onay. Dışarıda kalanlar yakılarak değil, ÇOĞALTILMAYARAK kayboldu - İskenderiye Kütüphanesi'ndeki mekanizmanın aynısı.","divergence_type":["medya-abartisi","hayatta-kalma-yanliligi"],"evidence":["367 tarihli 39. Paskalya mektubu, bugünkü 27 kitabı tam olarak listeleyen bilinen ilk belgedir.","Mektubun dili onaylayıcıdır, kurucu değil: geniş kabul gören kitapları teyit eder.","4. yüzyıl sonundaki Kuzey Afrika bölgesel konsilleri aynı listeyi teyit etti - yani liste konsilden önce vardı.","Kanon dışı metinlerin bir kısmı elimizdedir (Nag Hammadi buluntuları, 1945); sistematik bir imha kampanyasının arkeolojik veya metinsel kanıtı yoktur."],"counter_evidence":["Bazı kitapların (İbraniler, Vahiy, Yakup) kabulü bölgeden bölgeye uzun süre farklılık gösterdi; 367 tarihi bir 'kapanış' değil, bir uzlaşının ilk yazılı kaydıdır.","Süryani ve Etiyopya kiliseleri farklı kanonlar kullanmaya devam etti; tek bir evrensel liste hiçbir zaman olmadı."],"open_questions":["Kanon dışında kalan metinlerin ne kadarı kayıp? Kopyalanma oranına dayalı tahminler var ama ölçülemiyor."],"sources":[{"tier":"primary","type":"edition","authors":["Athanasios"],"year":367,"title":"39. Paskalya Mektubu (Festal Letter 39)","language":"grc","note":"27 kitaplık listenin bilinen ilk tam hâli."},{"tier":"peer-reviewed","type":"book","authors":["Metzger, Bruce M."],"year":1987,"title":"The Canon of the New Testament: Its Origin, Development, and Significance","publisher":"Oxford University Press","language":"en"}],"checked":"2026-09-07","used_in":["roma-hristiyanlik"]},{"id":"hristiyan-buyume-orani-modeli","claim":"Hristiyanlığın 300'e kadarki yayılışı, on yılda %40'lık sıradan bir büyüme oranıyla açıklanabilir - olağandışı bir varsayım gerekmez.","status":"contested","confidence":"medium","topic":["hristiyanlik","demografi","yontem"],"subject":{"site":"Roma İmparatorluğu","region":"Akdeniz havzası","modern_country":"çok uluslu"},"period":{"earliest":40,"latest":350,"era_label":"Erken Roma İmparatorluğu'ndan geç antikçağa","precision":"range","dating_method":["historical-record"]},"disciplines":["sosyoloji","demografi","tarih"],"people":[{"name":"Stark, Rodney","role":"proposer","affiliation":"University of Washington","year":1996,"lifespan":"1934-2022"}],"popular_claim":"Hristiyanlık Constantinus sayesinde yayıldı; imparator olmasaydı marjinal bir mezhep kalırdı.","divergence":"Model, MS 40'ta ~1.000 kişiden başlayıp on yılda %40 büyümeyle 300 yılında ~6 milyona ulaşıldığını gösterir - modern dinî hareketlerde gözlenen, olağanüstü olmayan bir hız. Sonuç şu: Constantinus sahneye çıktığında Hristiyanlık zaten imparatorluk nüfusunun kayda değer bir bölümüydü. İmparator bir azınlığı çoğunluk yapmadı; büyümekte olan bir kitleyle ittifak kurdu. Nedensellik oku popüler anlatının gösterdiği yönde değil.","divergence_type":["guncellenmemis"],"evidence":["Bileşik büyüme aritmetiği: %40/on yıl, 260 yılda 1.000'i yaklaşık 6 milyona çıkarır.","Kullanılan oran, modern dinî hareketlerde belgelenmiş büyüme hızlarıyla aynı mertebededir - uydurulmuş bir sayı değildir.","Salgın dönemlerinde Hristiyan cemaatlerinin şehirde kalıp hastalara bakması, temel bakım yoluyla hayatta kalma oranını yükseltmiş olabilir.","Cemaatlerde kadın oranının yüksekliği, pagan erkeklerle evlilikler yoluyla yeni hanelere giriş ve daha yüksek doğurganlık üretmiş olabilir."],"counter_evidence":["Bu bir İMKÂN KANITIDIR, ölçüm değil: başlangıç sayısı, büyüme oranı ve 300 yılındaki toplam - üçü de tahmindir. Model 'böyle oldu' demez, 'olağandışı bir şey varsaymadan da bu sayıya ulaşılır' der.","Sabit oran varsayımı gerçekçi değildir; büyüme bölgeden bölgeye ve dönemden döneme değişmiş olmalıdır.","Salgın bakımı ve kadın demografisi açıklamaları aritmetikten çok daha zayıf desteklidir ve kaynakların önemli kısmı Hristiyan yazarların kendi anlatılarından gelir - taraf olan kaynak.","Tarihçiler arasında 300 yılı için verilen toplam nüfus tahminleri geniş bir aralıkta değişir; 6 milyon üst uçlardan biridir."],"open_questions":["Salgın döneminde bakımın hayatta kalma oranına etkisi niceliksel olarak ölçülebilir mi? Şu an ölçülemiyor.","Cemaatlerdeki kadın oranı ne kadar yüksekti? Sayısal veri yok, çıkarım metinsel."],"sources":[{"tier":"peer-reviewed","type":"book","authors":["Stark, Rodney"],"year":1996,"title":"The Rise of Christianity: A Sociologist Reconsiders History","publisher":"Princeton University Press","language":"en","note":"Akademik yayınevi monografisi. Modelin kendisi tartışmalıdır; tarihçilerden sabit oran varsayımına ve nüfus tahminlerine yönelik eleştiriler almıştır."},{"tier":"peer-reviewed","type":"book","authors":["Jones, A. H. M."],"year":1964,"title":"The Later Roman Empire 284-602","publisher":"Basil Blackwell","language":"en","note":"Geç Roma nüfus tahminleri için karşılaştırma çerçevesi."}],"checked":"2026-09-07","volatile":false,"used_in":["roma-hristiyanlik"]},{"id":"hristiyan-zulmu-olcegi","claim":"Hristiyanlara yönelik zulüm gerçekti ama üç yüz yıl boyunca kesintisiz ve imparatorluk çapında değildi; dönemsel, bölgesel ve çoğunlukla kısa süreliydi.","status":"contested","confidence":"medium","topic":["hristiyanlik","roma","yontem"],"subject":{"site":"Roma İmparatorluğu","region":"Akdeniz havzası","modern_country":"çok uluslu"},"period":{"earliest":64,"latest":313,"era_label":"Roma İmparatorluğu","precision":"range","dating_method":["textual","historical-record"]},"languages":["Latince","Yunanca"],"disciplines":["tarih","metin-elestirisi"],"people":[{"name":"de Ste. Croix, G. E. M.","role":"analyst","affiliation":"University of Oxford","year":1963,"lifespan":"1910-2000"},{"name":"Moss, Candida","role":"critic","affiliation":"University of Birmingham","year":2013}],"popular_claim":"Hristiyanlar üç yüz yıl boyunca aralıksız kitlesel katliama uğradı; sayısız şehit verildi.","divergence":"Sistematik ve imparatorluk çapında zulüm, 3. yüzyıl ortası ve başındaki iki büyük dalgada yoğunlaşır. Geri kalan zaman büyük ölçüde yerel yargıçların takdirine bağlı, düzensiz uygulamalardan oluşur. Bu bir küçümseme değil, ÖLÇEK DÜZELTMESİDİR - ve şu açıdan önemlidir: Roma Hristiyanlığı bir yönetim aracı olarak kendisi uydurmuş olsaydı, kendi uydurduğu inancın mensuplarını dönem dönem idam etmesi açıklanması güç bir davranış olurdu.","divergence_type":["medya-abartisi","ideolojik-secim"],"evidence":["Kesintisiz zulüm varsayımıyla çelişen kanıt: 3. yüzyılda birçok şehirde açıkça bilinen kilise binaları ve mülkleri vardı; 313'te bunların İADESİ emredilmesi, önceden var olduklarını gösterir.","Zulüm yasalarının uygulaması eyaletten eyalete büyük farklılık gösterir; merkezî emir olmadan yerel yargıç takdiri belirleyicidir.","Şehitlik anlatılarının önemli bir kısmı olaylardan çok sonra yazılmış edebî derlemelerdir ve tarihsel değerleri tartışmalıdır."],"counter_evidence":["Ölçek düzeltmesi, zulmün gerçekliğini veya şiddetini ortadan kaldırmaz; belgelenmiş idamlar ve mülk müsaderesi vardır.","'Şehitlik anlatıları abartılıdır' tezi alanda TARTIŞMALIDIR; bazı tarihçiler erken şehitlik metinlerinin çekirdek tarihselliğini savunur.","Kaynak sorunu iki yönlüdür: hem şehitlik anlatıları hem de onları eleştiren yeniden değerlendirmeler ideolojik okumaya açıktır."],"open_questions":["Zulmün toplam ölçeği - kaç kişi, hangi dönemde - sayısal olarak bilinmiyor ve muhtemelen bilinemez."],"sources":[{"tier":"peer-reviewed","type":"article","authors":["de Ste. Croix, G. E. M."],"year":1963,"title":"Why Were the Early Christians Persecuted?","container":"Past & Present","volume":"26","language":"en","note":"Zulmün hukuki mekanizması ve düzensizliği üzerine alanın temel makalesi."},{"tier":"popular","type":"book","authors":["Moss, Candida"],"year":2013,"title":"The Myth of Persecution","publisher":"HarperOne","language":"en","note":"Akademisyen yazarın genel okur için kitabı; tezi alanda TARTIŞMALIDIR ve burada tek dayanak olarak kullanılmamıştır."}],"checked":"2026-09-07","used_in":["roma-hristiyanlik"]},{"id":"kilise-roma-idari-mirasi","claim":"Kilise, Roma'nın idari biçimini devraldı: piskoposluk bölgeleri imparatorluk idari birimlerinden, kilise binası mahkeme salonundan, kilise dili ve hukuk mantığı imparatorluktan geldi.","status":"established","confidence":"high","topic":["roma","hristiyanlik","kurumsal-sureklilik","mimarlik"],"subject":{"site":"Roma İmparatorluğu / Batı kilisesi","region":"Akdeniz havzası ve Batı Avrupa","modern_country":"çok uluslu"},"period":{"earliest":300,"latest":800,"era_label":"Geç antikçağdan erken Ortaçağ'a","precision":"range","dating_method":["textual","typology","historical-record"]},"languages":["Latince","Yunanca"],"disciplines":["tarih","mimarlik","hukuk","sanat-tarihi"],"people":[{"name":"Jones, A. H. M.","role":"analyst","affiliation":"University of Cambridge","year":1964,"lifespan":"1904-1970"},{"name":"Krautheimer, Richard","role":"analyst","year":1965,"lifespan":"1897-1994"}],"popular_claim":"Hristiyanlık Roma İmparatorluğu'nu ele geçirdi ve dönüştürdü.","divergence":"Uzun vadede daha belirleyici olan akış ters yöndedir: Roma, Hristiyanlığa kendi biçimini verdi. Kilise imparatorluğu ele geçirmedi - imparatorluğun BİÇİMİNİ GİYDİ. Batı'da devlet çözülürken ayakta kalan kurumun kilise olmasının sebebi de budur: Roma'nın idari iskeletini içinde taşıyordu.","divergence_type":["guncellenmemis","kategori-hatasi"],"evidence":["Piskoposluk bölgeleri (diocesis) imparatorluğun idari bölünmesini hem adıyla hem sınırlarıyla devraldı; bugünkü kilise haritası bir imparatorluk idare haritasının izini taşır.","Kiliseler pagan TAPINAK planında değil, Roma BAZİLİKASI - yani mahkeme ve ticaret için kullanılan kamu binası - planında yapıldı; sebep, cemaatin içeride toplanması gereğidir. Pagan tapınağında ayin dışarıda yapılırdı.","Batı kilisesi imparatorluğun idari dili Latince'yi benimsedi ve bin yıldan uzun süre korudu; Latince imparatorluk çöktükten sonra kilise sayesinde yaşadı.","Kilise uyuşmazlıkları Roma hukuk mantığıyla çözmeye başladı: yazılı kural, içtihat, yetki hiyerarşisi. Sonraki kanon hukuku bu kalıptan doğdu.","Roma'nın pagan başrahip unvanı pontifex maximus, imparatorlar tarafından taşındıktan sonra zamanla papalık unvanları arasına geçti."],"counter_evidence":["Etkileşim çift yönlüdür: kilise Roma biçimlerini alırken içeriklerini de değiştirdi; bazilika planı ayin ihtiyacına göre dönüştürüldü (apsis, transept).","Piskoposluk sınırlarının idari sınırlarla örtüşmesi her yerde tam değildir; özellikle Doğu'da ve sınır bölgelerinde sapmalar vardır."],"sources":[{"tier":"peer-reviewed","type":"book","authors":["Jones, A. H. M."],"year":1964,"title":"The Later Roman Empire 284-602: A Social, Economic and Administrative Survey","publisher":"Basil Blackwell","language":"en","note":"İdari birimlerin kilise örgütlenmesine geçişi için standart eser."},{"tier":"peer-reviewed","type":"book","authors":["Krautheimer, Richard"],"year":1965,"title":"Early Christian and Byzanti ext":"Agnostik bir metin eleştirmeni, varlığı reddeden konuma doğrudan cevap veren bir kitap yazmış ve tarihsel İsa'yı savunmuştur.","citations":[{"source_ref":"ehrman-2012-did-jesus-exist","locator":"Kitabın tezi","support_type":"direct"}]},{"id":"pavlus-tanisma","text":"En yakın kayıt Pavlus'un mektuplarıdır (y. 50'ler, ~23 yıl sonra) ve BİRİNCİ AĞIZDANDIR: 'Rab'bin kardeşi Yakup' ile görüştüğünü yazar - mucize değil, sıradan biyografik ayrıntı.","citations":[{"source_ref":"pavlus-galatyalilar-1-19","locator":"Galatyalılar 1:18-19","support_type":"direct"}]},{"id":"josephus-yakup","text":"Josephus, 93-94'te Yakup'u 'Mesih denilen İsa'nın kardeşi' diye tanımlar; kısa, geçerken söylenmiş, övgüsüz.","citations":[{"source_ref":"josephus-ant-20-200","locator":"Kitap 20, 200. paragraf","support_type":"direct"}]},{"id":"tacitus-kaydi","text":"Tacitus, y. 116'da Tiberius döneminde vali Pontius Pilatus tarafından idam edildiğini yazar; bağımsız ve açıkça küçümseyici bir Roma kaydıdır.","citations":[{"source_ref":"tacitus-annales-15-44","locator":"15. kitap, 44. bölüm","support_type":"direct"}]}],"counter_evidence":[{"id":"dort-tanik-yanlis","text":"Anlatılar tam bağımsız değildir: Matta ve Luka Markos'u kaynak alır. 'Dört bağımsız tanık' ifadesi YANLIŞTIR.","citations":[{"source_ref":"ehrman-2012-did-jesus-exist","locator":"Kaynak bağımlılığı tartışması","support_type":"counter"}]},{"id":"taraf-kaynaklar","text":"Bütün erken kaynaklar taraf olan kaynaklardır; taraf olmayan iki kayıt olaydan 60-90 yıl sonradır.","citations":[{"source_ref":"tacitus-on-jesus-wikipedia","locator":"Tarihlendirme bölümü","support_type":"counter"}]},{"id":"yanlilik-riski","text":"Yeni Ahit çalışmaları alanında kurumsal yanlılık riski gerçektir; bu kayıt onu Katolik/agnostik eşleşmesiyle karşılar ama tamamen ortadan kaldırmaz.","citations":[{"source_ref":"meier-1991-marginal-jew-1","locator":"Yöntem ve sınırlar","support_type":"context"}]},{"id":"yil-belirsiz","text":"İdam yılı 30 mu 33 mü kesinle lçüde özgün, 20 bazı eklemelerle özgün, 9 birçok eklemeyle özgün, 13 tamamı sonradan eklenmiş. Yani %56'lık orta grup 'özgün çekirdek + müdahale' modelinde birleşiyor, %25'lik azınlık tamamen reddediyor.","divergence_type":["ideolojik-secim","medya-abartisi"],"evidence":["Bir Yahudi tarihçinin kaleminden 'O, Mesih'ti' cümlesi çıkmaz; bu ifadenin eklendiği neredeyse evrensel kabul görür.","9.-10. yüzyıla ait Arapça ve Süryanice aktarımlar pasajı büyük ölçüde aynı biçimde veriyor AMA en şüpheli iki ifadeyi - 'O, Mesih'ti' ve 'eğer ona insan denebilirse' - içermiyor. Müdahale öncesi hâle dair bağımsız bir iz.","Aynı eserin 20.200'ündeki Yakup pasajı kısa ve övgüsüz; bir Hristiyan kopyacının orada da müdahale etmiş olması beklenirdi, etmemiş."],"counter_evidence":["%25'lik azınlık (13/52) pasajın TAMAMININ eklendiğini savunuyor ve bu görüş yaşayan bir görüştür - küçümsenerek geçilemez.","Elimizdeki tüm Grekçe elyazmaları Hristiyan kopyalama geleneğinden gelir; müdahale öncesi bir Grekçe tanık yoktur.","Arapça/Süryanice aktarımların bağımsızlığı da tartışmalıdır; ortak bir ara kaynaktan gelmiş olabilirler.","Sayısal dağılım bir ANKET değil, yayımlanmış görüşlerin derlemesidir; alanın tamamının sayımı sayılamaz."],"open_questions":["Pasajın özgün hâli neydi? Kesin metin elde yok.","Arapça ve Süryanice aktarımlar gerçekten bağımsız mı?"],"sources":[{"tier":"primary","type":"edition","authors":["Flavius Josephus"],"year":93,"title":"Antiquitates Judaicae 18.63-64 (Testimonium Flavianum)","language":"grc"},{"tier":"institutional","type":"webpage","title":"Josephus and Jesus: The Testimonium Flavianum Question","url":"https://www.earlychristianwritings.com/testimonium.html","language":"en","accessed":"2026-09-07","note":"52 akademisyenlik pozisyon derlemesinin kaynağı; anket değil, literatür taraması."}],"checked":"2026-09-07","volatile":true,"used_in":["isa-tarihsellik"]},{"schema_version":2,"id":"tacitus-procurator-anakronizmi","claim":"Tacitus'un Pilatus'a yanlış unvan (pr
