<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Yazı yükleniyor — İnsanlık Tarihi</title>
  <style>
    :root{color-scheme:light dark;font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f2efe7;color:#171a18}
    .loader{width:min(520px,calc(100% - 2rem));padding:2rem;border:1px solid #d8d4ca;border-radius:20px;background:#fbf9f3;box-shadow:0 24px 80px rgba(25,33,30,.12)}
    .loader b{display:block;font:600 2rem Georgia,serif;margin-bottom:.6rem}.loader p{margin:0;color:#59605d}.bar{height:3px;margin-top:1.4rem;background:#dde9e4;overflow:hidden}.bar::before{content:"";display:block;width:45%;height:100%;background:#0d5c4f;animation:load 1s ease-in-out infinite alternate}@keyframes load{to{transform:translateX(122%)}}
    .error a{color:#0d5c4f;font-weight:700}
  </style>
</head>
<body>
  <main class="loader" id="loader" aria-live="polite"><b>Araştırma dosyası hazırlanıyor…</b><p>Metin ve editoryal görsel katman birleştiriliyor.</p><div class="bar" aria-hidden="true"></div></main>
  <script>
    (() => {
      'use strict';
      const allowed = new Set([
        'olu-deniz-parsomenleri','tufan-bilmecesi','hatirlamadigimiz-felaketler','babil','ayni-cumlede','petra','shushtar','stonehenge','sumer','angkor','tas-tepeler','machu-picchu','chichen-itza','kapadokya','persepolis','iskenderiye','milankovic','roma-etki','roma-hristiyanlik','isa-tarihsellik','mit-ve-sicil','gokteki-ayi','gec-kalan-haberci','kendi-kaniti','calinan-ates','herkesin-saati','yilin-iki-kapisi'
      ]);
      const slug = new URLSearchParams(location.search).get('slug') || '';
      const fail = message => {
        const loader = document.getElementById('loader');
        loader.classList.add('error');
        loader.innerHTML = `<b>Dosya açılamadı.</b><p>${message} <a href="index.html">Arşive dönün</a>.</p>`;
      };
      if (!allowed.has(slug)) { fail('Geçersiz veya eksik yazı kimliği.'); return; }

      fetch(`articles/${encodeURIComponent(slug)}.html`, { cache:'no-store' })
        .then(response => {
          if (!response.ok) throw new Error(`HTTP ${response.status}`);
          return response.text();
        })
        .then(source => {
          const layer = `<base href="./"><link rel="stylesheet" href="assets/article-visuals.css"><script src="assets/visuals-scenes-1.js" defer><\/script><script src="assets/visuals-scenes-2.js" defer><\/script><script src="assets/visuals-scenes-3.js" defer><\/script><script src="assets/visuals-scenes-4.js" defer><\/script><script src="assets/visuals.js" defer><\/script><script src="assets/editorial-meta.js" defer><\/script><script src="assets/covers-data/${encodeURIComponent(slug)}.js" defer><\/script><script src="assets/article-visuals.js" defer><\/script>`;
          document.open();
          document.write(layer + source);
          document.close();
        })
        .catch(() => fail('Yerel makale dosyası bulunamadı veya okunamadı.'));
    })();
  </script>
</body>
</html>
